<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1905" width="1180" height="1905" font-family="&quot;PingFang SC&quot;,&quot;Hiragino Sans GB&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif">
<defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b98ab" /></marker><marker id="arw-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C26060" /></marker></defs>
<rect width="1180" height="1905" fill="#ffffff" y="0" />
<text x="56" y="36" font-size="17" font-weight="700" fill="#1f2937">优坐标 · 业务流程（泳道串联）</text>
<text x="56" y="58" font-size="11.5" fill="#6b7280">泳道 = 责任方；流程按实际发生顺序自上而下串联；「指定老师 / 发布需求」分支后汇合；待上课期间任一方可发起请假，另一方一次响应后判断结果：改期生效 / 取消由平台记录并归还冻结课时</text>
<rect x="56" y="78" width="420" height="1765" rx="12" fill="#EAF0FB" stroke="#C6D3EC" stroke-width="1.2" />
<path d="M56,122 H476" stroke="#C6D3EC" stroke-width="1.2" fill="none" />
<text x="74" y="106" font-size="13.5" font-weight="700" fill="#1e3f74">教师端</text>
<rect x="476" y="78" width="380" height="1765" rx="12" fill="#EAF5EE" stroke="#C6DECE" stroke-width="1.2" />
<path d="M476,122 H856" stroke="#C6DECE" stroke-width="1.2" fill="none" />
<text x="494" y="106" font-size="13.5" font-weight="700" fill="#235c37">家长端</text>
<rect x="856" y="78" width="300" height="1765" rx="12" fill="#F2F1F8" stroke="#D8D4E8" stroke-width="1.2" />
<path d="M856,122 H1156" stroke="#D8D4E8" stroke-width="1.2" fill="none" />
<text x="874" y="106" font-size="13.5" font-weight="700" fill="#4b3a78">平台</text>
<line x1="28" y1="136" x2="28" y2="1817" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arw)" />
<text x="18" y="925" font-size="10.5" fill="#94a3b8" transform="rotate(-90 18 822)" text-anchor="middle">时间顺序</text>
<g><path d="M266,221 L266,253" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M266,324 L266,333 Q266,341 274,341 L658,341 Q666,341 666,349 L666,356" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M666,412 L666,444" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M666,500 L666,532" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M666,603 L666,635" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M666,723 L666,732 Q666,740 658,740 L176.5,740 Q168.5,740 168.5,748 L168.5,755" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M666,723 L666,732 Q666,740 658,740 L371.5,740 Q363.5,740 363.5,748 L363.5,755" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M363.5,826 L363.5,835 Q363.5,843 371.5,843 L658,843 Q666,843 666,851 L666,858" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M168.5,826 L168.5,938 Q168.5,946 176.5,946 L998,946 Q1006,946 1006,954 L1006,961" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M666,929 L666,938 Q666,946 674,946 L998,946" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" /><path d="M1006,1032 L1006,1049 Q1006,1057 998,1057 L486,1057 Q476,1057 476,1063" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M476,1358 Q476,1366 484,1366 L998,1366 Q1006,1366 1006,1374" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M1006,1444 L1006,1453 Q1006,1461 998,1461 L274,1461 Q266,1461 266,1469 L266,1476" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M266,1547 L266,1556 Q266,1564 274,1564 L658,1564 Q666,1564 666,1572 L666,1579" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M666,1635 L666,1667" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M666,1723 L666,1732 Q666,1740 674,1740 L998,1740 Q1006,1740 1006,1748 L1006,1755" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M476,1135 L476,1167" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /><path d="M476,1238 L476,1262" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)" /></g>
<circle cx="666" cy="724" r="3.4" fill="#8b98ab" />
<rect x="78" y="152" width="376" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5" /><circle cx="98" cy="171" r="10.5" fill="#2F5597" /><text x="98" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text><text x="116" y="176" font-size="13" font-weight="700" fill="#1e3f74">维护可约时段</text><text x="116" y="194" font-size="10.5" fill="#5b6577">四类时间：工作日白天 / 晚上 · 周末白天 / 晚上</text><text x="116" y="209" font-size="10.5" fill="#5b6577">特殊日期可单独设置：全天开放 / 不开放 / 自定义时段</text>
<rect x="78" y="255" width="376" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5" /><circle cx="98" cy="274" r="10.5" fill="#2F5597" /><text x="98" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text><text x="116" y="279" font-size="13" font-weight="700" fill="#1e3f74">发布可约时间</text><text x="116" y="297" font-size="10.5" fill="#5b6577">保存后形成可约范围</text><text x="116" y="312" font-size="10.5" fill="#5b6577">作为家长选老师 / 发布需求的匹配依据</text>
<rect x="498" y="358" width="336" height="54" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5" /><circle cx="518" cy="377" r="10.5" fill="#3F7C50" /><text x="518" y="381" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text><text x="536" y="382" font-size="13" font-weight="700" fill="#235c37">购买课程</text><text x="536" y="400" font-size="10.5" fill="#5b6577">选择课时包 → 下单 → 支付成功，课时进入学员账户</text>
<rect x="498" y="446" width="336" height="54" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5" /><circle cx="518" cy="465" r="10.5" fill="#3F7C50" /><text x="518" y="469" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text><text x="536" y="470" font-size="13" font-weight="700" fill="#235c37">确认学员与课程</text><text x="536" y="488" font-size="10.5" fill="#5b6577">选择上课学员与对应课程科目</text>
<rect x="498" y="534" width="336" height="69" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5" /><circle cx="518" cy="553" r="10.5" fill="#3F7C50" /><text x="518" y="557" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">5</text><text x="536" y="558" font-size="13" font-weight="700" fill="#235c37">设置固定上课计划</text><text x="536" y="576" font-size="10.5" fill="#5b6577">开始日期 ~ 结束日期（各年级开学 / 放假时间不同）</text><text x="536" y="591" font-size="10.5" fill="#5b6577">每周上课时段可多选，形成固定周课表</text>
<polygon points="666,637 816,680 666,723 516,680" fill="#FFF9EE" stroke="#B07A24" stroke-width="1.6" /><text x="666" y="674" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a5d13">选择约课方式</text><text x="666" y="696" text-anchor="middle" font-size="10.5" fill="#5b6577">A 指定老师　　B 发布需求</text>
<rect x="78" y="757" width="181" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5" /><circle cx="98" cy="776" r="10.5" fill="#B07A24" /><text x="98" y="780" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">A</text><text x="116" y="781" font-size="13" font-weight="700" fill="#1e3f74">教师确认约课</text><text x="116" y="799" font-size="10.5" fill="#5b6577">指定老师提交的约课</text><text x="116" y="814" font-size="10.5" fill="#5b6577">教师确认后即生效</text>
<rect x="273" y="757" width="181" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5" /><circle cx="293" cy="776" r="10.5" fill="#B07A24" /><text x="293" y="780" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">B</text><text x="311" y="781" font-size="13" font-weight="700" fill="#1e3f74">抢单大厅接单</text><text x="311" y="799" font-size="10.5" fill="#5b6577">需求进入抢单大厅</text><text x="311" y="814" font-size="10.5" fill="#5b6577">教师抢单接单</text>
<rect x="498" y="860" width="336" height="69" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5" /><circle cx="518" cy="879" r="10.5" fill="#B07A24" /><text x="518" y="883" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">B</text><text x="536" y="884" font-size="13" font-weight="700" fill="#235c37">家长确认接单老师</text><text x="536" y="902" font-size="10.5" fill="#5b6577">仅「发布需求」方式需要</text><text x="536" y="917" font-size="10.5" fill="#5b6577">双方确认后需求正式生效</text>
<rect x="878" y="963" width="256" height="69" rx="10" fill="#F7F5FC" stroke="#6F53A0" stroke-width="1.5" /><circle cx="898" cy="982" r="10.5" fill="#6F53A0" /><text x="898" y="986" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">6</text><text x="916" y="987" font-size="13" font-weight="700" fill="#4b3a78">预约生效 · 拆分</text><text x="916" y="1005" font-size="10.5" fill="#5b6577">按固定周课表拆分为独立单节课程</text><text x="916" y="1020" font-size="10.5" fill="#5b6577">同步进入两端「待上课」列表</text>
<rect x="878" y="1375" width="256" height="69" rx="10" fill="#F7F5FC" stroke="#6F53A0" stroke-width="1.5" /><circle cx="898" cy="1394" r="10.5" fill="#6F53A0" /><text x="898" y="1398" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">10</text><text x="916" y="1399" font-size="13" font-weight="700" fill="#4b3a78">到校扫码签到 · 扣课时</text><text x="916" y="1417" font-size="10.5" fill="#5b6577">扫码后由平台 / 三方平台记录</text><text x="916" y="1432" font-size="10.5" fill="#5b6577">签到成功按课时扣减 → 待反馈</text>
<rect x="78" y="1478" width="376" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5" /><circle cx="98" cy="1497" r="10.5" fill="#2F5597" /><text x="98" y="1501" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">11</text><text x="116" y="1502" font-size="13" font-weight="700" fill="#1e3f74">填写课后反馈</text><text x="116" y="1520" font-size="10.5" fill="#5b6577">课程内容 / 课后反馈 / 作业要求</text><text x="116" y="1535" font-size="10.5" fill="#5b6577">提交后订单进入「已完成」</text>
<rect x="498" y="1581" width="336" height="54" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5" /><circle cx="518" cy="1600" r="10.5" fill="#3F7C50" /><text x="518" y="1604" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">12</text><text x="536" y="1605" font-size="13" font-weight="700" fill="#235c37">查看反馈与作业</text><text x="536" y="1623" font-size="10.5" fill="#5b6577">在课程详情 / 上课记录中查看</text>
<rect x="498" y="1669" width="336" height="54" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5" /><circle cx="518" cy="1688" r="10.5" fill="#3F7C50" /><text x="518" y="1692" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">13</text><text x="536" y="1693" font-size="13" font-weight="700" fill="#235c37">提交课程评价</text><text x="536" y="1711" font-size="10.5" fill="#5b6577">老师评分 + 文字评价，写回订单（已评价）</text>
<rect x="878" y="1757" width="256" height="54" rx="10" fill="#F7F5FC" stroke="#6F53A0" stroke-width="1.5" /><circle cx="898" cy="1776" r="10.5" fill="#6F53A0" /><text x="898" y="1780" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">14</text><text x="916" y="1781" font-size="13" font-weight="700" fill="#4b3a78">单节课闭环完成</text><text x="916" y="1799" font-size="10.5" fill="#5b6577">其余课时按同一链路继续</text>
<rect x="56" y="1854" width="16" height="14" rx="4" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.4" />
<text x="80" y="1865" font-size="11" fill="#4b5563">教师端动作</text>
<rect x="169" y="1854" width="16" height="14" rx="4" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.4" />
<text x="193" y="1865" font-size="11" fill="#4b5563">家长端动作</text>
<rect x="282" y="1854" width="16" height="14" rx="4" fill="#F7F5FC" stroke="#6F53A0" stroke-width="1.4" />
<text x="306" y="1865" font-size="11" fill="#4b5563">平台 / 系统动作</text>
<rect x="416.56" y="1854" width="16" height="14" rx="4" fill="#FFF9EE" stroke="#B07A24" stroke-width="1.4" />
<text x="440.56" y="1865" font-size="11" fill="#4b5563">判断 / 选择分支（如 A / B、改期 / 取消）</text>
<rect x="710" y="1854" width="16" height="14" rx="4" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4" /><text x="734" y="1865" font-size="11" fill="#4b5563">跨泳道节点（双方均可发起 / 响应）</text>
<rect x="306" y="1066" width="340" height="69" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" /><circle cx="326" cy="1085" r="10.5" fill="#64748B" /><text x="326" y="1089" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">7</text><text x="344" y="1090" font-size="13" font-weight="700" fill="#334155">待上课 · 双方均可发起请假</text><text x="344" y="1108" font-size="10.5" fill="#5b6577">填写原因：调整时间（须选新时段）/ 直接取消本次排课</text><text x="344" y="1123" font-size="10.5" fill="#5b6577">距开课不足 2 小时不可发起 · 对方响应前可撤回</text>
<rect x="306" y="1169" width="340" height="69" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" /><circle cx="326" cy="1188" r="10.5" fill="#64748B" /><text x="326" y="1192" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">8</text><text x="344" y="1193" font-size="13" font-weight="700" fill="#334155">另一方确认 · 一次响应</text><text x="344" y="1211" font-size="10.5" fill="#5b6577">只能「按新时间确认」或「直接取消课程」，不设拒绝</text><text x="344" y="1226" font-size="10.5" fill="#5b6577">一次响应即终态，无需二次确认</text>
<polygon points="476,1270 626,1314 476,1358 326,1314" fill="#FFF9EE" stroke="#B07A24" stroke-width="1.6" /><circle cx="476" cy="1292" r="10.5" fill="#B07A24" /><text x="476" y="1296" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">9</text><text x="476" y="1317" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a5d13">判断 · 响应结果</text><text x="476" y="1338" text-anchor="middle" font-size="10.5" fill="#5b6577">改期生效 / 直接取消</text>
<text x="468" y="1372" text-anchor="end" font-size="9.5" fill="#8a5d13">改期生效 → 继续待上课</text><text x="750" y="1306" text-anchor="middle" font-size="9.5" fill="#A33A3A">直接取消</text><path d="M626,1314 L870,1314" fill="none" stroke="#C26060" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw-red)" />
<rect x="878" y="1279" width="256" height="70" rx="10" fill="#FDF2F2" stroke="#C26060" stroke-width="1.5" />
<text x="896" y="1303" font-size="13" font-weight="700" fill="#A33A3A">平台记录取消 · 归还课时</text><text x="896" y="1321" font-size="10.5" fill="#5b6577">一方直接取消后由平台记录处理</text><text x="896" y="1336" font-size="10.5" fill="#5b6577">冻结课时归还学员，课次结束</text>
</svg>
