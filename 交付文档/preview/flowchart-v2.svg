<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1594" width="1180" height="1594" font-family='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif'>
<defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#8b98ab"/></marker></defs>
<rect width="1180" height="1594" fill="#ffffff"/>
