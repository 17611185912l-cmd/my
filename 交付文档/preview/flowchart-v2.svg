inejoin="round" marker-end="url(#arw)"/><path d="M666,1326 L666,1358" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)"/><path d="M666,1414 L666,1423 Q666,1431 674,1431 L998,1431 Q1006,1431 1006,1439 L1006,1446" fill="none" stroke="#8b98ab" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arw)"/></g>
<circle cx="666" cy="724" r="3.4" fill="#8b98ab"/>
<rect x="78" y="152" width="376" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5"/><circle cx="98" cy="171" r="10.5" fill="#2F5597"/><text x="98" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">1</text><text x="116" y="176" font-size="13" font-weight="700" fill="#1e3f74">维护可约时段</text><text x="116" y="194" font-size="10.5" fill="#5b6577">四类时间：工作日白天 / 晚上 · 周末白天 / 晚上</text><text x="116" y="209" font-size="10.5" fill="#5b6577">特殊日期可单独设置：全天开放 / 不开放 / 自定义时段</text>
<rect x="78" y="255" width="376" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5"/><circle cx="98" cy="274" r="10.5" fill="#2F5597"/><text x="98" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">2</text><text x="116" y="279" font-size="13" font-weight="700" fill="#1e3f74">发布可约时间</text><text x="116" y="297" font-size="10.5" fill="#5b6577">保存后形成可约范围</text><text x="116" y="312" font-size="10.5" fill="#5b6577">作为家长选老师 / 发布需求的匹配依据</text>
<rect x="498" y="358" width="336" height="54" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5"/><circle cx="518" cy="377" r="10.5" fill="#3F7C50"/><text x="518" y="381" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">3</text><text x="536" y="382" font-size="13" font-weight="700" fill="#235c37">购买课程</text><text x="536" y="400" font-size="10.5" fill="#5b6577">选择课时包 → 下单 → 支付成功，课时进入学员账户</text>
<rect x="498" y="446" width="336" height="54" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5"/><circle cx="518" cy="465" r="10.5" fill="#3F7C50"/><text x="518" y="469" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">4</text><text x="536" y="470" font-size="13" font-weight="700" fill="#235c37">确认学员与课程</text><text x="536" y="488" font-size="10.5" fill="#5b6577">选择上课学员与对应课程科目</text>
<rect x="498" y="534" width="336" height="69" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5"/><circle cx="518" cy="553" r="10.5" fill="#3F7C50"/><text x="518" y="557" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">5</text><text x="536" y="558" font-size="13" font-weight="700" fill="#235c37">设置固定上课计划</text><text x="536" y="576" font-size="10.5" fill="#5b6577">开始日期 ~ 结束日期（各年级开学 / 放假时间不同）</text><text x="536" y="591" font-size="10.5" fill="#5b6577">每周上课时段可多选，形成固定周课表</text>
<polygon points="666,637 816,680 666,723 516,680" fill="#FFF9EE" stroke="#B07A24" stroke-width="1.6"/><text x="666" y="674" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a5d13">选择约课方式</text><text x="666" y="696" text-anchor="middle" font-size="10.5" fill="#5b6577">A 指定老师　　B 发布需求</text>
<rect x="78" y="757" width="181" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5"/><circle cx="98" cy="776" r="10.5" fill="#B07A24"/><text x="98" y="780" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">A</text><text x="116" y="781" font-size="13" font-weight="700" fill="#1e3f74">教师确认约课</text><text x="116" y="799" font-size="10.5" fill="#5b6577">指定老师提交的约课</text><text x="116" y="814" font-size="10.5" fill="#5b6577">教师确认后即生效</text>
<rect x="273" y="757" width="181" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5"/><circle cx="293" cy="776" r="10.5" fill="#B07A24"/><text x="293" y="780" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">B</text><text x="311" y="781" font-size="13" font-weight="700" fill="#1e3f74">抢单大厅接单</text><text x="311" y="799" font-size="10.5" fill="#5b6577">需求进入抢单大厅</text><text x="311" y="814" font-size="10.5" fill="#5b6577">教师抢单接单</text>
<rect x="498" y="860" width="336" height="69" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5"/><circle cx="518" cy="879" r="10.5" fill="#B07A24"/><text x="518" y="883" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">B</text><text x="536" y="884" font-size="13" font-weight="700" fill="#235c37">家长确认接单老师</text><text x="536" y="902" font-size="10.5" fill="#5b6577">仅「发布需求」方式需要</text><text x="536" y="917" font-size="10.5" fill="#5b6577">双方确认后需求正式生效</text>
<rect x="878" y="963" width="256" height="69" rx="10" fill="#F7F5FC" stroke="#6F53A0" stroke-width="1.5"/><circle cx="898" cy="982" r="10.5" fill="#6F53A0"/><text x="898" y="986" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">6</text><text x="916" y="987" font-size="13" font-weight="700" fill="#4b3a78">预约生效 · 拆分</text><text x="916" y="1005" font-size="10.5" fill="#5b6577">按固定周课表拆分为独立单节课程</text><text x="916" y="1020" font-size="10.5" fill="#5b6577">同步进入两端「待上课」列表</text>
<rect x="878" y="1066" width="256" height="69" rx="10" fill="#F7F5FC" stroke="#6F53A0" stroke-width="1.5"/><circle cx="898" cy="1085" r="10.5" fill="#6F53A0"/><text x="898" y="1089" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">7</text><text x="916" y="1090" font-size="13" font-weight="700" fill="#4b3a78">到校扫码签到 · 扣课时</text><text x="916" y="1108" font-size="10.5" fill="#5b6577">扫码后由平台 / 三方平台记录</text><text x="916" y="1123" font-size="10.5" fill="#5b6577">签到成功按课时扣减 → 待反馈</text>
<rect x="78" y="1169" width="376" height="69" rx="10" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.5"/><circle cx="98" cy="1188" r="10.5" fill="#2F5597"/><text x="98" y="1192" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">8</text><text x="116" y="1193" font-size="13" font-weight="700" fill="#1e3f74">填写课后反馈</text><text x="116" y="1211" font-size="10.5" fill="#5b6577">课程内容 / 课后反馈 / 作业要求</text><text x="116" y="1226" font-size="10.5" fill="#5b6577">提交后订单进入「已完成」</text>
<rect x="498" y="1272" width="336" height="54" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5"/><circle cx="518" cy="1291" r="10.5" fill="#3F7C50"/><text x="518" y="1295" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">9</text><text x="536" y="1296" font-size="13" font-weight="700" fill="#235c37">查看反馈与作业</text><text x="536" y="1314" font-size="10.5" fill="#5b6577">在课程详情 / 上课记录中查看</text>
<rect x="498" y="1360" width="336" height="54" rx="10" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.5"/><circle cx="518" cy="1379" r="10.5" fill="#3F7C50"/><text x="518" y="1383" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">10</text><text x="536" y="1384" font-size="13" font-weight="700" fill="#235c37">提交课程评价</text><text x="536" y="1402" font-size="10.5" fill="#5b6577">老师评分 + 文字评价，写回订单（已评价）</text>
<rect x="878" y="1448" width="256" height="54" rx="10" fill="#F7F5FC" stroke="#6F53A0" stroke-width="1.5"/><circle cx="898" cy="1467" r="10.5" fill="#6F53A0"/><text x="898" y="1471" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">11</text><text x="916" y="1472" font-size="13" font-weight="700" fill="#4b3a78">单节课闭环完成</text><text x="916" y="1490" font-size="10.5" fill="#5b6577">其余课时按同一链路继续</text>
<rect x="56" y="1543" width="16" height="14" rx="4" fill="#F2F6FC" stroke="#2F5597" stroke-width="1.4"/>
<text x="80" y="1554" font-size="11" fill="#4b5563">教师端动作</text>
<rect x="169" y="1543" width="16" height="14" rx="4" fill="#F4FBF6" stroke="#3F7C50" stroke-width="1.4"/>
<text x="193" y="1554" font-size="11" fill="#4b5563">家长端动作</text>
<rect x="282" y="1543" width="16" height="14" rx="4" fill="#F7F5FC" stroke="#6F53A0" stroke-width="1.4"/>
<text x="306" y="1554" font-size="11" fill="#4b5563">平台 / 系统动作</text>
<rect x="416.56" y="1543" width="16" height="14" rx="4" fill="#FFF9EE" stroke="#B07A24" stroke-width="1.4"/>
<text x="440.56" y="1554" font-size="11" fill="#4b5563">需选择的两种方式（A / B）</text>
