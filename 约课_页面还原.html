    const state = { courseId: 'function', defaultTeacherId: '', defaultReason: '', historyCount: 0, teacherId: '', switching: false, date: '', selected: {} };
    const CLASS_MINUTES = YZB.DEFAULT_CLASS_MINUTES;
    const CLASS_LESSONS = YZB.DEFAULT_CLASS_LESSONS;
    const CLASS_LABEL = '1.5 小时';
    const courseList = document.querySelector('#courseList');
    const teacherCard = document.querySelector('#teacherCard');
    const teacherList = document.querySelector('#teacherList');
    const switchTeacher = document.querySelector('#switchTeacher');
    const dayList = document.querySelector('#dayList');
    const slotList = document.querySelector('#slotList');
    const summary = document.querySelector('#summary');
    const submit = document.querySelector('#submit');
    const toast = document.querySelector('#toast');
    const confirmMask = document.querySelector('#confirmMask');
    const confirmDialog = document.querySelector('#confirmDialog');
    const confirmSummary = document.querySelector('#confirmSummary');
    const confirmList = document.querySelector('#confirmList');
    const confirmSubmit = document.querySelector('#confirmSubmit');

    document.querySelector('.back').onclick = () => location.href = '学习中心_页面还原.html';

    function showToast(text) { toast.textContent = text; toast.classList.add('show'); }
    function courseById(id) { return YZB.courses().filter(item => item.id === id)[0]; }
    function clearSchedule() { state.date = ''; state.selected = {}; }

    function renderHours() {
      const hours = YZB.hours();
      document.querySelector('#hoursNote').innerHTML =
        `本课程剩余 <b>${hours.available}</b> 课时 · 本次约 <b>${CLASS_LABEL}</b>（<b>${CLASS_LESSONS}</b> 课时）<br>老师确认后冻结，签到成功后扣减`;
    }

    function renderCourses() {
      const hours = YZB.hours();
      courseList.innerHTML = YZB.courses().map(course => `
        <button class="bk-course ${course.id === state.courseId ? 'active' : ''}" type="button" data-course="${course.id}">
          <span class="bk-teacher-copy"><strong>${course.name}</strong><span>${course.grade} · ${course.subject} · ${course.mode}</span><span class="bk-course-duration">每节 ${CLASS_LABEL} · 消耗 ${CLASS_LESSONS} 课时</span></span>
          <span class="bk-badge">剩余 <b>${hours.available}</b> 课时</span>
        </button>`).join('');
    }

    function renderTeacher() {
      const options = YZB.teachersFor(state.courseId);
      if (!options.some(item => item.id === state.teacherId)) {
        const recommend = YZB.recommendTeacher(STUDENT, state.courseId);
        state.defaultTeacherId = recommend ? recommend.teacherId : '';
        state.defaultReason = recommend ? recommend.reason : '';
        state.historyCount = recommend ? recommend.count : 0;
        state.teacherId = state.defaultTeacherId;
        clearSchedule();
      }
      const teacher = YZB.teacher(state.teacherId);
      if (!teacher) {
        teacherCard.hidden = true;
        teacherList.hidden = true;
        switchTeacher.hidden = true;
        return;
      }
      teacherCard.hidden = false;
      switchTeacher.hidden = false;
      const isDefault = state.teacherId === state.defaultTeacherId;
      const reason = isDefault
        ? (state.defaultReason === 'history' ? `曾给${STUDENT}上过 ${state.historyCount} 次这门课` : '首次约课 · 系统自动匹配')
        : '手动更换';
      document.querySelector('#teacherAvatar').textContent = teacher.avatar;
      document.querySelector('#teacherName').textContent = teacher.name;
      document.querySelector('#teacherReason').textContent = reason;
      document.querySelector('#teacherMeta').textContent = `${teacher.intro} · ${teacher.years} 年教学 · ${teacher.score} 分`;
      document.querySelector('#teacherOpen').textContent = `空闲时间：${YZB.availabilityLabel(teacher.id)} · 未来 4 周可约 ${YZB.teacherFreeCount(teacher.id)} 个时段`;
      switchTeacher.textContent = state.switching ? '收起' : '更换';
      teacherList.hidden = !state.switching;
      teacherList.innerHTML = options.map(item => {
        const tag = item.id === state.defaultTeacherId ? '<em class="bk-reason">推荐</em>' : '';
        return `
        <button class="bk-teacher ${item.id === state.teacherId ? 'active' : ''}" type="button" data-teacher="${item.id}">
          <span class="bk-mark">${item.avatar}</span>
          <span class="bk-teacher-copy"><strong>${item.name}${tag}</strong><span>${item.intro} · ${item.score} 分</span><span>空闲时间：${YZB.availabilityLabel(item.id)}</span></span>
          <span class="bk-badge">${YZB.teacherFreeCount(item.id)} 个时段</span>
        </button>`;
      }).join('');
    }

    function renderDays() {
      const days = YZB.teacherDayOptions(state.teacherId);
      if (!days.some(day => day.date === state.date && day.count)) {
        const first = days.filter(day => day.count)[0];
        state.date = first ? first.date : '';
      }
      dayList.innerHTML = days.map(day => `
        <button class="bk-day ${day.date === state.date ? 'active' : ''}" type="button" data-date="${day.date}"${day.count ? '' : ' disabled'}>
          <strong>${day.label}</strong>
          <span>${day.week} · ${Object.keys(state.selected).filter(key => key.startsWith(day.date + '|')).length ? '已选 ' + Object.keys(state.selected).filter(key => key.startsWith(day.date + '|')).length : day.count ? day.count + ' 个时段' : '不可约'}</span>
        </button>`).join('');
    }

    function renderSlots() {
      if (!state.date) { slotList.innerHTML = '<div class="bk-empty">该老师未来 4 周暂无可约时段</div>'; return; }
      const slots = YZB.teacherSlotOptions(state.teacherId, state.date);
      slotList.innerHTML = slots.map(slot => {
        const chosen = !!state.selected[state.date + '|' + slot.time];
        const note = chosen ? '已选择' : slot.state === 'open' ? '可约' : slot.state === 'booked' ? '已被约' : '未开放';
        return `
        <button class="bk-slot${chosen ? ' active' : ''}" type="button" data-state="${slot.state}" data-time="${slot.time}"${slot.state === 'open' ? '' : ' disabled'}>
          ${slot.time}<small>${note}</small>
        </button>`;
      }).join('');
    }

    function selectedSessions() {
      return Object.values(state.selected).sort((a, b) => (a.date + ' ' + a.time).localeCompare(b.date + ' ' + b.time));
    }

    function closeConfirm() {
      confirmMask.hidden = true;
      confirmDialog.hidden = true;
    }

    function openConfirm() {
      const sessions = selectedSessions();
      const teacher = YZB.teacher(state.teacherId);
      const totalLessons = CLASS_LESSONS * sessions.length;
      confirmSummary.innerHTML = `${teacher.name} · 共 <b>${sessions.length}</b> 节 · 确认后冻结 <b>${totalLessons}</b> 课时`;
      confirmList.innerHTML = sessions.map(session => {
        const day = YZB.dayInfo(session.date);
        return `<div class="confirm-row"><span>${day.label} ${day.week}</span><b>${session.time}</b></div>`;
      }).join('');
      confirmMask.hidden = false;
      confirmDialog.hidden = false;
    }

    function renderSummary() {
      const teacher = YZB.teacher(state.teacherId);
      const hours = YZB.hours();
      const sessions = selectedSessions();
      const totalLessons = CLASS_LESSONS * sessions.length;
      if (!teacher || !sessions.length) summary.textContent = '请选择一个或多个上课时间';
      else if (hours.available < totalLessons) summary.textContent = `剩余 ${hours.available} 课时，本次共需 ${totalLessons} 课时`;
      else summary.innerHTML = `已选 <b>${sessions.length}</b> 节 · ${teacher.name} · 确认后冻结 <b>${totalLessons}</b> 课时`;
      submit.disabled = !teacher || !sessions.length || hours.available < totalLessons;
    }

    function refreshAll() { renderCourses(); renderTeacher(); renderDays(); renderSlots(); renderSummary(); renderHours(); }

    courseList.addEventListener('click', event => {
      const button = event.target.closest('[data-course]');
      if (!button) return;
      state.courseId = button.dataset.course;
      state.teacherId = '';
      state.switching = false;
      clearSchedule();
      refreshAll();
    });

    switchTeacher.addEventListener('click', () => {
      state.switching = !state.switching;
      renderTeacher();
    });

    teacherList.addEventListener('click', event => {
      const button = event.target.closest('[data-teacher]');
      if (!button) return;
      state.teacherId = button.dataset.teacher;
      state.switching = false;
      clearSchedule();
      refreshAll();
    });

    dayList.addEventListener('click', event => {
      const button = event.target.closest('[data-date]');
      if (!button || button.disabled) return;
      state.date = button.dataset.date;
      renderDays(); renderSlots(); renderSummary();
    });

    slotList.addEventListener('click', event => {
      const button = event.target.closest('.bk-slot');
      if (!button || button.disabled) return;
      const key = state.date + '|' + button.dataset.time;
      if (state.selected[key]) delete state.selected[key];
      else state.selected[key] = { date: state.date, time: button.dataset.time };
      renderDays(); renderSlots(); renderSummary();
    });

    submit.addEventListener('click', () => {
      const teacher = YZB.teacher(state.teacherId);
      const hours = YZB.hours();
      const sessions = selectedSessions();
      if (!teacher || !sessions.length) { showToast('请先选择一个或多个上课时间'); return; }
      const totalLessons = CLASS_LESSONS * sessions.length;
      if (hours.available < totalLessons) { showToast(`剩余课时不足，本次约课共需 ${totalLessons} 课时`); return; }
      openConfirm();
    });

    document.querySelector('#confirmClose').addEventListener('click', closeConfirm);
    document.querySelector('#confirmCancel').addEventListener('click', closeConfirm);
    confirmMask.addEventListener('click', closeConfirm);

    confirmSubmit.addEventListener('click', () => {
      const course = courseById(state.courseId);
      const teacher = YZB.teacher(state.teacherId);
      const sessions = selectedSessions();
      if (!teacher || !sessions.length) { closeConfirm(); showToast('请选择上课时间'); return; }
      const batchId = sessions.length > 1 ? YZB.makeId() : '';
      const pattern = sessions.length > 1 ? '自由选择 ' + sessions.length + ' 节' : '';
      sessions.forEach((session, index) => {
        const day = YZB.dayInfo(session.date);
        YZB.add({
          id: YZB.makeId(), student: STUDENT, courseId: course.id, courseName: course.name, subject: course.subject, grade: course.grade,
          lessons: CLASS_LESSONS, lessonMinutes: CLASS_MINUTES, durationLabel: CLASS_LABEL,
          teacherId: teacher.id, teacherName: teacher.name, date: session.date, dateLabel: day.label, time: session.time,
          mode: course.mode, place: course.place, remark: '', status: 'pending',
          createdAt: '8月10日 22:30', confirmedAt: '', deducted: false, cancelReason: '', cancelledBy: '',
          batchId: batchId, batchIndex: index + 1, batchTotal: sessions.length, batchLabel: pattern
        });
      });
      closeConfirm();
      showToast(sessions.length > 1 ? `已提交 ${sessions.length} 条约课，等待老师确认` : `约课已提交：${YZB.dayInfo(sessions[0].date).label} ${sessions[0].time} 等待老师确认`);
      setTimeout(() => { location.href = '上课记录_页面还原.html?filter=pending'; }, 900);
    });

    refreshAll();
    function fit() { const scale = Math.min((innerWidth - 32) / 464, (innerHeight - 32) / 980, 1); document.documentElement.style.setProperty('--device-scale', Math.max(scale, .2)); }
    fit(); addEventListener('resize', fit, { passive: true });
  </script>
  </script>
