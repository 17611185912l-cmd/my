    </header><div class="content">
      <section class="card step-card" data-step="1">
        <div class="step-head"><span class="step-index">1</span><div><strong>确认学员与课程</strong><span class="step-note">学员已默认；每节 1.5 小时 = 2 课时</span></div></div>
        <div class="bk-student"><span class="bk-mark">王</span><span><strong>王子涵 · 男</strong><span>西安高新一中 · 高一</span></span><span class="bk-default">默认学员</span></div>
        <div class="bk-course-list" id="courseList"></div>
      </section>

      <section class="card step-card" data-step="2">
        <div class="step-head"><span class="step-index">2</span><div><strong>设置固定上课计划</strong><span class="step-note">每周重复，直到结束日期</span></div></div>
        <div class="bk-plan-dates">
          <div class="bk-field"><label for="startDate">开始日期</label><input id="startDate" type="date"></div>
          <div class="bk-field"><label for="endDate">结束日期</label><input id="endDate" type="date"></div>
        </div>
        <div class="bk-plan-add">
          <div class="bk-weekday-chips" id="weekdayChips" role="group" aria-label="星期，可多选"></div>
          <select id="timeSelect" aria-label="开始时间"></select>
          <button id="addSlot" type="button">添加</button>
        </div>
        <div class="bk-plan-slots" id="planSlots" aria-live="polite"></div>
        <div class="bk-hours" id="planNote"></div>
      </section>

      <section class="card step-card" data-step="3">
        <div class="step-head"><span class="step-index">3</span><div><strong>选择老师或发布需求</strong><span class="step-note">选择老师直接提交，或让老师来接单</span></div></div>
        <div class="bk-teacher-list" id="matchedTeacherList"></div>
      </section>

    <div class="actionbar">
      <div class="summary" id="summary">请选择上课日期和具体时间</div>
      <button class="submit" id="submit" type="button" disabled>提交约课</button>
    </div>
    <div class="confirm-mask" id="confirmMask" hidden></div>
    <section class="confirm-dialog" id="confirmDialog" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
      <div class="confirm-head"><h2 id="confirmTitle">确认约课时间</h2><button class="confirm-close" id="confirmClose" type="button" aria-label="关闭">×</button></div>
      <div class="confirm-summary" id="confirmSummary"></div>
      <div class="confirm-list" id="confirmList"></div>
      <div class="confirm-actions"><button class="confirm-action cancel" id="confirmCancel" type="button">返回修改</button><button class="confirm-action primary" id="confirmSubmit" type="button">确认提交</button></div>
    </section>
    <div class="toast" id="toast"></div>
  </div></div></main>

  <script src="约课数据.js?v=20260917-6"></script>
  <script>
    const STUDENT = '王子涵';
    const CLASS_MINUTES = YZB.DEFAULT_CLASS_MINUTES;
    const CLASS_LESSONS = YZB.DEFAULT_CLASS_LESSONS;
    const CLASS_LABEL = '1.5 小时/次';
    const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const selectedWeekdays = new Set();
    const bookingParams = new URLSearchParams(location.search);
    const requestedCourse = bookingParams.get('course') || '';
    const requestedTeacher = bookingParams.get('teacher') || '';
    const requestedMode = bookingParams.get('mode') || '';
    const initialCourseId = YZB.courses().some(course => course.id === requestedCourse) ? requestedCourse : 'function';
    const initialDemand = requestedMode === 'demand';
    const initialTeacherId = !initialDemand && YZB.teachersFor(initialCourseId).some(teacher => teacher.id === requestedTeacher) ? requestedTeacher : '';
    const state = {
      courseId: initialCourseId,
      teacherId: initialTeacherId,
      demand: initialDemand,
      startDate: '2026-09-01',
      endDate: '2027-01-15',
      weeklySlots: [{ weekday: 0, time: '19:00' }],
      submitMode: initialDemand ? 'demand' : 'designated'
    };

    const courseList = document.querySelector('#courseList');
    const startDate = document.querySelector('#startDate');
    const endDate = document.querySelector('#endDate');
    const weekdayChips = document.querySelector('#weekdayChips');
    const timeSelect = document.querySelector('#timeSelect');
    const addSlot = document.querySelector('#addSlot');
    const planSlots = document.querySelector('#planSlots');
    const planNote = document.querySelector('#planNote');
    const matchedTeacherList = document.querySelector('#matchedTeacherList');
    const summary = document.querySelector('#summary');
    const submit = document.querySelector('#submit');
    const toast = document.querySelector('#toast');
    const confirmMask = document.querySelector('#confirmMask');
    const confirmDialog = document.querySelector('#confirmDialog');
    const confirmTitle = document.querySelector('#confirmTitle');
    const confirmSummary = document.querySelector('#confirmSummary');
    const confirmList = document.querySelector('#confirmList');
    const confirmSubmit = document.querySelector('#confirmSubmit');

    document.querySelector('.back').onclick = () => location.href = '学习中心_页面还原.html';

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
    function courseById(id) { return YZB.courses().filter(item => item.id === id)[0]; }
    function stats() { return YZB.planStats(state.startDate, state.endDate, state.weeklySlots); }
    function validPlan() {
      return !!state.startDate && !!state.endDate && state.startDate <= state.endDate && state.weeklySlots.length > 0;
    }
    function slotText(slot) { return '每' + WEEKDAYS[Number(slot.weekday)] + ' ' + slot.time; }

    function renderHours() {
      const hours = YZB.hours();
      const current = stats();
      planNote.innerHTML = `本课程剩余 <b>${hours.available}</b> 课时 · 当前计划预计 <b>${current.lessons}</b> 课时<br>按固定周课表估算，节假日和请假可在具体课次中调整`;
    }

    function renderCourses() {
      const hours = YZB.hours();
      courseList.innerHTML = YZB.courses().map(course => `
        <button class="bk-course ${course.id === state.courseId ? 'active' : ''}" type="button" data-course="${course.id}">
          <span class="bk-teacher-copy"><strong>${course.name}</strong><span>${course.grade} · ${course.subject} · ${course.mode}</span><span class="bk-course-duration">每节 ${CLASS_LABEL} · 消耗 ${CLASS_LESSONS} 课时</span></span>
          <span class="bk-badge">剩余 <b>${hours.available}</b> 课时</span>
        </button>`).join('');
    }

    function renderSchedule() {
      startDate.value = state.startDate;
      endDate.value = state.endDate;
      weekdayChips.innerHTML = WEEKDAYS.map((label, index) => `<button class="bk-weekday-chip ${selectedWeekdays.has(index) ? 'active' : ''}" type="button" data-weekday="${index}" aria-pressed="${selectedWeekdays.has(index)}">${label}</button>`).join('');
      const keepTime = timeSelect.value;
      timeSelect.innerHTML = YZB.times().map(time => `<option value="${time}">${time}</option>`).join('');
      timeSelect.value = keepTime && YZB.times().indexOf(keepTime) >= 0 ? keepTime : '19:00';
      planSlots.innerHTML = state.weeklySlots.length ? state.weeklySlots.map((slot, index) => `
        <div class="bk-plan-slot"><strong>${slotText(slot)}</strong><button type="button" data-remove="${index}">删除</button></div>
      `).join('') : '<div class="bk-empty">还没有添加固定上课时间</div>';
      renderHours();
      renderSummary();
    }

    function renderMatchedTeachers() {
      const teachers = YZB.teachersFor(state.courseId);
      const emptyNote = teachers.length ? '' : '<div class="bk-empty">当前没有匹配老师，可直接发布需求</div>';
      const teacherCards = teachers.map((teacher, index) => {
        const selected = !state.demand && teacher.id === state.teacherId;
        const tag = index === 0 ? '<em class="bk-reason">推荐</em>' : '';
        const fit = index === 0 ? '可满足全部时间' : '可满足部分时间';
        return `<button class="bk-teacher ${selected ? 'active' : ''}" type="button" data-teacher="${teacher.id}">
          <span class="bk-mark">${teacher.avatar}</span>
          <span class="bk-teacher-copy"><strong>${teacher.name}${tag}</strong><span>${teacher.intro} · ${teacher.score} 分</span><span>${fit} · ${YZB.availabilityLabel(teacher.id)}</span></span>
          <span class="bk-badge">${selected ? '已选择' : '选择'}</span>
        </button>`;
      }).join('');
      const demandCard = `<button class="bk-demand ${state.demand ? 'active' : ''}" type="button" data-demand="1" aria-pressed="${state.demand ? 'true' : 'false'}">
          <span class="bk-demand-icon" aria-hidden="true">需</span>
          <span class="bk-demand-copy"><strong>不指定老师，发布需求</strong><span>发布到抢单大厅，老师接单后由家长确认</span></span>
          <span class="bk-demand-radio" aria-hidden="true"></span>
        </button>`;
      matchedTeacherList.innerHTML = demandCard + teacherCards + emptyNote;
    }

    function renderSummary() {
      const current = stats();
      submit.textContent = '提交约课';
      if (!validPlan()) {
        summary.textContent = '请先设置开始日期、结束日期和固定上课时间';
        submit.disabled = true;
        return;
      }
      const teacher = state.demand ? null : YZB.teacher(state.teacherId);
      if (teacher) {
        summary.innerHTML = `${teacher.name} · 每周计划 · 预计 <b>${current.sessions}</b> 次 / <b>${current.lessons}</b> 课时`;
        submit.disabled = false;
        return;
      }
      if (state.demand) {
        summary.innerHTML = `不指定老师 · 发布到抢单大厅 · 预计 <b>${current.sessions}</b> 次 / <b>${current.lessons}</b> 课时`;
        submit.textContent = '发布需求';
        submit.disabled = false;
        return;
      }
      summary.innerHTML = `固定计划预计 <b>${current.sessions}</b> 次 / <b>${current.lessons}</b> 课时 · 请选择老师或发布需求`;
      submit.disabled = true;
    }

    function closeConfirm() {
      confirmMask.hidden = true;
      confirmDialog.hidden = true;
    }

    function openConfirm(mode) {
      if (!validPlan()) { showToast('请先设置完整的固定上课计划'); return; }
      const current = stats();
      const teacher = mode === 'designated' ? YZB.teacher(state.teacherId) : null;
      if (mode === 'designated' && !teacher) { showToast('请先选择一位老师'); return; }
      state.submitMode = mode;
      confirmTitle.textContent = mode === 'demand' ? '确认发布需求' : '确认指定老师';
      confirmSubmit.textContent = mode === 'demand' ? '确认发布' : '确认提交';
      confirmSummary.innerHTML = mode === 'demand'
        ? `不指定老师 · 预计 <b>${current.sessions}</b> 次 / <b>${current.lessons}</b> 课时`
        : `${teacher.name} · 预计 <b>${current.sessions}</b> 次 / <b>${current.lessons}</b> 课时`;
      confirmList.innerHTML = [
        `<div class="confirm-row"><span>上课周期</span><b>${state.startDate} 至 ${state.endDate}</b></div>`,
        `<div class="confirm-row"><span>固定时间</span><b>${YZB.scheduleLabel(state.weeklySlots)}</b></div>`,
        `<div class="confirm-row"><span>提交方式</span><b>${mode === 'demand' ? '发布到抢单大厅' : '提交给当前老师'}</b></div>`
      ].join('');
      confirmMask.hidden = false;
      confirmDialog.hidden = false;
    }

    courseList.addEventListener('click', event => {
      const button = event.target.closest('[data-course]');
      if (!button) return;
      state.courseId = button.dataset.course;
      state.teacherId = '';
      state.demand = false;
      renderCourses();
      renderMatchedTeachers();
      renderSummary();
    });

    startDate.addEventListener('change', () => { state.startDate = startDate.value; renderHours(); renderSummary(); });
    endDate.addEventListener('change', () => { state.endDate = endDate.value; renderHours(); renderSummary(); });
    weekdayChips.addEventListener('click', event => {
      const chip = event.target.closest('[data-weekday]');
      if (!chip) return;
      const index = Number(chip.dataset.weekday);
      if (selectedWeekdays.has(index)) selectedWeekdays.delete(index); else selectedWeekdays.add(index);
      renderSchedule();
    });
    addSlot.addEventListener('click', () => {
      if (!selectedWeekdays.size) { showToast('请先选择星期（可多选）'); return; }
      const time = timeSelect.value;
      const added = [];
      Array.from(selectedWeekdays).sort((a, b) => a - b).forEach(day => {
        if (state.weeklySlots.some(item => item.weekday === day && item.time === time)) return;
        state.weeklySlots.push({ weekday: day, time });
        added.push(day);
      });
      if (!added.length) { showToast('这些时间已经添加过了'); return; }
      state.weeklySlots.sort((a, b) => a.weekday - b.weekday || a.time.localeCompare(b.time));
      showToast('已添加 ' + added.map(day => WEEKDAYS[day]).join('、') + ' ' + time);
      selectedWeekdays.clear();
      renderSchedule();
    });
    planSlots.addEventListener('click', event => {
      const button = event.target.closest('[data-remove]');
      if (!button) return;
      state.weeklySlots.splice(Number(button.dataset.remove), 1);
      renderSchedule();
    });
    matchedTeacherList.addEventListener('click', event => {
      const demand = event.target.closest('[data-demand]');
      if (demand) {
        state.demand = true;
        state.teacherId = '';
        renderMatchedTeachers();
        renderSummary();
        return;
      }
      const button = event.target.closest('[data-teacher]');
      if (!button) return;
      state.demand = false;
      state.teacherId = button.dataset.teacher;
      renderMatchedTeachers();
      renderSummary();
    });
    submit.addEventListener('click', () => openConfirm(state.demand ? 'demand' : 'designated'));

    document.querySelector('#confirmClose').addEventListener('click', closeConfirm);
    document.querySelector('#confirmCancel').addEventListener('click', closeConfirm);
    confirmMask.addEventListener('click', closeConfirm);

    confirmSubmit.addEventListener('click', () => {
      const course = courseById(state.courseId);
      const current = stats();
      const teacher = state.submitMode === 'designated' ? YZB.teacher(state.teacherId) : null;
      if (!course || !validPlan() || (state.submitMode === 'designated' && !teacher)) return;
      const isDemand = state.submitMode === 'demand';
      YZB.add({
        id: YZB.makeId(), isPlan: true, orderMode: isDemand ? 'demand' : 'designated', student: STUDENT,
        courseId: course.id, courseName: course.name, subject: course.subject, grade: course.grade,
        teacherId: isDemand ? '' : teacher.id, teacherName: isDemand ? '待匹配' : teacher.name, teacherAccepted: false,
        startDate: state.startDate, endDate: state.endDate, weeklySlots: state.weeklySlots.map(slot => ({ weekday: slot.weekday, time: slot.time })),
        scheduleLabel: YZB.scheduleLabel(state.weeklySlots), sessionCount: current.sessions, lessons: current.lessons,
        lessonMinutes: CLASS_MINUTES, durationLabel: CLASS_LABEL, mode: course.mode, place: course.place, remark: '',
        status: 'pending', occurrences: [], createdAt: YZB.nowLabel(), confirmedAt: '', deducted: false, cancelReason: '', cancelledBy: ''
      });
      closeConfirm();
      showToast(isDemand ? '需求已发布，等待老师接单' : `已提交给 ${teacher.name}，等待确认`);
      setTimeout(() => { location.href = '上课记录_页面还原.html?filter=pending'; }, 900);
    });

    renderCourses();
    renderSchedule();
    renderMatchedTeachers();
    renderSummary();
    function fit() { const scale = Math.min((innerWidth - 32) / 464, (innerHeight - 32) / 980, 1); document.documentElement.style.setProperty('--device-scale', Math.max(scale, .2)); }
    fit(); addEventListener('resize', fit, { passive: true });
  </script>
<script src="原型开发说明.js?v=20260917-3"></script></body></html>
