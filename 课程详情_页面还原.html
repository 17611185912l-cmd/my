<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf4ff"><title>课程详情</title>
  <style>
    :root{--device-scale:1;--blue:#4b7fb8;--ink:#24262b;--muted:#777a82;--line:#e5ebf2}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100svh;padding:16px;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:#e7eaee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button{padding:0;border:0;color:inherit;font:inherit;background:none;cursor:pointer}.phone-shell{position:relative;isolation:isolate;width:464px;height:980px;padding:11px;border:1px solid #777d84;border-radius:66px;background:linear-gradient(135deg,#bfc3c7,#f4f5f6 20%,#8d9298 49%,#d9dcdf 72%,#73787e);box-shadow:0 34px 70px rgba(32,38,45,.28),inset 0 0 0 3px rgba(33,36,40,.68);transform:scale(var(--device-scale));transform-origin:center}.dynamic-island{position:absolute;z-index:30;top:22px;left:50%;width:126px;height:34px;transform:translateX(-50%);border-radius:20px;background:#050505}.dynamic-island:after{content:"";position:absolute;right:12px;top:11px;width:8px;height:8px;border-radius:50%;background:#111a25}.app{position:relative;width:440px;height:956px;overflow:hidden;border-radius:54px;background:#f5f4f6;box-shadow:inset 0 0 0 1px rgba(0,0,0,.52)}.page{height:100%;overflow-y:auto;scrollbar-width:none;background:linear-gradient(to bottom,rgba(245,244,246,0) 148px,#f5f4f6 218px),linear-gradient(105deg,transparent 16%,rgba(255,255,255,.46) 36%,transparent 55%),linear-gradient(132deg,#f7faff 0%,#edf4ff 48%,#dceafa 100%)}.page::-webkit-scrollbar{display:none}header{position:sticky;z-index:10;top:0;color:#294966;background:linear-gradient(105deg,transparent 16%,rgba(255,255,255,.46) 36%,transparent 55%),linear-gradient(132deg,#f7faff 0%,#edf4ff 48%,#dceafa 100%)}.statusbar{height:36px;padding:17px 36px 0;display:flex;align-items:flex-start;justify-content:space-between;color:#050505;font-size:15px;line-height:1;font-weight:700}.device-status{display:flex;align-items:center;gap:8px}.signal{width:18px;height:12px;display:flex;align-items:flex-end;gap:2px}.signal i{width:3px;border-radius:2px 2px 0 0;background:#050505}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal i:nth-child(4){height:12px}.wifi{position:relative;width:18px;height:13px;overflow:hidden}.wifi:before,.wifi:after{content:"";position:absolute;left:50%;border:2px solid #050505;border-color:#050505 transparent transparent;border-radius:50%;transform:translateX(-50%)}.wifi:before{top:0;width:19px;height:17px}.wifi:after{top:5px;width:10px;height:9px}.wifi i{position:absolute;left:8px;bottom:0;width:3px;height:3px;border-radius:50%;background:#050505}.battery{position:relative;width:23px;height:11px;padding:2px;border:1.5px solid #919191;border-radius:3px}.battery:before{content:"";display:block;width:100%;height:100%;border-radius:1px;background:#050505}.battery:after{content:"";position:absolute;top:3px;right:-3px;width:2px;height:5px;background:#b4b4b4}.titlebar{position:relative;height:57px;display:flex;align-items:center}.titlebar h1{width:100%;margin:0;font-size:18px;line-height:26px;text-align:center}.back{position:absolute;z-index:4;left:20px;top:8px;width:40px;height:40px}.back:before{content:"";position:absolute;left:12px;top:13px;width:10px;height:10px;border:solid #294966;border-width:0 0 2px 2px;transform:rotate(45deg)}.capsule{position:absolute;right:17px;top:13px;width:84px;height:30px;border:1px solid rgba(61,105,151,.18);border-radius:16px;display:grid;grid-template-columns:1fr 1fr;align-items:center;background:rgba(255,255,255,.9)}.dots{display:flex;justify-content:center;gap:3px}.dots i{width:4px;height:4px;border-radius:50%;background:#15171b}.ring{position:relative;width:15px;height:15px;margin:auto;border:1.8px solid #111318;border-radius:50%}.ring:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#111318}.content{padding:8px 12px 30px}.card{margin-bottom:8px;padding:14px;border-radius:8px;background:#fff}.course-top{display:flex;align-items:flex-start}.course-top h2{min-width:0;flex:1;margin:0;font-size:16px;line-height:23px}.badge{margin-left:10px;padding:3px 7px;border-radius:4px;color:#356da9;background:#edf4ff;font-size:14px;white-space:nowrap}.badge.done{color:#34705a;background:#eaf7f1}.badge.pending{color:#9d5d13;background:#fff4df}.meta{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px;color:var(--muted);font-size:14px;line-height:20px}.meta span:last-child{grid-column:1/-1}.section-title{margin:0 0 11px;font-size:16px;line-height:23px}.content-text{margin:0;color:#565b64;font-size:14px;line-height:24px;white-space:pre-line}.info-list{margin:0}.info-row{padding:9px 0;display:grid;grid-template-columns:76px 1fr;gap:10px;border-top:1px solid var(--line);font-size:14px;line-height:22px}.info-row:first-child{padding-top:0;border-top:0}.info-row:last-child{padding-bottom:0}.info-row dt{color:var(--muted)}.info-row dd{margin:0;color:#454950}.empty-block{min-height:78px;display:grid;place-items:center;color:#99969a;font-size:14px;text-align:center}.homework-title{margin:0 0 8px;font-size:15px;line-height:22px}.homework-status{display:inline-block;margin-bottom:9px;padding:2px 7px;border-radius:4px;color:#356da9;background:#edf4ff;font-size:14px}.homework-requirement{margin:0;color:#565b64;font-size:14px;line-height:24px}.parent-only[hidden]{display:none}@media(max-width:520px){body{padding:0;background:#f5f4f6}.phone-shell{border-color:transparent;box-shadow:none}}
    .content.with-action{padding-bottom:104px}.feedback-entry,.share-entry,.review-entry{position:absolute;z-index:20;left:16px;right:16px;bottom:26px;height:46px;display:grid;place-items:center;border-radius:6px;color:#fff;background:var(--blue);font-size:16px;font-weight:600;text-decoration:none}.feedback-entry[hidden],.share-entry[hidden],.review-entry[hidden]{display:none}.share-toast{position:absolute;z-index:30;left:50%;bottom:88px;padding:9px 14px;border-radius:5px;color:#fff;background:rgba(27,28,31,.88);font-size:14px;white-space:nowrap;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:.2s}.share-toast.show{transform:translate(-50%,0);opacity:1}
    .mode-badge{margin-left:10px;padding:3px 7px;border-radius:4px;color:#5e6c7b;background:#f0f3f6;font-size:14px;line-height:20px;white-space:nowrap}.mode-badge+.badge{margin-left:5px}.card:first-child{padding:11px 14px}.meta{margin-top:5px;display:flex;flex-wrap:wrap;align-items:center;gap:3px 14px;line-height:19px}.meta span:nth-child(3){order:1;flex:0 0 100%;color:#596674}.meta span:nth-child(1){order:2}.meta span:nth-child(2){order:3}.meta span:nth-child(4){order:4}.meta span:nth-child(n+5){display:none}
  </style>
</head>
<body><main class="phone-shell" aria-label="课程详情页面"><div class="dynamic-island" aria-hidden="true"></div><div class="app"><div class="page"><header><div class="statusbar"><span>23:58</span><div class="device-status"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"><i></i></span><span class="battery"></span></div></div><div class="titlebar"><button class="back" type="button" aria-label="返回课程列表"></button><h1>教师端 · 课程详情</h1><div class="capsule"><span class="dots"><i></i><i></i><i></i></span><span class="ring"></span></div></div></header><div class="content">
  <section class="card"><div class="course-top"><h2 id="courseName"></h2><span class="mode-badge" id="courseMode"></span><span class="badge" id="courseStatus"></span></div><div class="meta"><span id="participant"></span><span id="courseTime"></span><span>陕西省·人教A版</span><span>60分钟</span><span id="coursePlace"></span></div></section>
  <section class="card"><h2 class="section-title">课程内容</h2><p class="content-text" id="courseContent"></p></section>
  <section class="card"><h2 class="section-title">课后反馈</h2><div id="feedbackContent"></div></section>
  <section class="card"><h2 class="section-title">课后作业</h2><div id="homeworkContent"></div></section>
</div></div><a class="feedback-entry" id="feedbackEntry" hidden>去填写反馈</a><a class="review-entry" id="reviewEntry" hidden>去评价</a><button class="share-entry" id="shareEntry" type="button" hidden>分享至家长群</button><div class="share-toast" id="shareToast">课程反馈已复制，请选择群聊后粘贴</div></div></main>
<script>
  const courses={
    'function-0810':{name:'高一数学·函数基础',student:'王子涵',teacher:'张三老师',time:'8月10日 10:00',place:'西安小寨校区',status:'待上课',content:''},
    'sequence-0810':{name:'高二数学·数列专题',student:'李沐辰',teacher:'张三老师',time:'8月10日 15:30',place:'西安小寨交付中心',status:'待上课',content:''},
    'sequence-0815':{name:'高一数学·数列专题',student:'王子涵',teacher:'李明老师',time:'8月15日 19:00',place:'西安小寨交付中心',status:'待上课',content:''},
    'tutorial':{name:'高中数学·专题辅导',student:'王子涵',teacher:'张三老师',time:'8月13日 19:00',place:'西安小寨交付中心',status:'待上课',content:''},
    'derivative-0809':{name:'高三数学·导数应用',student:'陈思语',teacher:'张三老师',time:'8月9日 19:00',place:'上门',status:'待反馈',content:''},
    'trigonometry-0808':{name:'高一数学·三角函数',student:'周子轩',teacher:'张三老师',time:'8月8日 16:00',place:'西安小寨校区',status:'已完成',content:'任意角三角函数的定义\n同角三角函数基本关系与诱导公式',feedback:'本节课知识点掌握较好，能够独立完成基础题。诱导公式的符号判断还需加强，建议结合单位圆继续巩固。',requirement:'完成教材第 32 页练习 1-6 题，并整理诱导公式中容易混淆的符号变化。'},
    'function-0803':{name:'高一数学·函数基础',student:'王子涵',teacher:'王静老师',time:'8月3日 14:00',place:'西安小寨交付中心',status:'已完成',content:'函数定义域和值域的求法\n函数图像与性质的综合应用',feedback:'课堂参与度高，基础概念理解准确。复合函数定义域还需要增加练习。',requirement:'完成 8 道定义域专项题，并标注每题的限制条件。'},
    'geometry-0724':{name:'高一数学·立体几何',student:'林子谦',teacher:'李明老师',time:'7月24日 18:30',place:'西安小寨校区',status:'已完成',content:'空间点、线、面的位置关系\n线面平行的判定与性质',feedback:'能够正确识别空间位置关系，证明题的步骤书写还需更规范。',requirement:'完成讲义第 2 章第 5-10 题，证明过程需写明所用定理。'},
    'probability-0718':{name:'高一数学·概率基础',student:'赵欣怡',teacher:'王静老师',time:'7月18日 16:00',place:'西安小寨交付中心',status:'已完成',content:'随机事件与概率的基本概念\n古典概型及其概率计算',feedback:'对古典概型掌握较好，能够准确列举基本事件。复杂情境下需要注意分类讨论。',requirement:'完成讲义第 18-24 题，写出基本事件总数和目标事件数。'},
    'analytic-0626':{name:'高三数学·解析几何',student:'孙若溪',teacher:'张三老师',time:'6月26日 19:00',place:'上门',status:'已完成',content:'直线与圆锥曲线的位置关系\n弦长、中点弦与定点问题',feedback:'计算过程较熟练，联立方程后的化简速度有所提升。需要继续训练参数范围的检查。',requirement:'完成综合练习第 3、5、7 题，订正课堂例题中的计算错误。'}
  };
  const params=new URLSearchParams(location.search),role=params.get('role')==='parent'?'parent':'teacher',courseId=params.get('course')||'function-0810',course={...(courses[courseId]||courses['function-0810'])},courseModes={'function-0810':'线下','sequence-0810':'线上','sequence-0815':'线上','tutorial':'线上','derivative-0809':'上门','trigonometry-0808':'线下','function-0803':'线上','geometry-0724':'线下','probability-0718':'线上','analytic-0626':'上门'};
  const parentStatuses={'trigonometry-0808':'待评价','function-0803':'待评价','geometry-0724':'已评价','probability-0718':'已评价','analytic-0626':'已评价'};
  if(role==='parent'&&parentStatuses[courseId])course.status=parentStatuses[courseId];document.querySelector('#courseMode').textContent=courseModes[courseId]||'线下';
  try{const saved=JSON.parse(localStorage.getItem(`course-detail:${courseId}`)||'null');if(saved){if(saved.content)course.content=saved.content;if(saved.feedback)course.feedback=saved.feedback;if(saved.homework)course.requirement=saved.homework}}catch{}
  document.title=`${role==='parent'?'家长端':'教师端'} · 课程详情`;document.querySelector('h1').textContent=document.title;
  document.querySelector('#courseName').textContent=course.name;document.querySelector('#participant').textContent=role==='parent'?course.teacher:course.student;document.querySelector('#courseTime').textContent=course.time;document.querySelector('#coursePlace').textContent=course.place;document.querySelector('#coursePlace').hidden=role==='parent'||!course.place;document.querySelector('#courseContent').outerHTML=course.content?`<p class="content-text" id="courseContent"></p>`:`<div class="empty-block" id="courseContent">${course.status==='待上课'?'课程结束后展示课程内容':'暂未填写课程内容'}</div>`;if(course.content)document.querySelector('#courseContent').textContent=course.content;
  const status=document.querySelector('#courseStatus');status.textContent=course.status;status.classList.toggle('done',course.status==='已完成'||course.status==='已评价');status.classList.toggle('pending',course.status==='待反馈'||course.status==='待评价');
  document.querySelector('#feedbackContent').innerHTML=course.feedback?`<p class="content-text">${course.feedback}</p>`:`<div class="empty-block">${course.status==='待上课'?'课程结束后展示课后反馈':'暂未提交课后反馈'}</div>`;
  document.querySelector('#homeworkContent').innerHTML=course.requirement?`<p class="homework-requirement">${course.requirement}</p>`:`<div class="empty-block">${course.status==='待上课'?'课程结束后展示课后作业':'暂未布置课后作业'}</div>`;
  const feedbackEntry=document.querySelector('#feedbackEntry');if(role==='teacher'&&course.status==='待反馈'){feedbackEntry.hidden=false;feedbackEntry.href=`课程反馈_页面还原.html?course=${courseId}`;document.querySelector('.content').classList.add('with-action')}
  const reviewEntry=document.querySelector('#reviewEntry'),reviewCourseIds={'trigonometry-0808':'trigonometry','function-0803':'function'};if(role==='parent'&&course.status==='待评价'){reviewEntry.hidden=false;reviewEntry.href=`课程评价_页面还原.html?course=${reviewCourseIds[courseId]||'trigonometry'}`;document.querySelector('.content').classList.add('with-action')}
  const shareEntry=document.querySelector('#shareEntry');
  function numbered(text){return text.split('\n').map(item=>item.trim()).filter(Boolean).map((item,index)=>`${index+1}.${item}`).join('\n')}
  function classTime(value){const match=value.match(/(\d+)月(\d+)日\s+(\d+):(\d+)/);if(!match)return{date:value,time:'60分钟'};const startHour=Number(match[3]),startMinute=Number(match[4]),endMinutes=startHour*60+startMinute+60,endHour=String(Math.floor(endMinutes/60)%24).padStart(2,'0'),endMinute=String(endMinutes%60).padStart(2,'0');return{date:`2026.${match[1]}.${match[2]}`,time:`${match[3]}:${match[4]}-${endHour}:${endMinute}`}}
  function shareText(){const lesson=classTime(course.time);return`📚📚📚 课堂反馈：\n【上课信息】\n1.上课日期：${lesson.date}\n2.上课时间：${lesson.time}\n3.授课科目：数学\n4.任课教师：${course.teacher}\n\n📖📖📖【课堂内容】\n${numbered(course.content)}\n\n📚📚📚【课堂表现】\n${course.feedback}\n\n💡💡💡【课后作业】\n${course.requirement||'本次课程暂无课后作业'}`}
  async function copyShareText(){const text=shareText();try{localStorage.setItem('family-group-share-draft',text)}catch{}try{await navigator.clipboard.writeText(text)}catch{const textarea=document.createElement('textarea');textarea.value=text;textarea.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(textarea);textarea.select();document.execCommand('copy');textarea.remove()}const toast=document.querySelector('#shareToast');toast.classList.add('show');setTimeout(()=>{toast.classList.remove('show');location.href=`家长群聊_页面还原.html?course=${courseId}`},900)}
  if(role==='teacher'&&course.status==='已完成'&&course.feedback){shareEntry.hidden=false;shareEntry.onclick=copyShareText;document.querySelector('.content').classList.add('with-action')}
  document.querySelector('.back').onclick=()=>{if(history.length>1)history.back();else location.href=role==='parent'?'上课记录_页面还原.html':'授课记录_页面还原.html'};
  function fit(){const scale=Math.min((innerWidth-32)/464,(innerHeight-32)/980,1);document.documentElement.style.setProperty('--device-scale',Math.max(scale,.2))}fit();addEventListener('resize',fit,{passive:true});
</script><script src="原型开发说明.js"></script></body></html>
