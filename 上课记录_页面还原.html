  <script>
    const TABS = [
      { key: 'all', label: '全部课程', states: null },
      { key: 'pending', label: '待确认', states: ['pending'] },
      { key: 'waiting', label: '待上课', states: ['confirmed'] },
      { key: 'review', label: '待评价', states: ['attended'] },
      { key: 'done', label: '已完成', states: ['done'] },
      { key: 'cancelled', label: '已取消', states: ['cancelled'] }
    ];
    const STATE_TEXT = { pending: '待确认', confirmed: '待上课', attended: '待评价', done: '已完成', cancelled: '已取消' };
    const STATUS_KEY = { pending: 'pending', confirmed: 'waiting', attended: 'review', done: 'done', cancelled: 'cancelled' };
    const DETAIL_SLUG = { 'function': 'function-0803', sequence: 'sequence-0815', trigonometry: 'trigonometry-0808', tutorial: 'tutorial', geometry: 'geometry-0724' };
    const REVIEW_COURSE = { trigonometry: 'trigonometry', 'function': 'function' };
    const FEEDBACK = {
      trigonometry: { feedback: '知识点掌握较好，诱导公式符号判断还需加强', homework: '完成教材第32页练习1-6题，整理易混淆符号' },
      'function': { feedback: '课堂参与度高，基础概念理解准确，复合函数定义域还需增加练习', homework: '完成8道定义域专项题，并标注每题的限制条件' },
      geometry: { feedback: '能够正确识别空间位置关系，证明题的步骤书写还需更规范', homework: '完成讲义第2章第5-10题，证明过程需写明所用定理' }
    };
    const REASONS = ['时间冲突', '孩子临时有事', '想更换上课时间', '想更换老师'];
    /* 请假：本页为家长视角，另一方是老师 */
    const VIEWER = 'parent';
    const LEAVE_REASONS = ['临时有事', '身体不适', '学校安排冲突', '想调整上课时间'];
    let activeFilter = new URLSearchParams(location.search).get('filter') || 'all';
    if (!TABS.some(tab => tab.key === activeFilter)) activeFilter = 'all';
    let cancelTarget = '', cancelReason = '';
    let leaveTarget = '', leaveReason = '', leaveType = 'reschedule', leaveDate = '', leaveTime = '';

    const store = window.YZB || null;
    const monthSelect = document.querySelector('#monthFilter');
    const courseSelect = document.querySelector('#courseFilter');
    const recordList = document.querySelector('#recordList');
    const emptyBox = document.querySelector('.empty');
    const toast = document.querySelector('#toast');
    const sheet = document.querySelector('#cancelSheet');
    const sheetMask = document.querySelector('#sheetMask');
    const sheetNote = document.querySelector('#sheetNote');
    const reasonList = document.querySelector('#reasonList');
    const cancelConfirm = document.querySelector('#cancelConfirm');
    const leaveSheet = document.querySelector('#leaveSheet');
    const leaveNote = document.querySelector('#leaveNote');
    const leaveReasons = document.querySelector('#leaveReasons');
    const leaveNoteInput = document.querySelector('#leaveNoteInput');
    const leaveTypeBox = document.querySelector('#leaveType');
    const leaveSlot = document.querySelector('#leaveSlot');
    const leaveOrigin = document.querySelector('#leaveOrigin');
    const leaveDates = document.querySelector('#leaveDates');
    const leaveTimes = document.querySelector('#leaveTimes');
    const leaveSubmit = document.querySelector('#leaveSubmit');

    function modeKey(mode) { return mode === '线下' ? 'offline' : mode === '上门' ? 'home' : 'online'; }
    function stampOf(item) { return (item.date || '') + ' ' + (item.time || ''); }
    function lessonsOf(item) { return store ? store.lessonsOf(item) : 1; }
    function slugOf(item) { return DETAIL_SLUG[item.courseId] || 'function-0803'; }
    function visibleRecords() { return store ? store.list().filter(item => !item.split) : []; }

    /* 未来的约课升序排在前，历史记录按时间倒序 */
    function orderOf(a, b) {
      const upcoming = ['pending', 'confirmed'];
      const aFuture = upcoming.indexOf(a.status) > -1, bFuture = upcoming.indexOf(b.status) > -1;
      if (aFuture !== bFuture) return aFuture ? -1 : 1;
      return aFuture ? stampOf(a).localeCompare(stampOf(b)) : stampOf(b).localeCompare(stampOf(a));
    }

    /* 反馈优先取订单记录，其次取「课程反馈」页写入的本地缓存，最后用演示文案 */
    function feedbackOf(item) {
      if (item.feedback || item.homework || item.requirement) {
        return { feedback: item.feedback || '', homework: item.requirement || item.homework || '' };
      }
      try {
        const saved = JSON.parse(localStorage.getItem('course-detail:' + item.id) || localStorage.getItem('course-detail:' + slugOf(item)) || 'null');
        if (saved && (saved.feedback || saved.homework || saved.requirement)) return { feedback: saved.feedback || '', homework: saved.homework || saved.requirement || '' };
      } catch (error) { /* 忽略演示数据的缓存异常 */ }
      if (item.status !== 'done' && item.status !== 'attended') return null;
      /* 家长端待评价/已完成一定带教师反馈：缺失时用课程演示文案兜底，保证不出现空内容 */
      return FEEDBACK[item.courseId] || { feedback: '老师已完成本课次课后反馈，可在课程详情中查看完整内容。', homework: '' };
    }

    function summaryOf(item) {
      if (item.status !== 'done' && item.status !== 'attended') return '';
      const info = feedbackOf(item);
      if (!info) return '';
      const rows = [];
      if (info.feedback) rows.push('<div class="summary-row"><strong>课程反馈</strong><span>' + info.feedback + '</span></div>');
      if (info.homework) rows.push('<div class="summary-row"><strong>课后作业</strong><span>' + info.homework + '</span></div>');
      return rows.length ? '<div class="record-summary">' + rows.join('') + '</div>' : '';
    }

    function tipOf(item) {
      const lessons = lessonsOf(item);
      const pendingLeave = item.leave && item.leave.status === 'pending' ? item.leave : null;
      if (pendingLeave) return '<span class="leave-tip">' + leaveTipText(pendingLeave) + '</span>';
      if (item.isPlan && item.status === 'pending') {
        if (item.teacherAccepted && item.orderMode !== 'designated') { const info = store ? store.teacher(item.teacherId) : null; const brief = info ? ' · ' + info.years + '年教龄 · 评分 ' + info.score : ''; return '<span class="record-tip">' + item.teacherName + ' 已接单' + brief + ' · 等待家长确认</span>'; }
        return '<span class="record-tip">' + (item.createdAt || '') + (item.orderMode === 'designated' ? ' 指定老师 · 等待老师确认' : ' 提交 · 等待老师接单') + '</span>';
      }
      if (item.isPlan && item.status === 'confirmed') return '<span class="record-tip">固定周课表 · 已生成 ' + (item.sessionCount || 0) + ' 次课</span>';
      if (item.status === 'pending') return '<span class="record-tip">' + (item.createdAt || '') + ' 提交 · 等待老师确认排课</span>';
      if (item.status === 'confirmed') return '';
      if (item.status === 'attended') return '';
      if (item.status === 'done') return '';
      return '<span class="record-tip">' + (item.cancelledBy === 'teacher' ? '老师' : '家长') + '取消 · ' + (item.cancelReason || '未填写原因') + '</span>';
    }

    function actionsOf(item) {
      if (item.isPlan && item.status === 'pending') {
        const confirm = item.teacherAccepted && item.orderMode !== 'designated' ? '<button class="btn primary" type="button" data-confirm-plan="' + item.id + '">确认老师</button>' : '';
        return confirm + '<button class="btn plain" type="button" data-cancel="' + item.id + '">取消需求</button>';
      }
      if (item.status === 'pending') return '<button class="btn plain" type="button" data-cancel="' + item.id + '">取消约课</button>';
      if (item.status === 'confirmed') {
        const leave = item.leave && item.leave.status === 'pending' ? item.leave : null;
        if (leave) {
          if (leave.by === VIEWER) return '<button class="btn plain" type="button" data-leave-withdraw="' + item.id + '">撤回请假</button>';
          return '<span class="leave-actions">' +
                 (leave.type === 'reschedule' ? '<button class="btn plain" type="button" data-leave-respond="' + item.id + '" data-decision="reschedule">按新时间确认</button>' : '') +
                 '<button class="btn primary" type="button" data-leave-respond="' + item.id + '" data-decision="cancel">' + (leave.type === 'reschedule' ? '直接取消课程' : '确认取消课程') + '</button>' +
                 '</span>';
        }
        const allow = store ? store.leave.canRequest(item.id) : { ok: false, reason: '' };
        if (allow.ok) return '<button class="btn plain" type="button" data-leave="' + item.id + '">请假</button>';
        return allow.reason ? '<span class="leave-tip">' + allow.reason + '</span>' : '';
      }
      if (item.status === 'attended') return item.reviewedAt ? '' : '<a class="btn primary" href="课程评价_页面还原.html?booking=' + item.id + '&course=' + (REVIEW_COURSE[item.courseId] || 'trigonometry') + '">去评价</a>';
      if (item.status === 'done' && !item.reviewedAt) return '<a class="btn primary" href="课程评价_页面还原.html?booking=' + item.id + '&course=' + (REVIEW_COURSE[item.courseId] || slugOf(item)) + '">去评价</a>';
      if (item.status === 'done') return '';
      const rebookMode = item.orderMode === 'demand' ? 'demand' : (item.teacherId ? 'designated' : 'demand');
      return '<a class="btn primary" href="约课_页面还原.html?course=' + encodeURIComponent(item.courseId || '') + '&teacher=' + encodeURIComponent(item.teacherId || '') + '&mode=' + rebookMode + '">重新约课</a>';
    }

    function cardOf(item) {
      const key = item.reviewedAt ? 'done' : (item.status === 'done' ? 'review' : (STATUS_KEY[item.status] || 'pending'));
      const detail = (item.status === 'cancelled' || item.status === 'pending') ? '' : ' role="link" tabindex="0" data-detail="' + slugOf(item) + '" data-booking="' + item.id + '"';
      const cardLeave = item.leave && item.leave.status === 'pending' ? item.leave : null;
      const badgeText = cardLeave ? '请假待确认' : (item.reviewedAt ? '已完成' : (item.status === 'done' ? '待评价' : STATE_TEXT[item.status]));
      const badgeClass = 'badge ' + key + (cardLeave ? ' leave' : '');
      const foot = tipOf(item) + actionsOf(item);
      const meta = item.isPlan
        ? '<div class="meta"><span>' + (item.teacherName === '待匹配' ? '待匹配' : '接单老师：' + item.teacherName) + '</span><span>' + item.scheduleLabel + '</span><span>' + item.startDate + ' 至 ' + item.endDate + '</span><span>' + (item.sessionCount || 0) + ' 次课 · ' + lessonsOf(item) + ' 课时</span></div>'
        : '<div class="meta"><span>' + item.teacherName + '</span><span>' + item.dateLabel + ' ' + YZB.timeRangeText(item.time, item.endTime) + '</span><span>' + item.place + '</span><span>' + (item.durationLabel || (lessonsOf(item) * 45) + '分钟') + ' · ' + lessonsOf(item) + '课时</span></div>';
      return '<article class="record' + (detail ? '' : ' static') + '"' + detail + ' data-status="' + key + '" data-month="' + (item.date || '').slice(0, 7) + '" data-course="' + item.courseId + '" data-mode="' + modeKey(item.mode) + '">' +
        '<div class="record-top"><strong>' + item.courseName + '</strong><span class="record-side"><span class="' + badgeClass + '">' + badgeText + '</span></span></div>' +
        meta +
        summaryOf(item) +
        (foot ? '<div class="record-foot">' + foot + '</div>' : '') +
      '</article>';
    }

    function renderRecords() {
      recordList.innerHTML = visibleRecords().slice().sort(orderOf).map(cardOf).join('');
    }

    /* 月份 / 课程下拉按当前演示数据生成，避免写死选项与数据不一致 */
    function fillFilters() {
      const records = visibleRecords(), months = [], courses = [];
      records.forEach(item => {
        const key = (item.date || '').slice(0, 7);
        if (key && months.indexOf(key) === -1) months.push(key);
        if (item.courseId && !courses.some(course => course.id === item.courseId)) courses.push({ id: item.courseId, name: (item.courseName || '').split('·').pop() });
      });
      months.sort().reverse();
      monthSelect.innerHTML = '<option value="all">全部月份</option>' + months.map(key => '<option value="' + key + '">' + key.slice(0, 4) + '年' + Number(key.slice(5, 7)) + '月</option>').join('');
      courseSelect.innerHTML = '<option value="all">全部课程</option>' + courses.map(course => '<option value="' + course.id + '">' + course.name + '</option>').join('');
    }

    function applyFilters() {
      const month = monthSelect.value, course = courseSelect.value, mode = document.querySelector('.mode-option.active').dataset.mode;
      const tab = TABS.filter(item => item.key === activeFilter)[0];
      let visibleCount = 0;
      document.querySelectorAll('.record').forEach(record => {
        const visible = (activeFilter === 'all' || record.dataset.status === activeFilter) && (month === 'all' || record.dataset.month === month) && (course === 'all' || record.dataset.course === course) && (mode === 'all' || record.dataset.mode === mode);
        record.hidden = !visible;
        if (visible) visibleCount += 1;
      });
      document.querySelectorAll('.tab').forEach(item => item.classList.toggle('active', item.dataset.filter === activeFilter));
      emptyBox.hidden = visibleCount !== 0;
      emptyBox.textContent = activeFilter === 'all' ? '暂无符合条件的上课记录' : '暂无' + tab.label + '的记录';
    }

    function refresh() { renderRecords(); applyFilters(); }
    // 其它标签页改动数据后自动刷新（老师接单 / 取消等）
    addEventListener('storage', event => { if (!event.key || event.key.indexOf('yzb-booking') === 0) refresh(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

    function showToast(text) { toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }
    function openSheet(id) {
      const item = store ? store.byId(id) : null;
      if (!item) return;
      cancelTarget = id;
      cancelReason = '';
      cancelConfirm.disabled = true;
      sheetNote.textContent = item.status === 'confirmed'
        ? '当前已冻结 ' + lessonsOf(item) + ' 课时，取消后立即释放；可重新选择时间约课'
        : '取消后可重新选择上课时间，冻结的课时会立即释放';
      reasonList.innerHTML = REASONS.map(reason => '<button class="reason" type="button" data-reason="' + reason + '">' + reason + '</button>').join('');
      sheet.classList.add('show');
      sheetMask.classList.add('show');
    }
    function closeSheet() { sheet.classList.remove('show'); sheetMask.classList.remove('show'); cancelTarget = ''; }

    /* ===== 请假：待上课课次由家长/老师任一方发起，另一方确认 ===== */
    function weekTextOf(dateKey) {
      const date = new Date(dateKey + 'T00:00:00');
      return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][date.getDay()] || '';
    }
    function leaveTipText(leave) {
      const isMine = leave.by === VIEWER;
      const other = VIEWER === 'parent' ? '老师' : '家长';
      const plan = leave.type === 'reschedule'
        ? '申请调整到 ' + (store ? store.leave.labelOfDate(leave.newDate) : leave.newDate) + ' ' + weekTextOf(leave.newDate) + ' ' + leave.newTime
        : '申请取消本次排课';
      return (leave.by === 'parent' ? '家长请假' : '老师请假') + ' · ' + leave.reason + ' · ' + plan + ' · 等待' + (isMine ? other : '你') + '确认';
    }
    function leaveDaysOf() {
      if (!store || !leaveTarget) return [];
      const item = store.byId(leaveTarget);
      return item ? store.leave.days(item).slice(0, 14) : [];
    }
    function updateLeaveSubmit() {
      leaveSubmit.disabled = !(leaveReason && (leaveType === 'cancel' || (leaveDate && leaveTime)));
    }
    function renderLeaveTimes(days) {
      const day = (days || leaveDaysOf()).filter(entry => entry.date === leaveDate)[0];
      const times = day ? day.times : [];
      if (times.indexOf(leaveTime) === -1) leaveTime = times[0] || '';
      leaveTimes.innerHTML = times.map(time => '<button class="leave-time' + (time === leaveTime ? ' active' : '') + '" type="button" data-leave-time="' + time + '">' + time + '</button>').join('');
      updateLeaveSubmit();
    }
    function renderLeaveDates() {
      const days = leaveDaysOf();
      if (!days.length) {
        leaveDate = ''; leaveTime = '';
        leaveDates.innerHTML = '<span class="leave-tip">近期没有可调整的开放时段，可直接选择「直接取消本次排课」</span>';
        leaveTimes.innerHTML = '';
        updateLeaveSubmit();
        return;
      }
      if (!leaveDate || !days.some(day => day.date === leaveDate)) { leaveDate = days[0].date; leaveTime = days[0].times[0]; }
      leaveDates.innerHTML = days.map(day => '<button class="leave-date' + (day.date === leaveDate ? ' active' : '') + '" type="button" data-leave-date="' + day.date + '">' + day.label + '<small>' + day.week + '</small></button>').join('');
      renderLeaveTimes(days);
    }
    function openLeaveSheet(id) {
      if (!store) return;
      const item = store.byId(id);
      const check = store.leave.canRequest(id);
      if (!item || !check.ok) { showToast(check.reason || '当前无法发起请假'); return; }
      leaveTarget = id; leaveReason = ''; leaveType = 'reschedule'; leaveDate = ''; leaveTime = '';
      leaveNote.textContent = '本次课已冻结 ' + lessonsOf(item) + ' 课时：对方确认新时间即改期（课时继续冻结）；直接取消本次排课则归还课时';
      leaveNoteInput.value = '';
      leaveOrigin.textContent = '原上课时间：' + item.teacherName + ' · ' + (item.dateLabel || store.leave.labelOfDate(item.date)) + ' ' + YZB.timeRangeText(item.time, item.endTime);
      leaveReasons.innerHTML = LEAVE_REASONS.map(reason => '<button class="reason" type="button" data-leave-reason="' + reason + '">' + reason + '</button>').join('');
      leaveTypeBox.querySelectorAll('[data-leave-type]').forEach(button => button.classList.toggle('active', button.dataset.leaveType === 'reschedule'));
      leaveSlot.hidden = false;
      renderLeaveDates();
      updateLeaveSubmit();
      leaveSheet.classList.add('show'); sheetMask.classList.add('show');
    }
    function closeLeaveSheet() { leaveSheet.classList.remove('show'); sheetMask.classList.remove('show'); leaveTarget = ''; }

    document.querySelectorAll('.tab').forEach(tab => tab.onclick = () => { activeFilter = tab.dataset.filter; applyFilters(); try{const url=new URL(location.href);url.searchParams.set('filter',activeFilter);history.replaceState(null,'',url)}catch{} });
    monthSelect.onchange = applyFilters;
    courseSelect.onchange = applyFilters;
    document.querySelectorAll('.mode-option').forEach(option => option.onclick = () => { document.querySelector('.mode-option.active').classList.remove('active'); option.classList.add('active'); applyFilters(); });
    recordList.addEventListener('click', event => {
      const planConfirm = event.target.closest('[data-confirm-plan]');
      if (planConfirm) {
        if (store && store.confirmPlan) store.confirmPlan(planConfirm.dataset.confirmPlan);
        activeFilter = 'waiting';
        refresh();
        showToast('已确认老师，已生成每节课程');
        return;
      }
      const cancelButton = event.target.closest('[data-cancel]');
      if (cancelButton) { openSheet(cancelButton.dataset.cancel); return; }
      const leaveButton = event.target.closest('[data-leave]');
      if (leaveButton) { openLeaveSheet(leaveButton.dataset.leave); return; }
      const withdrawButton = event.target.closest('[data-leave-withdraw]');
      if (withdrawButton) {
        const result = store ? store.leave.withdraw(withdrawButton.dataset.leaveWithdraw) : { ok: false };
        refresh();
        showToast(result.ok ? '已撤回请假申请' : (result.reason || '撤回失败'));
        return;
      }
      const respondButton = event.target.closest('[data-leave-respond]');
      if (respondButton) {
        const targetId = respondButton.dataset.leaveRespond;
        const decision = respondButton.dataset.decision;
        const target = store ? store.byId(targetId) : null;
        const lessons = target ? lessonsOf(target) : 0;
        const result = store ? store.leave.respond(targetId, decision) : { ok: false };
        if (!result.ok) { showToast(result.reason || '操作失败，请重试'); refresh(); return; }
        refresh();
        showToast(decision === 'cancel' ? '已取消本次排课，已归还 ' + lessons + ' 课时' : '已按新时间确认，课次已改期');
        return;
      }
      if (event.target.closest('a,button')) return;
      const card = event.target.closest('.record[data-detail]');
      if (card) location.href = '课程详情_页面还原.html?role=parent&booking=' + card.dataset.booking + '&course=' + card.dataset.detail;
    });
    recordList.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const card = event.target.closest('.record[data-detail]');
      if (!card || event.target.closest('a,button')) return;
      event.preventDefault();
      card.click();
    });
    reasonList.addEventListener('click', event => {
      const button = event.target.closest('[data-reason]');
      if (!button) return;
      cancelReason = button.dataset.reason;
      reasonList.querySelectorAll('.reason').forEach(item => item.classList.toggle('active', item === button));
      cancelConfirm.disabled = false;
    });
    document.querySelector('#cancelAbort').onclick = closeSheet;
    document.querySelector('#leaveAbort').onclick = closeLeaveSheet;
    sheetMask.onclick = () => { closeSheet(); closeLeaveSheet(); };
    leaveReasons.addEventListener('click', event => {
      const button = event.target.closest('[data-leave-reason]');
      if (!button) return;
      leaveReason = button.dataset.leaveReason;
      leaveReasons.querySelectorAll('.reason').forEach(item => item.classList.toggle('active', item === button));
      updateLeaveSubmit();
    });
    leaveTypeBox.addEventListener('click', event => {
      const button = event.target.closest('[data-leave-type]');
      if (!button) return;
      leaveType = button.dataset.leaveType;
      leaveTypeBox.querySelectorAll('[data-leave-type]').forEach(item => item.classList.toggle('active', item === button));
      leaveSlot.hidden = leaveType === 'cancel';
      updateLeaveSubmit();
    });
    leaveDates.addEventListener('click', event => {
      const button = event.target.closest('[data-leave-date]');
      if (!button) return;
      leaveDate = button.dataset.leaveDate;
      leaveDates.querySelectorAll('.leave-date').forEach(item => item.classList.toggle('active', item === button));
      renderLeaveTimes();
    });
    leaveTimes.addEventListener('click', event => {
      const button = event.target.closest('[data-leave-time]');
      if (!button) return;
      leaveTime = button.dataset.leaveTime;
      leaveTimes.querySelectorAll('.leave-time').forEach(item => item.classList.toggle('active', item === button));
      updateLeaveSubmit();
    });
    leaveSubmit.onclick = () => {
      if (!store || !leaveTarget) return;
      const type = leaveType;
      const result = store.leave.request(leaveTarget, { by: VIEWER, type: type, reason: leaveReason, note: leaveNoteInput.value, newDate: leaveDate, newTime: leaveTime });
      if (!result.ok) { showToast(result.reason || '提交失败，请检查后重试'); return; }
      closeLeaveSheet();
      refresh();
      showToast(type === 'cancel' ? '请假已提交，等待对方确认取消' : '请假已提交，等待对方确认新时间');
    };
    cancelConfirm.onclick = () => {
      if (!cancelTarget || !cancelReason || !store) return;
      const cancelled = store.byId(cancelTarget);
      store.cancel(cancelTarget, cancelReason);
      closeSheet();
      refresh();
      showToast(cancelled && cancelled.isPlan && cancelled.status === 'pending' ? '需求已取消，未冻结课时' : '已取消约课，冻结课时已释放');
    };
    document.querySelector('.back').onclick = () => location.href = '学习中心_页面还原.html';

    fillFilters();
    refresh();
    function fit() { const scale = Math.min((innerWidth - 32) / 464, (innerHeight - 32) / 980, 1); document.documentElement.style.setProperty('--device-scale', Math.max(scale, .2)); }
    fit(); addEventListener('resize', fit, { passive: true });
  </script>
