    .material-sticky{position:sticky;z-index:9;top:var(--material-sticky-top,53px);padding:3px 0 1px;background:rgba(245,244,246,.97);backdrop-filter:blur(12px);box-shadow:0 8px 12px -12px rgba(35,50,69,.38)}.matched-copy{margin:0 12px 12px;padding:13px 14px 12px;border:1px solid #e3ebf6;border-radius:14px;background:linear-gradient(145deg,#fff,#f8fbff);box-shadow:0 5px 15px rgba(35,50,69,.05)}.matched-copy-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.matched-copy-title{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650}.matched-copy-title:before{content:"文";width:24px;height:24px;display:grid;place-items:center;border-radius:8px;background:#e9f2ff;color:#2778ed;font-size:12px}.copy-index{color:#97a0ab;font-size:10px;font-weight:400}.change-copy{height:28px;padding:0 10px;border-radius:14px;background:#edf5ff;color:#276bc8;font-size:11px}.matched-copy-text{margin:10px 0 11px;color:#495665;font-size:12px;line-height:1.7;white-space:pre-line}.copy-tools{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid #edf0f4}.copy-scene{color:#929aa5;font-size:10px}.copy-now{height:29px;padding:0 12px;border-radius:15px;background:#2778ed;color:#fff;font-size:11px}.poster-info{position:relative;padding-right:74px}.poster-info:after{content:"配套3条文案";position:absolute;right:9px;bottom:1px;padding:2px 5px;border-radius:7px;background:#edf5ff;color:#3475ca;font-size:8px}.sheet-panel{max-height:82%;overflow-y:auto}.sheet-copy{margin:0 0 18px;padding:12px 13px;border:1px solid #e5ebf3;border-radius:12px;background:#fbfcfe}.sheet-copy-head{display:flex;align-items:center;justify-content:space-between}.sheet-copy-head strong{font-size:12px}.sheet-change-copy{color:#2871d2;font-size:11px}.sheet-copy p{margin:9px 0 11px;color:#4a5765;font-size:12px;line-height:1.65;white-space:pre-line}.sheet-copy-foot{display:flex;align-items:center;justify-content:space-between}.sheet-copy-foot span{color:# <body>
  <main class="phone-shell" aria-label="推广中心页面">
    <div class="dynamic-island" aria-hidden="true"></div>
    <div class="app">
      <div class="page">
        <header>
          <div class="statusbar"><span>23:58</span><div class="device-status" aria-label="手机状态"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"><i></i></span><span class="battery"></span></div></div>
          <div class="titlebar"><button class="back-button" type="button" aria-label="返回个人中心"></button><h1>推广中心</h1><div class="capsule" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="mini-ring"></span></div></div>
        </header>

        <div class="scroll">
          <section class="intro">
            <div class="intro-top"><div><h2>精选推广素材</h2><p>选择海报，带上你的专属邀请码一键转发</p></div><span class="intro-icon"><svg viewBox="0 0 24 24"><path d="M3 11v2a2 2 0 0 0 2 2h2l8 4V5L7 9H5a2 2 0 0 0-2 2Z"/><path d="M7 15l1 5h3M19 8a5 5 0 0 1 0 8"/></svg></span></div>
            <div class="intro-meta"><span><strong>8</strong>张精选海报</span><span><strong>15</strong>条配套文案</span></div>
          </section>

          <div class="filter-panel">
            <nav class="tabs" aria-label="素材类型">
              <button class="tab active" data-filter="all">全部</button>
              <button class="tab" data-filter="partner">招募合伙人</button>
              <button class="tab" data-filter="institution">招募机构</button>
              <button class="tab" data-filter="teacher">招募老师</button>
              <button class="tab" data-filter="parent">招募学生家长</button>
            </nav>
            <div class="subfilters" aria-label="机构类型"><button class="subfilter active" data-subfilter="institution">全部机构</button><button class="subfilter" data-subfilter="psychology">心理机构</button><button class="subfilter" data-subfilter="school">升学机构</button></div>
          </div>

          <div class="material-sticky">
            <div class="section-title"><h2>海报素材</h2><span id="resultCount">共 8 张</span></div>
            <section class="matched-copy" aria-label="当前海报配套文案">
              <div class="matched-copy-head"><div class="matched-copy-title">配套朋友圈文案 <span class="copy-index" id="copyIndex">1/3</span></div><button class="change-copy" type="button" data-change-copy>换一条</button></div>
              <p class="matched-copy-text" id="matchedCopy"></p>
              <div class="copy-tools"><span class="copy-scene">已匹配当前选中海报</span><button class="copy-now" type="button" data-copy-current>复制文案</button></div>
            </section>
          </div>
          <section class="poster-grid" aria-label="海报素材列表">
            <button class="poster-card selected" data-category="partner" data-title="与优秀者同行" data-copy="加入优坐标合伙人计划，共享教育服务新机遇。">
              <span class="selection" aria-hidden="true"></span><div class="poster partner"><span class="poster-brand">优坐标 · YOUZUOBIAO</span><div class="poster-copy"><span class="poster-kicker">合伙人计划</span><h3>与优秀者<br>同行</h3><p>同创教育服务新价值<br>共享长期成长</p></div><span class="poster-person"></span><div class="poster-bottom"><span>扫码了解合伙人计划</span><img src="assets/用户邀请小程序码-白底.png" alt="专属邀请码"></div></div><div class="poster-info"><strong>与优秀者同行</strong><span>合伙人招募 · 蓝金版</span></div>
            </button>
            <button class="poster-card" data-category="psychology institution" data-title="心理服务合作招募" data-copy="专业心理服务机构合作招募，让优质服务被更多家庭看见。">
              <span class="selection"></span><div class="poster psychology"><span class="poster-brand">优坐标 · 心理服务</span><div class="poster-copy"><span class="poster-kicker">心理机构招募</span><h3>专业同行<br>温暖共生</h3><p>联结专业心理服务力量<br>共同守护家庭成长</p></div><span class="poster-person"></span><div class="poster-bottom"><span>扫码申请合作</span><img src="assets/用户邀请小程序码-白底.png" alt="专属邀请码"></div></div><div class="poster-info"><strong>专业同行 温暖共生</strong><span>心理机构招募</span></div>
            </button>
            <button class="poster-card" data-category="school institution" data-title="升学规划机构合作" data-copy="邀请优质升学规划机构入驻，共建学生成长服务网络。">
              <span class="selection"></span><div class="poster school"><span class="poster-brand">优坐标 · 升学规划</span><div class="poster-copy"><span class="poster-kicker">升学机构招募</span><h3>联结专业<br>规划未来</h3><p>邀请优质升学服务机构<br>携手赋能学生成长</p></div><span class="poster-person"></span><div class="poster-bottom"><span>扫码了解入驻</span><img src="assets/用户邀请小程序码-白底.png" alt="专属邀请码"></div></div><div class="poster-info"><strong>联结专业 规划未来</strong><span>升学机构招募</span></div>
            </button>
            <button class="poster-card" data-category="teacher" data-title="优秀老师招募计划" data-copy="优坐标招募优秀教师，灵活授课，让专业获得更多认可。">
              <span class="selection"></span><div class="poster teacher"><span class="poster-brand">优坐标 · 教师招募</span><div class="poster-copy"><span class="poster-kicker">优秀老师计划</span><h3>让专业<br>被更多人看见</h3><p>灵活授课 · 精准匹配<br>共享品质教育服务</p></div><span class="poster-person"></span><div class="poster-bottom"><span>扫码申请成为老师</span><img src="assets/用户邀请小程序码-白底.png" alt="专属邀请码"></div></div><div class="poster-info"><strong>让专业被更多人看见</strong><span>老师招募 · 专业版</span></div>
            </button>
            <button class="poster-card" data-category="parent" data-title="为孩子匹配好老师" data-copy="邀请家长加入优坐标，为孩子匹配更适合的老师和课程。">
              <span class="selection"></span><div class="poster parent"><span class="poster-brand">优坐标 · 家长专享</span><div class="poster-copy"><span class="poster-kicker">学生家长招募</span><h3>找对老师<br>学习更高效</h3><p>真实教员资料 · 专业课程服务<br>陪伴每一次成长</p></div><span class="poster-person"></span><div class="poster-bottom"><span>扫码领取学习方案</span><img src="assets/用户邀请小程序码-白底.png" alt="专属邀请码"></div></div><div class="poster-info"><strong>找对老师 学习更高效</strong><span>学生家长招募</span></div>

              <span class="selection"></span><div class="poster partner"><span class="poster-brand">优坐标 · 合伙人计划</span><div class="poster-copy"><span class="poster-kicker">城市合伙人</span><h3>一起做<br>有价值的事</h3><p>平台支持 · 长期成长<br>开启教育服务新机遇</p></div><span class="poster-person"></span><div class="poster-bottom"><span>扫码开启合作</span><img src="assets/用户邀请小程序码-白底.png" alt="专属邀请码"></div></div><div class="poster-info"><strong>一起做有价值的事</strong><span>合伙人招募 · 事业版</span></div>

            </button>

              <span class="selection"></span><div class="poster parent"><span class="poster-brand">优坐标 · 家长专享</span><div class="poster-copy"><span class="poster-kicker">专属学习方案</span><h3>一份好方案<br>陪伴好成长</h3><p>优质课程 · 精准匹配<br>让家长选择更省心</p></div><span class="poster-person"></span><div class="poster-bottom"><span>扫码开启专属服务</span><img src="assets/用户邀请小程序码-白底.png" alt="专属邀请码"></div></div><div class="poster-info"><strong>一份好方案 陪伴好成长</strong><span>学生家长招募</span></div>

        <div class="actionbar"><div class="selected-copy"><strong id="selectedTitle">与优秀者同行</strong><span>已选 1 张海报</span></div><button class="action-button save" id="savePoster">保存海报</button><button class="action-button share" id="sharePoster">转发推广</button></div>
        <div class="sheet" id="shareSheet" aria-hidden="true"><section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="shareTitle"><div class="sheet-head"><h2 id="shareTitle">转发推广</h2><button class="sheet-close" type="button" aria-label="关闭">×</button></div><div class="share-poster"><span class="share-thumb"></span><div><strong id="sheetPosterTitle">与优秀者同行</strong><span>海报已带上你的专属邀请码</span></div></div><div class="sheet-copy"><div class="sheet-copy-head"><strong>推荐朋友圈文案</strong><button class="sheet-change-copy" type="button" data-change-copy>换一条</button></div><p id="sheetMatchedCopy"></p><div class="sheet-copy-foot"><span id="sheetCopyIndex">1/3</span><button class="sheet-copy-button" type="button" data-copy-current>复制文案</button></div></div><div class="share-options"><button class="share-option" data-share="微信好友"><span class="share-icon wechat">微</span><span>微信好友</span></button><button class="share-option" data-share="朋友圈"><span class="share-icon moments">◎</span><span>朋友圈</span></button><button class="share-option" data-share="复制文案"><span class="share-icon copy">文</span><span>复制文案</span></button><button class="share-option" data-share="更多方式"><span class="share-icon more-share">···</span><span>更多</span></button></div><button class="sheet-cancel" type="button">取消</button></section></div>
        <div class="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
  </main>
  <script>
    const copyTemplates={
      partner:[
        '最近在关注一个教育服务合作机会。\n优坐标正在招募合伙人，如果你也认可长期价值，欢迎扫码了解。\n#优坐标 #合伙人招募',
        '教育服务是一件值得长期做的事。\n寻找愿意一起链接资源、服务家庭、共同成长的伙伴。感兴趣可以看看海报里的介绍。\n#教育服务 #合伙人',
        '一个人走得快，一群人才能走得远。\n优坐标合伙人计划开放中，期待遇见同样关注教育与成长的你。\n#与优秀者同行'
      ],
      psychology:[
        '好的心理服务，值得被更多家庭看见。\n优坐标现邀请专业心理服务机构合作，共同守护孩子与家庭的成长。\n#心理服务 #机构合作',
        '专业是基础，温暖是力量。\n我们正在链接更多优质心理服务机构，让需要帮助的家庭更容易找到合适的服务。\n#专业同行 #温暖共生',
        '如果你所在的机构专注心理咨询、家庭教育或成长支持，欢迎了解优坐标合作计划。\n期待与专业的你携手。\n#心理机构招募'
      ],
      school:[
        '为学生做升学规划，不只是选择一条路，更是帮助他看见更多可能。\n优坐标诚邀优质升学规划机构入驻合作。\n#升学规划 #机构合作',
        '联结专业力量，陪学生走好关键的每一步。\n如果你专注升学规划与学生生涯服务，欢迎扫码了解合作。\n#规划未来',
        '正在寻找专业、负责、真正以学生成长为中心的升学服务伙伴。\n共建更完整的学生成长服务网络。\n#升学机构招募'
      ],
      teacher:[
        '好老师，值得被更多学生看见。\n优坐标正在招募优秀教师，如果你热爱教育、认真对待每一堂课，欢迎加入。\n#教师招募 #优坐标',
        '用专业帮助学生，用耐心陪伴成长。\n这里有灵活的授课机会，也有对好老师的尊重。期待与你同行。\n#老师入驻 #教育同行',
        '如果你擅长学科辅导、家庭教育或成长陪伴，可以了解一下优坐标教师计划。\n让每一份专业，都找到适合的学生。\n#诚邀优秀教师'
      ],
      parent:[
        '给孩子选老师，适合比“有名”更重要。\n优坐标帮家长了解真实教员资料，匹配更适合的课程与老师。\n#孩子成长 #家长分享',
        '学习不是盲目加码，找对方法和老师更关键。\n有需要的家长可以扫码了解，先看看哪种学习方案更适合孩子。\n#学习方案 #家长必看',
        '每个孩子的节奏都不一样。\n从真实需求出发，匹配合适的老师和课程，让家长选择更省心。\n#找对老师 #陪伴成长'
      ]
    };
    const cards=[...document.querySelectorAll('.poster-card')];
    const tabs=[...document.querySelectorAll('.tab')];
    const subfilters=[...document.querySelectorAll('.subfilter')];
    const subfilterRow=document.querySelector('.subfilters');
    const selectedTitle=document.querySelector('#selectedTitle');
    const sheetPosterTitle=document.querySelector('#sheetPosterTitle');
    const resultCount=document.querySelector('#resultCount');
    const scrollArea=document.querySelector('.scroll');
    const filterPanel=document.querySelector('.filter-panel');
    const shareSheet=document.querySelector('#shareSheet');
    const toast=document.querySelector('.toast');
    const matchedCopy=document.querySelector('#matchedCopy');
    const sheetMatchedCopy=document.querySelector('#sheetMatchedCopy');
    const copyIndexLabel=document.querySelector('#copyIndex');
    const sheetCopyIndex=document.querySelector('#sheetCopyIndex');
    let activeFilter='all',activeSubfilter='institution',selectedCard=cards[0],copyIndex=0,currentCopy='',toastTimer;

    function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)}
    function getCopySet(){const category=selectedCard.dataset.category.split(' ')[0];return copyTemplates[category]||[selectedCard.dataset.copy]}
    function renderCopy(){const copies=getCopySet();currentCopy=copies[copyIndex%copies.length];matchedCopy.textContent=currentCopy;sheetMatchedCopy.textContent=currentCopy;copyIndexLabel.textContent=`${copyIndex+1}/${copies.length}`;sheetCopyIndex.textContent=`${copyIndex+1}/${copies.length}`}
    function selectCard(card){cards.forEach(item=>item.classList.toggle('selected',item===card));selectedCard=card;copyIndex=0;selectedTitle.textContent=card.dataset.title;sheetPosterTitle.textContent=card.dataset.title;renderCopy()}
    function changeCopy(){const copies=getCopySet();copyIndex=(copyIndex+1)%copies.length;renderCopy()}
    async function copyCurrent(){try{await navigator.clipboard.writeText(currentCopy);showToast('朋友圈文案已复制')}catch{showToast('朋友圈文案已复制（原型演示）')}}
    function applyFilter(){let count=0;cards.forEach(card=>{const categories=card.dataset.category.split(' ');const matches=activeFilter==='all'||categories.includes(activeFilter);const subMatches=activeFilter!=='institution'||activeSubfilter==='institution'||categories.includes(activeSubfilter);card.hidden=!(matches&&subMatches);if(!card.hidden)count++});resultCount.textContent=`共 ${count} 张`;if(selectedCard.hidden){const first=cards.find(card=>!card.hidden);if(first)selectCard(first)}}
    function syncStickyOffset(){scrollArea.style.setProperty('--material-sticky-top',`${filterPanel.offsetHeight}px`)}
    tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(item=>item.classList.toggle('active',item===tab));activeFilter=tab.dataset.filter;subfilterRow.classList.toggle('show',activeFilter==='institution');applyFilter();requestAnimationFrame(syncStickyOffset)}));
    subfilters.forEach(filter=>filter.addEventListener('click',()=>{subfilters.forEach(item=>item.classList.toggle('active',item===filter));activeSubfilter=filter.dataset.subfilter;applyFilter()}));
    cards.forEach(card=>card.addEventListener('click',()=>selectCard(card)));
    document.querySelectorAll('[data-change-copy]').forEach(button=>button.addEventListener('click',changeCopy));
    document.querySelectorAll('[data-copy-current]').forEach(button=>button.addEventListener('click',copyCurrent));
    document.querySelector('.back-button').addEventListener('click',()=>location.href='个人中心_页面还原.html');
    document.querySelector('#savePoster').addEventListener('click',()=>showToast('海报已保存到相册（原型演示）'));
    function openSheet(){shareSheet.classList.add('open');shareSheet.setAttribute('aria-hidden','false')}
    function closeSheet(){shareSheet.classList.remove('open');shareSheet.setAttribute('aria-hidden','true')}
    document.querySelector('#sharePoster').addEventListener('click',openSheet);
    document.querySelector('.sheet-close').addEventListener('click',closeSheet);
    document.querySelector('.sheet-cancel').addEventListener('click',closeSheet);
    shareSheet.addEventListener('click',event=>{if(event.target===shareSheet)closeSheet()});
    document.querySelectorAll('[data-share]').forEach(button=>button.addEventListener('click',async()=>{const type=button.dataset.share;if(type==='复制文案'){await copyCurrent()}else{showToast(`已选择${type}，将同时携带配套文案（原型演示）`)}closeSheet()}));
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeSheet()});
    renderCopy();syncStickyOffset();
    function fit(){const scale=Math.min((innerWidth-32)/464,(innerHeight-32)/980,1);document.documentElement.style.setProperty('--device-scale',Math.max(scale,.2));syncStickyOffset()}fit();addEventListener('resize',fit,{passive:true});
  </script>
</body>
</html>
