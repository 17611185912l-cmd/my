<body><main class="phone-shell" aria-label="学习中心页面"><div class="dynamic-island" aria-hidden="true"></div><div class="app"><div class="page"><header><div class="statusbar"><span>23:58</span><div class="device-status"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"><i></i></span><span class="battery"></span></div></div><div class="titlebar"><button class="back" type="button" aria-label="返回个人中心"></button><h1>学习中心</h1><div class="capsule" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="ring"></span></div></div></header><div class="content">

  </div></div></div></main>
  <script>
    const purchasedHours=60,usedHours=36,remainingHours=Math.max(0,purchasedHours-usedHours);
    document.querySelector('[data-hours="purchased"]').textContent=purchasedHours;document.querySelector('[data-hours="used"]').textContent=usedHours;document.querySelector('[data-hours="remaining"]').textContent=remainingHours;
    document.querySelector('.back').onclick=()=>location.href='个人中心_页面还原.html';
    document.querySelectorAll('.day:not(.muted)').forEach(day=>day.onclick=()=>{document.querySelector('.day.selected')?.classList.remove('selected');day.classList.add('selected');document.querySelector('.plan-date').textContent=day.dataset.date||`8月${day.textContent}日`;document.querySelector('.plan-content').innerHTML=day.classList.contains('has-plan')?`<article class="plan-course"><span class="plan-course-time">${day.textContent==='10'?'10:00':'19:00'}</span><span class="plan-course-copy"><strong>高一数学·专题辅导</strong><span>张三老师·60分钟</span></span></article>`:'<div class="empty">当日暂无课程计划</div>'});
    document.querySelectorAll('.month-switch').forEach(button=>button.onclick=()=>{const next=button.dataset.step==='1';document.querySelector('.month-label').textContent=next?'2026年9月':'2026年7月';document.querySelector('.plan-card .section-note').textContent=next?'9月 6课时':'7月 10课时'});
    function fit(){const scale=Math.min((innerWidth-32)/464,(innerHeight-32)/980,1);document.documentElement.style.setProperty('--device-scale',Math.max(scale,.2))}fit();addEventListener('resize',fit,{passive:true});
  </script>
