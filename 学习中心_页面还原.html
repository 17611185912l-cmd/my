  <script>
    const hoursData=window.YZB?YZB.hours():{purchased:60,used:36,available:24,frozen:0};
    document.querySelector('[data-hours="purchased"]').textContent=hoursData.purchased;document.querySelector('[data-hours="used"]').textContent=hoursData.used;document.querySelector('[data-hours="remaining"]').textContent=hoursData.available;document.querySelector('[data-hours="booked"]').textContent=hoursData.frozen;
    const planEntryNote=document.querySelector('#planEntryNote');
    if(planEntryNote){const planMap=window.YZB?YZB.plans():{};const activeIds=Object.keys(planMap).filter(id=>planMap[id].length);const slotTotal=activeIds.reduce((n,id)=>n+planMap[id].length,0);planEntryNote.textContent=activeIds.length?(activeIds.length+' 门课程 · '+slotTotal+' 个固定时段'):'尚未维护';}
    const monthLabel=document.querySelector('.month-label'),monthCenter=document.createElement('span'),calendarToggle=document.createElement('button'),calendarDays=document.querySelector('.days');
    monthCenter.className='month-center';monthLabel.before(monthCenter);monthCenter.append(monthLabel);
    calendarToggle.className='calendar-toggle';calendarToggle.type='button';calendarToggle.textContent='查看当月';calendarToggle.setAttribute('aria-label','查看当月');calendarToggle.setAttribute('aria-expanded','false');calendarDays.after(calendarToggle);
    const INITIAL_CALENDAR_MONTH=new Date(2026,7,1);
    const STATIC_PLANS={
      '2026-08-10':{title:'高一数学·函数基础',detail:'function-0810',time:'10:00',mode:'offline'},
      '2026-08-12':{title:'高一数学·专题辅导',detail:'tutorial',time:'19:00',mode:'online'},
      '2026-08-15':{title:'高一数学·专题辅导',detail:'sequence-0815',time:'19:00',mode:'online'},
      '2026-08-19':{title:'高一数学·专题辅导',detail:'tutorial',time:'19:00',mode:'online'}
    };
    const MONTH_NOTES={'2026-07':'7月 10课时','2026-08':'本月 8课时','2026-09':'9月 6课时'};
    let calendarCursor=new Date(INITIAL_CALENDAR_MONTH),selectedDate='2026-08-10',calendarExpanded=false;
    function dateKey(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
    function dateLabelOf(key){const parts=key.split('-');return Number(parts[1])+'月'+Number(parts[2])+'日'}
    function bookingPlans(courseDate){
      if(!window.YZB)return '';
      return YZB.list().filter(item=>item.date===courseDate&&(item.status==='pending'||item.status==='confirmed')).map(item=>`<article class="plan-course" role="link" tabindex="0" data-booking="${item.id}" data-course="${item.courseId}" data-mode="${item.mode==='线下'?'offline':item.mode==='上门'?'home':'online'}"><div class="record-top"><strong>${item.courseName}</strong><span class="record-state${item.status==='confirmed'?' waiting':''}">${item.status==='confirmed'?'待上课':'待确认'}</span></div><div class="record-meta"><span>${item.teacherName}</span><span>${item.dateLabel} ${item.time}</span><span>${item.mode} · ${item.place}</span><span>${item.durationLabel||'60分钟'} · ${YZB.lessonsOf(item)}课时</span></div></article>`).join('');
    }
    function renderPlan(courseDate){
      document.querySelector('.plan-date').textContent=dateLabelOf(courseDate);
      const bookingPlan=bookingPlans(courseDate),staticPlan=STATIC_PLANS[courseDate];
      document.querySelector('.plan-content').innerHTML=bookingPlan||(staticPlan?`<article class="plan-course" role="link" tabindex="0" data-mode="${staticPlan.mode}" data-detail="${staticPlan.detail}"><div class="record-top"><strong>${staticPlan.title}</strong><span class="record-state waiting">待上课</span></div><div class="record-meta"><span>张三老师</span><span>${dateLabelOf(courseDate)} ${staticPlan.time}</span><span>陕西省·人教A版</span><span>60分钟</span></div></article>`:'<div class="empty">当日暂无课程计划</div>');
    }
    function updateCalendarView(){
      const days=[...calendarDays.querySelectorAll('.day')],selectedIndex=Math.max(0,days.findIndex(day=>day.classList.contains('selected'))),selectedRow=Math.floor(selectedIndex/7);
      days.forEach((day,index)=>{day.hidden=!calendarExpanded&&Math.floor(index/7)!==selectedRow});
      calendarToggle.setAttribute('aria-expanded',String(calendarExpanded));calendarToggle.textContent=calendarExpanded?'收起本周':'查看当月';calendarToggle.setAttribute('aria-label',calendarExpanded?'收起本周':'查看当月');
    }
    function renderCalendar(){
      const year=calendarCursor.getFullYear(),month=calendarCursor.getMonth(),offset=(new Date(year,month,1).getDay()+6)%7,daysInMonth=new Date(year,month+1,0).getDate(),cellCount=Math.ceil((offset+daysInMonth)/7)*7;
      const records=window.YZB?YZB.list().filter(item=>item.status==='pending'||item.status==='confirmed'):[];
      let html='';
      for(let index=0;index<cellCount;index+=1){
        const date=new Date(year,month,index-offset+1),key=dateKey(date),inMonth=date.getMonth()===month,matched=records.filter(item=>item.date===key);
        const classes=['day'];
        if(!inMonth)classes.push('muted');
        if(key===selectedDate)classes.push('selected');
        if(inMonth&&(STATIC_PLANS[key]||matched.some(item=>item.status==='confirmed')))classes.push('has-plan');
        if(inMonth&&matched.some(item=>item.status==='pending'))classes.push('has-pending');
        html+=`<button class="${classes.join(' ')}" type="button" data-date="${key}"${inMonth?'':' disabled'}>${date.getDate()}</button>`;
      }
      calendarDays.innerHTML=html;monthLabel.textContent=year+'年'+(month+1)+'月';
      document.querySelector('.plan-card .section-note').textContent=MONTH_NOTES[year+'-'+String(month+1).padStart(2,'0')]||`${month+1}月 0课时`;
      updateCalendarView();
    }
    calendarToggle.onclick=()=>{calendarExpanded=!calendarExpanded;updateCalendarView()};
    calendarDays.addEventListener('click',event=>{const day=event.target.closest('.day:not(.muted)');if(!day)return;selectedDate=day.dataset.date;calendarDays.querySelector('.day.selected')?.classList.remove('selected');day.classList.add('selected');updateCalendarView();renderPlan(selectedDate)});
    document.querySelectorAll('.month-switch').forEach(button=>button.onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+Number(button.dataset.step),1);selectedDate=dateKey(calendarCursor);calendarExpanded=false;renderCalendar();renderPlan(selectedDate)});
    renderCalendar();renderPlan(selectedDate);
    document.querySelector('.plan-content').addEventListener('click',event=>{const card=event.target.closest('.plan-course');if(!card)return;const booking=card.dataset.booking,course=card.dataset.course||card.dataset.detail;if(!booking&&!course)return;location.href=`课程详情_页面还原.html?role=parent${booking?'&booking='+booking:''}&course=${encodeURIComponent(course||'')}`});
    document.querySelector('.plan-content').addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;const card=event.target.closest('.plan-course');if(!card)return;event.preventDefault();card.click()});
    document.querySelector('.back').onclick=()=>location.href='个人中心_页面还原.html';
    function fit(){const scale=Math.min((innerWidth-32)/464,(innerHeight-32)/980,1);document.documentElement.style.setProperty('--device-scale',Math.max(scale,.2))}fit();addEventListener('resize',fit,{passive:true});
  </script>
