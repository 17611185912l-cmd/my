<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf4ff"><title>家长沟通群</title>
  <style>
    :root{--device-scale:1;--blue:#4b7fb8;--ink:#24262b;--muted:#777a82;--line:#e5ebf2}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100svh;padding:16px;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:#e7eaee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{padding:0;border:0;color:inherit;background:none;cursor:pointer}.phone-shell{position:relative;isolation:isolate;width:464px;height:980px;padding:11px;border:1px solid #777d84;border-radius:66px;background:linear-gradient(135deg,#bfc3c7,#f4f5f6 20%,#8d9298 49%,#d9dcdf 72%,#73787e);box-shadow:0 34px 70px rgba(32,38,45,.28),inset 0 0 0 3px rgba(33,36,40,.68);transform:scale(var(--device-scale));transform-origin:center}.dynamic-island{position:absolute;z-index:30;top:22px;left:50%;width:126px;height:34px;transform:translateX(-50%);border-radius:20px;background:#050505}.dynamic-island:after{content:"";position:absolute;right:12px;top:11px;width:8px;height:8px;border-radius:50%;background:#111a25}.app{position:relative;width:440px;height:956px;overflow:hidden;border-radius:54px;background:#eef1f5;box-shadow:inset 0 0 0 1px rgba(0,0,0,.52)}header{position:absolute;z-index:10;left:0;right:0;top:0;color:#294966;background:linear-gradient(105deg,transparent 16%,rgba(255,255,255,.46) 36%,transparent 55%),linear-gradient(132deg,#f7faff,#edf4ff 48%,#dceafa)}.statusbar{height:36px;padding:17px 36px 0;display:flex;align-items:flex-start;justify-content:space-between;color:#050505;font-size:15px;line-height:1;font-weight:700}.device-status{display:flex;align-items:center;gap:8px}.signal{width:18px;height:12px;display:flex;align-items:flex-end;gap:2px}.signal i{width:3px;border-radius:2px 2px 0 0;background:#050505}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal i:nth-child(4){height:12px}.wifi{position:relative;width:18px;height:13px;overflow:hidden}.wifi:before,.wifi:after{content:"";position:absolute;left:50%;border:2px solid #050505;border-color:#050505 transparent transparent;border-radius:50%;transform:translateX(-50%)}.wifi:before{top:0;width:19px;height:17px}.wifi:after{top:5px;width:10px;height:9px}.wifi i{position:absolute;left:8px;bottom:0;width:3px;height:3px;border-radius:50%;background:#050505}.battery{position:relative;width:23px;height:11px;padding:2px;border:1.5px solid #919191;border-radius:3px}.battery:before{content:"";display:block;width:100%;height:100%;background:#050505}.battery:after{content:"";position:absolute;top:3px;right:-3px;width:2px;height:5px;background:#b4b4b4}.titlebar{position:relative;height:57px;display:flex;align-items:center}.titlebar h1{width:100%;margin:0;font-size:18px;line-height:26px;text-align:center}.titlebar h1 small{display:block;color:#65809c;font-size:14px;line-height:18px;font-weight:400}.back{position:absolute;z-index:4;left:20px;top:8px;width:40px;height:40px}.back:before{content:"";position:absolute;left:12px;top:13px;width:10px;height:10px;border:solid #294966;border-width:0 0 2px 2px;transform:rotate(45deg)}.more{position:absolute;right:18px;top:8px;width:40px;height:40px;font-size:22px;letter-spacing:2px}.messages{position:absolute;inset:93px 0 80px;padding:14px 12px 24px;overflow-y:auto;scrollbar-width:none}.messages::-webkit-scrollbar{display:none}.time{margin:4px 0 14px;color:#9a9da3;font-size:14px;text-align:center}.message{margin-bottom:16px;display:flex;align-items:flex-start;gap:8px}.message.mine{flex-direction:row-reverse}.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:6px;object-fit:cover;background:#dbe7f3}.message-body{max-width:292px}.name{display:block;margin-bottom:4px;color:#8b8f96;font-size:14px}.mine .name{text-align:right}.bubble{padding:10px 12px;border-radius:6px;color:#3d4148;background:#fff;font-size:14px;line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 3px rgba(45,60,76,.05)}.mine .bubble{background:#cfe5ff}.composer{position:absolute;z-index:12;left:0;right:0;bottom:0;min-height:80px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:8px;border-top:1px solid #dfe4ea;background:#f8f9fb}.paste{height:40px;padding:0 10px;border-radius:5px;color:var(--blue);background:#edf4ff;font-size:14px}.input{width:100%;height:40px;max-height:132px;padding:9px 10px;border:1px solid #d9dfe6;border-radius:5px;outline:none;resize:none;background:#fff;font-size:14px;line-height:20px}.input:focus{border-color:#8fb3d8}.send{height:40px;padding:0 13px;border-radius:5px;color:#fff;background:var(--blue);font-size:14px;font-weight:600}.send:disabled{color:#a5a8ad;background:#dfe3e8;cursor:default}.tip{position:absolute;z-index:30;left:50%;bottom:90px;padding:9px 14px;border-radius:5px;color:#fff;background:rgba(27,28,31,.88);font-size:14px;white-space:nowrap;transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:.2s}.tip.show{transform:translate(-50%,0);opacity:1}@media(max-width:520px){body{padding:0;background:#eef1f5}.phone-shell{border-color:transparent;box-shadow:none}}
  </style>
</head>
<body><main class="phone-shell" aria-label="家长沟通群模拟页面"><div class="dynamic-island" aria-hidden="true"></div><div class="app"><header><div class="statusbar"><span>23:58</span><div class="device-status"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"><i></i></span><span class="battery"></span></div></div><div class="titlebar"><button class="back" type="button" aria-label="返回课程详情"></button><h1>高一数学家长群<small>5人</small></h1><button class="more" type="button" aria-label="群聊设置">•••</button></div></header><section class="messages" id="messages" aria-live="polite"><div class="time">今天 19:26</div><article class="message"><img class="avatar" src="assets/profile-avatar.png" alt="王子涵家长头像"><div class="message-body"><span class="name">王子涵妈妈</span><div class="bubble">张老师，孩子今天课堂状态怎么样？</div></div></article><article class="message mine"><img class="avatar" src="assets/user-avatar.png" alt="张老师头像"><div class="message-body"><span class="name">张老师</span><div class="bubble">您好，课程反馈已经整理好了，稍后发群里。</div></div></article></section><div class="composer"><button class="paste" id="pasteButton" type="button">粘贴</button><textarea class="input" id="messageInput" aria-label="群聊消息" placeholder="粘贴课程反馈"></textarea><button class="send" id="sendButton" type="button" disabled>发送</button></div><div class="tip" id="tip">课程反馈已粘贴，可点击发送</div></div></main>
<script>
  const input=document.querySelector('#messageInput'),send=document.querySelector('#sendButton'),messages=document.querySelector('#messages'),tip=document.querySelector('#tip');
  function resizeInput(){input.style.height='40px';input.style.height=`${Math.min(input.scrollHeight,132)}px`;send.disabled=!input.value.trim()}
  input.addEventListener('input',resizeInput);
  document.querySelector('#pasteButton').onclick=async()=>{let text='';try{text=await navigator.clipboard.readText()}catch{}if(!text)try{text=localStorage.getItem('family-group-share-draft')||''}catch{}if(!text){tip.textContent='暂无可粘贴的课程反馈';tip.classList.add('show');setTimeout(()=>tip.classList.remove('show'),1600);return}input.value=text;resizeInput();input.focus();tip.textContent='课程反馈已粘贴，可点击发送';tip.classList.add('show');setTimeout(()=>tip.classList.remove('show'),1800)};
  send.onclick=()=>{const text=input.value.trim();if(!text)return;const message=document.createElement('article');message.className='message mine';message.innerHTML=`<img class="avatar" src="assets/user-avatar.png" alt="张老师头像"><div class="message-body"><span class="name">张老师</span><div class="bubble"></div></div>`;message.querySelector('.bubble').textContent=text;messages.appendChild(message);input.value='';resizeInput();messages.scrollTop=messages.scrollHeight;tip.textContent='已发送至家长群';tip.classList.add('show');setTimeout(()=>tip.classList.remove('show'),1600)};
  document.querySelector('.back').onclick=()=>{if(history.length>1)history.back();else location.href='课程详情_页面还原.html?role=teacher&course=trigonometry-0808'};
  setTimeout(()=>input.focus(),200);function fit(){const scale=Math.min((innerWidth-32)/464,(innerHeight-32)/980,1);document.documentElement.style.setProperty('--device-scale',Math.max(scale,.2))}fit();addEventListener('resize',fit,{passive:true});
</script></body></html>
