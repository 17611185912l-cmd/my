  <script src="约课数据.js?v=20260918-7"></script>
  <script>
    const TEACHER_ORDER = ['zhang', 'liming', 'wangjing', 'zhoumin'];
    /* 教师端授课记录 = 原「约课管理」+ 原「授课记录」：五个状态与家长端一一对应 */
    const TABS = [
      { key: 'all', label: '累计授课', states: null },
      { key: 'pending', label: '待确认', states: ['pending'] },
      { key: 'confirmed', label: '待上课', states: ['confirmed'] },
      { key: 'attended', label: '待反馈', states: ['attended'] },
      { key: 'done', label: '已完成', states: ['done'] }
    ];
    /* 兼容旧链接：waiting / feedback / review / finished / cancelled */
    const FILTER_ALIAS = { waiting: 'confirmed', review: 'attended', feedback: 'attended', finished: 'done', cancelled: 'all' };
    const STATE_TEXT = { pending: '待确认', confirmed: '待上课', attended: '待反馈', done: '已完成', cancelled: '已取消' };
    const FEEDBACK_COURSE = { trigonometry: 'trigonometry', 'function': 'derivative-0809', sequence: 'derivative-0809', tutorial: 'derivative-0809' };
    const REASONS = ['时间冲突', '该时段已被约满', '需要调整上课方式', '教学内容不匹配'];
    /* 请假：本页为教师视角，另一方是家长 */
    const VIEWER = 'teacher';
    const LEAVE_REASONS = ['临时有事', '身体不适', '学校/课程安排冲突', '想调整上课时间'];
    const params = new URLSearchParams(location.search);
    const requested = FILTER_ALIAS[params.get('filter') || ''] || params.get('filter') || '';
    let activeTab = TABS.some(tab => tab.key === requested) ? requested : 'all';
    let teacherId = 'zhang';
    let rejectTarget = '';
    let rejectReason = '';
    let leaveTarget = '', leaveReason = '', leaveType = 'reschedule', leaveDate = '', leaveTime = '';

    const listBox = document.querySelector('#list');
    const tabs = document.querySelector('#tabs');
    const toast = document.querySelector('#toast');
    const sheet = document.querySelector('#rejectSheet');
    const sheetMask = document.querySelector('#sheetMask');
    const reasonList = document.querySelector('#reasonList');
    const rejectConfirm = document.querySelector('#rejectConfirm');
    const leaveSheet = document.querySelector('#leaveSheet');
    const leaveNote = document.querySelector('#leaveNote');
    const leaveReasons = document.querySelector('#leaveReasons');
    const leaveNoteInput = document.querySelector('#leaveNoteInput');
    const leaveTypeBox = document.querySelector('#leaveType');
    const leaveSlot = document.querySelector('#leaveSlot');
    const leaveOrigin = document.querySelector('#leaveOrigin');
    const leaveDates = document.querySelector('#leaveDates');
    const leaveTimes = document.querySelector('#leaveTimes');
    const leaveSubmit = document.querySelector('#leaveSubmit');
    const monthSelect = document.querySelector('#monthFilter');
    const emptyBox = document.querySelector('#emptyBox');

    document.querySelector('.back').onclick = () => location.href = '授课中心_页面还原.html';
    document.querySelector('#teacherSwitch').onclick = () => {
      const next = (TEACHER_ORDER.indexOf(teacherId) + 1) % TEACHER_ORDER.length;
      teacherId = TEACHER_ORDER[next];
      document.querySelector('#teacherSwitch').textContent = '演示老师：' + YZB.teacher(teacherId).name.replace('老师', '');
      monthSelect.value = 'all';
      if (!recordsOf(TABS.filter(tab => tab.key === activeTab)[0]).length) activeTab = 'all';
      refresh();
      showToast('已切换到 ' + YZB.teacher(teacherId).name + ' 的授课记录');
    };
    document.querySelector('#checkinSim').onclick = () => {
      const target = YZB.forTeacher(teacherId, ['confirmed'])[0];
      if (!target) { showToast('当前老师没有待上课的约课'); return; }
      const lessons = YZB.lessonsOf(target);
      YZB.checkin(target.id);
      refresh();
      showToast('签到回调成功，已扣减 ' + lessons + ' 课时，待填写反馈');
    };

    function showToast(text) { toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }
    function modeKey(mode) { return mode === '线下' ? 'offline' : mode === '上门' ? 'home' : 'online'; }
    function stampOf(item) {
      if (item.isPlan) return (item.startDate || '') + ' ' + (((item.weeklySlots || [])[0] || {}).time || '');
      return (item.date || '') + ' ' + (item.time || '');
    }
    function recordsOf(tab) { return YZB.forTeacher(teacherId, tab.states); }
    /* 未来的约课升序排在前，历史记录按时间倒序 */
    function orderOf(a, b) {
      const upcoming = ['pending', 'confirmed'];
      const aFuture = upcoming.indexOf(a.status) > -1, bFuture = upcoming.indexOf(b.status) > -1;
      if (aFuture !== bFuture) return aFuture ? -1 : 1;
      return aFuture ? stampOf(a).localeCompare(stampOf(b)) : stampOf(b).localeCompare(stampOf(a));
    }
    /* 累计授课课时 = 老师历史基数 + 已签到扣减的课时（与家长端「已上课时」同口径） */
    function taughtLessons() {
      const teacher = YZB.teacher(teacherId);
      const base = teacher && Number(teacher.lessons) ? Number(teacher.lessons) : 0;
      return YZB.forTeacher(teacherId).reduce((sum, item) => sum + (item.deducted ? YZB.lessonsOf(item) : 0), base);
    }

    function tipOf(item) {
      const pendingLeave = item.leave && item.leave.status === 'pending' ? item.leave : null;
      if (pendingLeave) return '<span class="leave-tip">' + leaveTipText(pendingLeave) + '</span>';
      if (item.status === 'pending') {
        if (item.isPlan) {
          if (item.teacherAccepted) return '<span class="bk-tip frozen">' + item.teacherName + ' 已接单 · 等待家长确认</span>';
          return '<span class="bk-tip frozen">' + item.createdAt + (item.orderMode === 'demand' ? ' 发布 · 等待老师接单' : ' 家长指定 · 等待老师确认') + '</span>';
        }
        return '<span class="bk-tip frozen">' + item.createdAt + ' 家长提交 · 等待确认</span>';
      }
      if (item.isPlan && item.status === 'confirmed') return '<span class="bk-tip">固定周课表 · 已生成 ' + (item.sessionCount || 0) + ' 次课</span>';
      if (item.status === 'confirmed') return '';
      if (item.status === 'attended') return '';
      if (item.status === 'done') return '<span class="bk-tip deducted">课程已完成 · 反馈已提交</span>';
      const who = item.cancelledBy === 'teacher' ? (item.leave ? '老师取消' : '已拒绝') : '家长取消';
      return '<span class="bk-tip">' + who + ' · ' + (item.cancelReason || '未填写原因') + '</span>';
    }

    function actionsOf(item) {
      if (item.status === 'pending') {
        if (item.isPlan) {
          if (item.teacherAccepted) return '';
          return '<button class="btn plain" type="button" data-reject="' + item.id + '">拒绝</button>' +
                 '<button class="btn primary" type="button" data-accept-plan="' + item.id + '">' + (item.orderMode === 'demand' ? '接单' : '确认接单') + '</button>';
        }
        return '<button class="btn plain" type="button" data-reject="' + item.id + '">拒绝</button>' +
               '<button class="btn primary" type="button" data-confirm="' + item.id + '">确认接单</button>';
      }
      if (item.status === 'confirmed') {
        const leave = item.leave && item.leave.status === 'pending' ? item.leave : null;
        if (leave) {
          if (leave.by === VIEWER) return '<button class="btn plain" type="button" data-leave-withdraw="' + item.id + '">撤回请假</button>';
          return '<span class="leave-actions">' +
                 (leave.type === 'reschedule' ? '<button class="btn plain" type="button" data-leave-respond="' + item.id + '" data-decision="reschedule">按新时间确认</button>' : '') +
                 '<button class="btn primary" type="button" data-leave-respond="' + item.id + '" data-decision="cancel">' + (leave.type === 'reschedule' ? '直接取消课程' : '确认取消课程') + '</button>' +
                 '</span>';
        }
        const allow = YZB.leave.canRequest(item.id);
        if (allow.ok) return '<button class="btn plain" type="button" data-leave="' + item.id + '">请假</button>';
        return allow.reason ? '<span class="leave-tip">' + allow.reason + '</span>' : '';
      }
      if (item.status === 'attended') return '<a class="btn primary" href="课程反馈_页面还原.html?booking=' + item.id + '&course=' + (FEEDBACK_COURSE[item.courseId] || 'derivative-0809') + '">填写反馈</a>';
      if (item.status === 'done') return '<a class="btn ghost" href="课程详情_页面还原.html?role=teacher&booking=' + item.id + '&course=' + (FEEDBACK_COURSE[item.courseId] || 'derivative-0809') + '">查看课程</a>';
      return '';
    }

    function cardOf(item) {
      const learner = item.isPlan && item.status !== 'confirmed' ? item.grade + ' · 学员信息待家长确认' : item.student;
      const meta = item.isPlan
        ? '<div class="bk-meta"><span>' + learner + '</span><span>' + item.scheduleLabel + '</span><span>' + item.startDate + ' 至 ' + item.endDate + '</span><span>' + item.mode + ' · ' + item.place + '</span><span>' + (item.durationLabel || '1.5 小时/次') + ' · ' + YZB.lessonsOf(item) + '课时</span></div>'
        : '<div class="bk-meta"><span>' + item.student + '</span><span>' + item.dateLabel + ' ' + YZB.timeRangeText(item.time, item.endTime) + '</span><span>' + item.grade + ' · ' + item.subject + '</span><span>' + item.mode + ' · ' + item.place + '</span><span>' + (item.durationLabel || '60分钟') + ' · ' + YZB.lessonsOf(item) + '课时</span></div>';
      /* 待反馈：填写反馈按钮移到卡片右侧、与信息区同高 */
      const side = item.status === 'attended' ? '<div class="bk-side">' + actionsOf(item) + '</div>' : '';
      const foot = tipOf(item) + (side ? '' : actionsOf(item));
      /* 已完成：课程内容/反馈/作业只在课程详情展示，列表卡片不重复展示 */
      const month = (item.isPlan ? item.startDate : item.date || '').slice(0, 7);
      const cardLeave = item.leave && item.leave.status === 'pending' ? item.leave : null;
      const badgeText = cardLeave ? '请假待确认' : STATE_TEXT[item.status];
      const badgeClass = 'bk-state ' + item.status + (cardLeave ? ' leave' : '');
      return '<article class="card bk-card" data-status="' + item.status + '" data-month="' + month + '" data-mode="' + modeKey(item.mode) + '">' +
        '<div class="bk-head"><strong>' + item.courseName + '</strong><span class="' + badgeClass + '">' + badgeText + '</span></div>' +
        (side ? '<div class="bk-row">' + meta + side + '</div>' : meta) +
        (foot ? '<div class="bk-foot">' + foot + '</div>' : '') +
      '</article>';
    }

    function renderTabs() {
      tabs.innerHTML = TABS.map(tab => {
        const count = tab.key === 'all' ? 0 : recordsOf(tab).length;
        const badge = count ? '<b>' + count + '</b>' : '';
        const dot = tab.key === 'pending' && count ? '<span class="dot"></span>' : '';
        return '<button class="tab' + (tab.key === activeTab ? ' active' : '') + '" type="button" data-tab="' + tab.key + '">' + tab.label + badge + dot + '</button>';
      }).join('');
    }

    function renderRecords() {
      listBox.innerHTML = YZB.forTeacher(teacherId).slice().sort(orderOf).map(cardOf).join('');
    }

    /* 月份下拉按当前老师的演示数据生成，避免写死选项与数据不一致 */
    function fillFilters() {
      const months = [];
      YZB.forTeacher(teacherId).forEach(item => {
        const key = (item.date || '').slice(0, 7);
        if (key && months.indexOf(key) === -1) months.push(key);
      });
      months.sort().reverse();
      const current = monthSelect.value;
      monthSelect.innerHTML = '<option value="all">全部月份</option>' + months.map(key => '<option value="' + key + '">' + key.slice(0, 4) + '年' + Number(key.slice(5, 7)) + '月</option>').join('');
      monthSelect.value = months.indexOf(current) > -1 ? current : 'all';
    }

    function applyFilters() {
      const month = monthSelect.value;
      const mode = document.querySelector('.mode-option.active').dataset.mode;
      const tab = TABS.filter(item => item.key === activeTab)[0];
      let visibleCount = 0;
      document.querySelectorAll('.bk-card').forEach(card => {
        const visible = (activeTab === 'all' || card.dataset.status === activeTab) && (month === 'all' || card.dataset.month === month) && (mode === 'all' || card.dataset.mode === mode);
        card.hidden = !visible;
        if (visible) visibleCount += 1;
      });
      tabs.querySelectorAll('.tab').forEach(item => item.classList.toggle('active', item.dataset.tab === activeTab));
      const hasExtraFilter = month !== 'all' || mode !== 'all';
      const isAll = activeTab === 'all' && !hasExtraFilter;
      document.querySelector('#summaryLabel').textContent = isAll ? '累计授课' : (activeTab === 'all' ? '筛选结果' : tab.label);
      document.querySelector('#summaryValue').textContent = isAll ? taughtLessons() + '课时' : visibleCount + ' 节';
      emptyBox.hidden = visibleCount !== 0;
      emptyBox.textContent = activeTab === 'pending' ? '当前没有待确认的约课' : '暂无' + tab.label + '的授课记录';
    }

    function refresh() { renderTabs(); renderRecords(); fillFilters(); applyFilters(); }
    // 其它标签页改动数据后自动刷新（家长取消 / 确认等）
    addEventListener('storage', event => { if (!event.key || event.key.indexOf('yzb-booking') === 0) refresh(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

    function openSheet(id) {
      rejectTarget = id; rejectReason = ''; rejectConfirm.disabled = true;
      document.querySelector('#rejectNote').textContent = '将拒绝 ' + YZB.byId(id).student + ' 的约课申请，拒绝后家长可重新选择其他时间';
      reasonList.innerHTML = REASONS.map(reason => '<button class="reason" type="button" data-reason="' + reason + '">' + reason + '</button>').join('');
      sheet.classList.add('show'); sheetMask.classList.add('show');
    }
    function closeSheet() { sheet.classList.remove('show'); sheetMask.classList.remove('show'); rejectTarget = ''; }

    /* ===== 请假：待上课课次由家长/老师任一方发起，另一方确认 ===== */
    function weekTextOf(dateKey) {
      const date = new Date(dateKey + 'T00:00:00');
      return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][date.getDay()] || '';
    }
    function leaveTipText(leave) {
      const isMine = leave.by === VIEWER;
      const other = VIEWER === 'parent' ? '老师' : '家长';
      const plan = leave.type === 'reschedule'
        ? '申请调整到 ' + YZB.leave.labelOfDate(leave.newDate) + ' ' + weekTextOf(leave.newDate) + ' ' + leave.newTime
        : '申请取消本次排课';
      return (leave.by === 'parent' ? '家长请假' : '老师请假') + ' · ' + leave.reason + ' · ' + plan + ' · 等待' + (isMine ? other : '你') + '确认';
    }
    function leaveDaysOf() {
      if (!leaveTarget) return [];
      const item = YZB.byId(leaveTarget);
      return item ? YZB.leave.days(item).slice(0, 14) : [];
    }
    function updateLeaveSubmit() {
      leaveSubmit.disabled = !(leaveReason && (leaveType === 'cancel' || (leaveDate && leaveTime)));
    }
    function renderLeaveTimes(days) {
      const day = (days || leaveDaysOf()).filter(entry => entry.date === leaveDate)[0];
      const times = day ? day.times : [];
      if (times.indexOf(leaveTime) === -1) leaveTime = times[0] || '';
      leaveTimes.innerHTML = times.map(time => '<button class="leave-time' + (time === leaveTime ? ' active' : '') + '" type="button" data-leave-time="' + time + '">' + time + '</button>').join('');
      updateLeaveSubmit();
    }
    function renderLeaveDates() {
      const days = leaveDaysOf();
      if (!days.length) {
        leaveDate = ''; leaveTime = '';
        leaveDates.innerHTML = '<span class="leave-tip">近期没有可调整的开放时段，可直接选择「直接取消本次排课」</span>';
        leaveTimes.innerHTML = '';
        updateLeaveSubmit();
        return;
      }
      if (!leaveDate || !days.some(day => day.date === leaveDate)) { leaveDate = days[0].date; leaveTime = days[0].times[0]; }
      leaveDates.innerHTML = days.map(day => '<button class="leave-date' + (day.date === leaveDate ? ' active' : '') + '" type="button" data-leave-date="' + day.date + '">' + day.label + '<small>' + day.week + '</small></button>').join('');
      renderLeaveTimes(days);
    }
    function openLeaveSheet(id) {
      const item = YZB.byId(id);
      const check = YZB.leave.canRequest(id);
      if (!item || !check.ok) { showToast(check.reason || '当前无法发起请假'); return; }
      leaveTarget = id; leaveReason = ''; leaveType = 'reschedule'; leaveDate = ''; leaveTime = '';
      leaveNote.textContent = '本课次已冻结家长 ' + YZB.lessonsOf(item) + ' 课时：家长确认新时间即改期（课时继续冻结）；直接取消本次排课则归还课时';
      leaveNoteInput.value = '';
      leaveOrigin.textContent = '原上课时间：' + item.student + ' · ' + (item.dateLabel || YZB.leave.labelOfDate(item.date)) + ' ' + YZB.timeRangeText(item.time, item.endTime);
      leaveReasons.innerHTML = LEAVE_REASONS.map(reason => '<button class="reason" type="button" data-leave-reason="' + reason + '">' + reason + '</button>').join('');
      leaveTypeBox.querySelectorAll('[data-leave-type]').forEach(button => button.classList.toggle('active', button.dataset.leaveType === 'reschedule'));
      leaveSlot.hidden = false;
      renderLeaveDates();
      updateLeaveSubmit();
      leaveSheet.classList.add('show'); sheetMask.classList.add('show');
    }
    function closeLeaveSheet() { leaveSheet.classList.remove('show'); sheetMask.classList.remove('show'); leaveTarget = ''; }

    tabs.addEventListener('click', event => {
      const button = event.target.closest('[data-tab]');
      if (!button) return;
      activeTab = button.dataset.tab;
      applyFilters();
      try{const url=new URL(location.href);url.searchParams.set('filter',activeTab);history.replaceState(null,'',url)}catch{}
    });
    monthSelect.onchange = applyFilters;
    document.querySelectorAll('.mode-option').forEach(option => option.onclick = () => {
      document.querySelector('.mode-option.active').classList.remove('active');
      option.classList.add('active');
      applyFilters();
    });

    listBox.addEventListener('click', event => {
      const acceptPlanButton = event.target.closest('[data-accept-plan]');
      if (acceptPlanButton) {
        const accepted = YZB.acceptPlan(acceptPlanButton.dataset.acceptPlan, teacherId);
        if (!accepted) { showToast('该需求刚刚被其他老师接单'); refresh(); return; }
        if (accepted.orderMode === 'designated') {
          activeTab = 'confirmed';
          refresh();
          showToast('已确认接单，固定课表已生成');
          return;
        }
        refresh();
        showToast('接单成功，等待家长确认');
        return;
      }
      const confirmButton = event.target.closest('[data-confirm]');
      if (confirmButton) {
        YZB.confirm(confirmButton.dataset.confirm);
        activeTab = 'confirmed';
        refresh();
        showToast('已确认接单，家长课时进入冻结');
        return;
      }
      const rejectButton = event.target.closest('[data-reject]');
      if (rejectButton) { openSheet(rejectButton.dataset.reject); return; }
      const leaveButton = event.target.closest('[data-leave]');
      if (leaveButton) { openLeaveSheet(leaveButton.dataset.leave); return; }
      const withdrawButton = event.target.closest('[data-leave-withdraw]');
      if (withdrawButton) {
        const result = YZB.leave.withdraw(withdrawButton.dataset.leaveWithdraw);
        refresh();
        showToast(result.ok ? '已撤回请假申请' : (result.reason || '撤回失败'));
        return;
      }
      const respondButton = event.target.closest('[data-leave-respond]');
      if (respondButton) {
        const targetId = respondButton.dataset.leaveRespond;
        const decision = respondButton.dataset.decision;
        const target = YZB.byId(targetId);
        const lessons = target ? YZB.lessonsOf(target) : 0;
        const result = YZB.leave.respond(targetId, decision);
        if (!result.ok) { showToast(result.reason || '操作失败，请重试'); refresh(); return; }
        refresh();
        showToast(decision === 'cancel' ? '已取消本次排课，已归还 ' + lessons + ' 课时' : '已按新时间确认，课次已改期');
        return;
      }
    });

    reasonList.addEventListener('click', event => {
      const button = event.target.closest('[data-reason]');
      if (!button) return;
      rejectReason = button.dataset.reason;
      reasonList.querySelectorAll('.reason').forEach(item => item.classList.toggle('active', item === button));
      rejectConfirm.disabled = false;
    });
    document.querySelector('#rejectAbort').onclick = closeSheet;
    document.querySelector('#leaveAbort').onclick = closeLeaveSheet;
    sheetMask.onclick = () => { closeSheet(); closeLeaveSheet(); };
    leaveReasons.addEventListener('click', event => {
      const button = event.target.closest('[data-leave-reason]');
      if (!button) return;
      leaveReason = button.dataset.leaveReason;
      leaveReasons.querySelectorAll('.reason').forEach(item => item.classList.toggle('active', item === button));
      updateLeaveSubmit();
    });
    leaveTypeBox.addEventListener('click', event => {
      const button = event.target.closest('[data-leave-type]');
      if (!button) return;
      leaveType = button.dataset.leaveType;
      leaveTypeBox.querySelectorAll('[data-leave-type]').forEach(item => item.classList.toggle('active', item === button));
      leaveSlot.hidden = leaveType === 'cancel';
      updateLeaveSubmit();
    });
    leaveDates.addEventListener('click', event => {
      const button = event.target.closest('[data-leave-date]');
      if (!button) return;
      leaveDate = button.dataset.leaveDate;
      leaveDates.querySelectorAll('.leave-date').forEach(item => item.classList.toggle('active', item === button));
      renderLeaveTimes();
    });
    leaveTimes.addEventListener('click', event => {
      const button = event.target.closest('[data-leave-time]');
      if (!button) return;
      leaveTime = button.dataset.leaveTime;
      leaveTimes.querySelectorAll('.leave-time').forEach(item => item.classList.toggle('active', item === button));
      updateLeaveSubmit();
    });
    leaveSubmit.onclick = () => {
      if (!leaveTarget) return;
      const type = leaveType;
      const result = YZB.leave.request(leaveTarget, { by: VIEWER, type: type, reason: leaveReason, note: leaveNoteInput.value, newDate: leaveDate, newTime: leaveTime });
      if (!result.ok) { showToast(result.reason || '提交失败，请检查后重试'); return; }
      closeLeaveSheet();
      refresh();
      showToast(type === 'cancel' ? '请假已提交，等待家长确认取消' : '请假已提交，等待家长确认新时间');
    };
    rejectConfirm.onclick = () => {
      if (!rejectTarget || !rejectReason) return;
      YZB.reject(rejectTarget, rejectReason);
      closeSheet();
      refresh();
      showToast('已拒绝该约课，记录保留在累计授课');
    };

    refresh();
    function fit() { const scale = Math.min((innerWidth - 32) / 464, (innerHeight - 32) / 980, 1); document.documentElement.style.setProperty('--device-scale', Math.max(scale, .2)); }
    fit(); addEventListener('resize', fit, { passive: true });
  </script>
