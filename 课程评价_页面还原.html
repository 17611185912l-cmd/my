<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf4ff"><title>课程评价</title>
  <style>
    :root{--device-scale:1;--blue:#4b7fb8;--ink:#24262b;--muted:#777a82;--line:#e5ebf2}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100svh;padding:16px;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:#e7eaee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{padding:0;border:0;color:inherit;background:none;cursor:pointer}.phone-shell{position:relative;isolation:isolate;width:464px;height:980px;padding:11px;border:1px solid #777d84;border-radius:66px;background:linear-gradient(135deg,#bfc3c7,#f4f5f6 20%,#8d9298 49%,#d9dcdf 72%,#73787e);box-shadow:0 34px 70px rgba(32,38,45,.28),inset 0 0 0 3px rgba(33,36,40,.68);transform:scale(var(--device-scale));transform-origin:center}.dynamic-island{position:absolute;z-index:30;top:22px;left:50%;width:126px;height:34px;transform:translateX(-50%);border-radius:20px;background:#050505;pointer-events:none}.dynamic-island:after{content:"";position:absolute;right:12px;top:11px;width:8px;height:8px;border-radius:50%;background:#111a25}.app{position:relative;width:440px;height:956px;overflow:hidden;border-radius:54px;background:#f5f4f6;box-shadow:inset 0 0 0 1px rgba(0,0,0,.52)}.page{height:100%;overflow-y:auto;scrollbar-width:none;background:linear-gradient(to bottom,rgba(245,244,246,0) 150px,#f5f4f6 220px),linear-gradient(105deg,transparent 16%,rgba(255,255,255,.46) 36%,transparent 55%),linear-gradient(132deg,#f7faff,#edf4ff 48%,#dceafa)}.page::-webkit-scrollbar{display:none}header{position:sticky;z-index:10;top:0;color:#294966;background:linear-gradient(105deg,transparent 16%,rgba(255,255,255,.46) 36%,transparent 55%),linear-gradient(132deg,#f7faff,#edf4ff 48%,#dceafa)}.statusbar{height:36px;padding:17px 36px 0;display:flex;align-items:flex-start;justify-content:space-between;color:#050505;font-size:15px;line-height:1;font-weight:700}.device-status{display:flex;align-items:center;gap:8px}.signal{width:18px;height:12px;display:flex;align-items:flex-end;gap:2px}.signal i{width:3px;border-radius:2px 2px 0 0;background:#050505}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal i:nth-child(4){height:12px}.wifi{position:relative;width:18px;height:13px;overflow:hidden}.wifi:before,.wifi:after{content:"";position:absolute;left:50%;border:2px solid #050505;border-color:#050505 transparent transparent;border-radius:50%;transform:translateX(-50%)}.wifi:before{top:0;width:19px;height:17px}.wifi:after{top:5px;width:10px;height:9px}.wifi i{position:absolute;left:8px;bottom:0;width:3px;height:3px;border-radius:50%;background:#050505}.battery{position:relative;width:23px;height:11px;padding:2px;border:1.5px solid #919191;border-radius:3px}.battery:before{content:"";display:block;width:100%;height:100%;background:#050505}.battery:after{content:"";position:absolute;top:3px;right:-3px;width:2px;height:5px;background:#b4b4b4}.titlebar{position:relative;height:57px;display:flex;align-items:center}.titlebar h1{width:100%;margin:0;font-size:18px;line-height:26px;font-weight:600;text-align:center}.back{position:absolute;z-index:4;left:20px;top:8px;width:40px;height:40px}.back:before{content:"";position:absolute;left:12px;top:13px;width:10px;height:10px;border:solid #294966;border-width:0 0 2px 2px;transform:rotate(45deg)}.capsule{position:absolute;right:17px;top:13px;width:84px;height:30px;border:1px solid rgba(61,105,151,.18);border-radius:16px;display:grid;grid-template-columns:1fr 1fr;align-items:center;background:rgba(255,255,255,.9)}.dots{height:100%;display:flex;align-items:center;justify-content:center;gap:3px}.dots i{width:4px;height:4px;border-radius:50%;background:#15171b}.ring{position:relative;width:15px;height:15px;margin:auto;border:1.8px solid #111318;border-radius:50%}.ring:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#111318}.content{padding:8px 12px 112px}.card{margin-bottom:8px;padding:14px;border-radius:8px;background:#fff}.course h2{margin:0;font-size:16px;line-height:23px}.course p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:22px}.section-title{margin:0 0 14px;font-size:16px;line-height:24px}.score{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.score button{height:42px;border:1px solid #d8e1eb;border-radius:5px;color:#5e6570;background:#fff;font-size:15px}.score button.active{border-color:var(--blue);color:#fff;background:var(--blue)}.score-note{display:block;margin-top:8px;color:var(--muted);font-size:14px;text-align:center}.label{display:block;margin:18px 0 8px;font-size:14px;font-weight:600}.review-text{width:100%;min-height:180px;padding:11px;border:1px solid #d8e1eb;border-radius:5px;outline:none;resize:none;color:var(--ink);background:#fff;font-size:14px;line-height:22px}.review-text:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(75,127,184,.1)}.count{display:block;margin-top:6px;color:#99969a;font-size:14px;text-align:right}.submit{position:absolute;z-index:20;left:16px;right:16px;bottom:26px;height:46px;border-radius:6px;color:#fff;background:var(--blue);font-size:16px;font-weight:600}.toast{position:absolute;z-index:30;left:50%;bottom:90px;padding:9px 14px;border-radius:5px;color:#fff;background:rgba(27,28,31,.88);font-size:14px;white-space:nowrap;transform:translate(-50%,10px);opacity:0;transition:.2s}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:520px){body{padding:0;background:#f5f4f6}.phone-shell{border-color:transparent;box-shadow:none}}
  </style>
</head>
<body><main class="phone-shell" aria-label="课程评价页面"><div class="dynamic-island" aria-hidden="true"></div><div class="app"><div class="page"><header><div class="statusbar"><span>23:58</span><div class="device-status"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"><i></i></span><span class="battery"></span></div></div><div class="titlebar"><button class="back" type="button" aria-label="返回上课记录"></button><h1>课程评价</h1><div class="capsule" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="ring"></span></div></div></header><div class="content">
  <section class="card course"><h2 class="course-name">高一数学·三角函数</h2><p class="course-primary">张三老师·8月8日 16:00</p><p class="course-secondary">人教A版·陕西省·60分钟·优坐标西安中心</p></section>
  <section class="card"><h2 class="section-title">评价课程</h2><span class="label">课程评分（1-5分）</span><div class="score" aria-label="课程评分"><button type="button" data-score="1">1</button><button type="button" data-score="2">2</button><button type="button" data-score="3">3</button><button type="button" data-score="4">4</button><button type="button" data-score="5">5</button></div><span class="score-note">请选择课程评分</span><label class="label" for="reviewText">课程评价</label><textarea class="review-text" id="reviewText" maxlength="300" placeholder="请分享对课程内容、老师授课和学习效果的感受"></textarea><span class="count">0/300</span></section>
  </div></div><button class="submit" type="button">提交评价</button><div class="toast">评价已提交</div></div></main>
  <script>
    const courses={trigonometry:{name:'高一数学·三角函数',primary:'张三老师·8月8日 16:00',secondary:'人教A版·陕西省·60分钟·优坐标西安中心'},function:{name:'高一数学·函数基础',primary:'王静老师·8月3日 14:00',secondary:'人教A版·陕西省·60分钟·优坐标云课堂'}};
    const course=courses[new URLSearchParams(location.search).get('course')]||courses.trigonometry;
    document.querySelector('.course-name').textContent=course.name;document.querySelector('.course-primary').textContent=course.primary;document.querySelector('.course-secondary').textContent=course.secondary;
    let selectedScore=0;
    document.querySelectorAll('.score button').forEach(button=>button.onclick=()=>{selectedScore=Number(button.dataset.score);document.querySelectorAll('.score button').forEach(item=>item.classList.toggle('active',Number(item.dataset.score)<=selectedScore));document.querySelector('.score-note').textContent=`已选择 ${selectedScore} 分`});
    const reviewText=document.querySelector('#reviewText');reviewText.oninput=()=>document.querySelector('.count').textContent=`${reviewText.value.length}/300`;
    document.querySelector('.back').onclick=()=>location.href='上课记录_页面还原.html?filter=review';
    document.querySelector('.submit').onclick=()=>{const toast=document.querySelector('.toast');if(!selectedScore){toast.textContent='请选择课程评分'}else if(!reviewText.value.trim()){toast.textContent='请填写课程评价'}else{toast.textContent='评价已提交'}toast.classList.add('show');if(!selectedScore||!reviewText.value.trim()){setTimeout(()=>toast.classList.remove('show'),1300);return}setTimeout(()=>location.href='上课记录_页面还原.html?filter=review',900)};
    function fit(){const scale=Math.min((innerWidth-32)/464,(innerHeight-32)/980,1);document.documentElement.style.setProperty('--device-scale',Math.max(scale,.2))}fit();addEventListener('resize',fit,{passive:true});
  </script>
</body></html>
