<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f6">
  <title>教师端 · 授课中心</title>
  <style>
    :root { --device-scale: 1; --ink: #24262b; --muted: #777a82; --line: #e5ebf2; --blue: #3f72ad; --paper: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100svh; padding: 16px; display: grid; place-items: center; overflow: hidden; color: var(--ink); background: #e7eaee; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    button, a { padding: 0; border: 0; color: inherit; font: inherit; background: none; text-decoration: none; }
    button, a { cursor: pointer; }
    .phone-shell { position: relative; isolation: isolate; width: 464px; height: 980px; padding: 11px; border: 1px solid #777d84; border-radius: 66px; background: linear-gradient(135deg,#bfc3c7 0%,#f4f5f6 20%,#8d9298 49%,#d9dcdf 72%,#73787e 100%); box-shadow: 0 34px 70px rgba(32,38,45,.28),0 10px 22px rgba(32,38,45,.18),inset 0 0 0 1px rgba(255,255,255,.75),inset 0 0 0 3px rgba(33,36,40,.68); transform: scale(var(--device-scale)); transform-origin: center; }
    .dynamic-island { position: absolute; z-index: 30; top: 22px; left: 50%; width: 126px; height: 34px; transform: translateX(-50%); border-radius: 20px; background: #050505; pointer-events: none; }
    .dynamic-island::after { content: ""; position: absolute; right: 12px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: #111a25; box-shadow: inset 0 0 0 2px #080b10,0 0 2px #1a4d79; }
    .app { position: relative; width: 440px; height: 956px; overflow: hidden; border-radius: 54px; background: #f5f4f6; box-shadow: inset 0 0 0 1px rgba(0,0,0,.52); }
    .page { width: 100%; height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; background: linear-gradient(to bottom,rgba(245,244,246,0) 188px,#f5f4f6 250px),linear-gradient(105deg,transparent 16%,rgba(255,255,255,.46) 36%,transparent 55%),linear-gradient(132deg,#f7faff 0%,#edf4ff 48%,#dceafa 100%); }
    .page::-webkit-scrollbar { display: none; }
    header { position: sticky; z-index: 10; top: 0; color: #294966; background: linear-gradient(105deg,transparent 16%,rgba(255,255,255,.46) 36%,transparent 55%),linear-gradient(132deg,#f7faff 0%,#edf4ff 48%,#dceafa 100%); }
    .statusbar { height: 36px; padding: 17px 36px 0; display: flex; align-items: flex-start; justify-content: space-between; color: #050505; font-size: 15px; line-height: 1; font-weight: 700; }
    .device-status { display: flex; align-items: center; gap: 8px; }
    .signal { width: 18px; height: 12px; display: flex; align-items: flex-end; gap: 2px; }
    .signal i { width: 3px; border-radius: 2px 2px 0 0; background: #050505; }
    .signal i:nth-child(1) { height: 4px; } .signal i:nth-child(2) { height: 7px; } .signal i:nth-child(3) { height: 10px; } .signal i:nth-child(4) { height: 12px; }
    .wifi { position: relative; width: 18px; height: 13px; overflow: hidden; }
    .wifi::before,.wifi::after { content: ""; position: absolute; left: 50%; border: 2px solid #050505; border-color: #050505 transparent transparent; border-radius: 50%; transform: translateX(-50%); }
    .wifi::before { top: 0; width: 19px; height: 17px; } .wifi::after { top: 5px; width: 10px; height: 9px; }
    .wifi i { position: absolute; left: 8px; bottom: 0; width: 3px; height: 3px; border-radius: 50%; background: #050505; }
    .battery { position: relative; width: 23px; height: 11px; padding: 2px; border: 1.5px solid #919191; border-radius: 3px; }
    .battery::before { content: ""; display: block; width: 100%; height: 100%; border-radius: 1px; background: #050505; }
    .battery::after { content: ""; position: absolute; top: 3px; right: -3px; width: 2px; height: 5px; border-radius: 0 2px 2px 0; background: #b4b4b4; }
    .titlebar { position: relative; height: 57px; display: flex; align-items: center; padding: 0 12px; }
    .titlebar h1 { width: 100%; margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; text-align: center; }
    .back-button { position: absolute; z-index: 4; left: 20px; top: 8px; width: 40px; height: 40px; }
    .back-button::before { content: ""; position: absolute; left: 12px; top: 13px; width: 10px; height: 10px; border: solid #294966; border-width: 0 0 2px 2px; transform: rotate(45deg); }
    .capsule { position: absolute; z-index: 3; right: 17px; top: 13px; width: 84px; height: 30px; border: 1px solid rgba(61,105,151,.18); border-radius: 16px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; background: rgba(255,255,255,.9); }
    .dots { height: 100%; display: flex; align-items: center; justify-content: center; gap: 3px; }
    .dots i { width: 4px; height: 4px; border-radius: 50%; background: #15171b; }
    .mini-ring { position: relative; width: 15px; height: 15px; margin: auto; border: 1.8px solid #111318; border-radius: 50%; }
    .mini-ring::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #111318; }
    .content { padding: 8px 12px 30px; }
    .card { border-radius: 8px; background: var(--paper); box-shadow: 0 2px 10px rgba(47,75,106,.05); }
    .profile-entry { min-height: 78px; padding: 12px 14px; display: flex; align-items: center; }
    .teacher-avatar { width: 50px; height: 50px; object-fit: cover; border-radius: 50%; background: #eee; }
    .profile-copy { min-width: 0; margin-left: 11px; }
    .teacher-title { display: flex; align-items: center; gap: 7px; }
    .profile-copy strong { display: block; font-size: 16px; line-height: 23px; }
    .profile-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 14px; line-height: 20px; }
    .profile-copy .teacher-title { margin-top: 0; display: flex; align-items: center; gap: 7px; color: inherit; }
    .profile-copy .review-status { margin-top: 0; padding: 2px 6px; border-radius: 4px; font-size: 14px; line-height: 19px; white-space: nowrap; }
    .review-status[data-state="approved"] { color: #34705a; background: #eaf7f1; }
    .review-status[data-state="pending"] { color: #9d5d13; background: #fff4df; }
    .review-status[data-state="rejected"] { color: #9d4a41; background: #fff0ee; }
    .entry-label { margin-left: auto; color: var(--blue); font-size: 14px; white-space: nowrap; }
    .chevron { width: 8px; height: 8px; margin-left: 9px; border: solid #a9a3a0; border-width: 1px 1px 0 0; transform: rotate(45deg); }
    .teacher-shortcuts { margin-top: 8px; display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .teacher-shortcut { min-width: 0; height: 62px; padding: 0 11px; display: grid; grid-template-columns: 34px minmax(0,1fr) 7px; align-items: center; gap: 8px; border: 1px solid #e1eaf4; transition: border-color .16s ease,background .16s ease,transform .12s ease; }
    .teacher-shortcut:hover { border-color: #b9cee4; background: #f9fbfe; }
    .teacher-shortcut:focus-visible { outline: 2px solid rgba(63,114,173,.38); outline-offset: 2px; }
    .teacher-shortcut:active { transform: scale(.98); }
    .shortcut-icon { position: relative; width: 34px; height: 34px; border-radius: 9px; color: #3f72ad; background: #edf4ff; }
    .shortcut-icon::before,.shortcut-icon::after { content: ""; position: absolute; }
    .shortcut-icon.recruit::before { left: 9px; top: 7px; width: 8px; height: 8px; border: 2px solid currentColor; border-radius: 50%; }
    .shortcut-icon.recruit::after { left: 6px; bottom: 6px; width: 15px; height: 8px; border: 2px solid currentColor; border-bottom: 0; border-radius: 9px 9px 0 0; box-shadow: 9px -6px 0 -4px #edf4ff,10px -6px 0 -2px currentColor; }
    .shortcut-icon.manage::before { left: 8px; top: 8px; width: 16px; height: 17px; border: 2px solid currentColor; border-radius: 3px; }
    .shortcut-icon.manage::after { left: 12px; top: 13px; width: 8px; height: 2px; background: currentColor; box-shadow: 0 5px 0 currentColor; }
    .shortcut-label { overflow: hidden; font-size: 15px; line-height: 22px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .shortcut-arrow { width: 7px; height: 7px; border: solid #8fa4b9; border-width: 1px 1px 0 0; transform: rotate(45deg); }
    .section { margin-top: 8px; padding: 14px; }
    .section-title { margin: 0; font-size: 16px; line-height: 24px; font-weight: 650; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; }
    .month-total { color: #356da9; font-size: 14px; line-height: 22px; }
    .stats { margin-top: 12px; display: grid; grid-template-columns: repeat(3,1fr); }
    .teaching-data { padding: 10px 14px; }
    .teaching-data .stats { margin-top: 0; }
    .stat { position: relative; min-width: 0; text-align: center; }
    .stat + .stat::before { content: ""; position: absolute; left: 0; top: 5px; width: 1px; height: 43px; background: var(--line); }
    .stat strong { display: block; color: #356da9; font-size: 24px; line-height: 28px; font-weight: 650; }
    .stat span { display: block; margin-top: 4px; color: #666a72; font-size: 14px; line-height: 20px; }
    .calendar-head { margin-top: 11px; display: flex; align-items: center; justify-content: space-between; }
    .month-switch { width: 32px; height: 32px; border-radius: 50%; color: #547492; font-size: 20px; }
    .month-label { font-size: 15px; font-weight: 600; }
    .month-center { display: flex; align-items: center; }
    .calendar-toggle { min-width: 88px; height: 30px; margin: 5px auto 0; display: block; color: #356da9; font-size: 14px; line-height: 30px; }
    .week,.days { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; }
    .week { margin-top: 8px; color: #99969a; font-size: 14px; line-height: 24px; }
    .day { position: relative; width: 36px; height: 36px; justify-self: center; display: grid; place-items: center; border-radius: 50%; color: #4e5158; font-size: 14px; }
    .day[hidden] { display: none; }
    .day.muted { color: #c9c6c8; }
    .day.has-course::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #5b8fc6; }
    .day.selected { color: #fff; background: #4b7fb8; }
    .day.selected::after { background: #fff; }
    .course-head { display: flex; align-items: center; justify-content: space-between; }
    .course-date { color: var(--muted); font-size: 14px; }
    .course-list { margin-top: 10px; }
    .course { padding: 12px 0; cursor: pointer; }
    .course:focus-visible { outline: 2px solid rgba(75,127,184,.38); outline-offset: 3px; border-radius: 5px; }
    .course + .course { border-top: 1px solid var(--line); }
    .course-top { display: flex; align-items: flex-start; }
    .course-top strong { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; line-height: 22px; }
    .course-meta { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; color: var(--muted); font-size: 14px; line-height: 20px; }
    .status { order: 3; margin-left: 5px; padding: 3px 7px; border-radius: 4px; color: #356da9; background: #edf4ff; font-size: 14px; white-space: nowrap; }
    .course-top::after { order: 2; margin-left: 5px; padding: 3px 7px; border-radius: 4px; color: #5e6c7b; background: #f0f3f6; font-size: 14px; line-height: 20px; white-space: nowrap; }
    .course[data-mode="online"] .course-top::after { content: "线上"; }
    .course[data-mode="offline"] .course-top::after { content: "线下"; }
    .course[data-mode="home"] .course-top::after { content: "上门"; }
    .course { padding:9px 0; }
    .course-meta { margin-top:5px; display:flex; flex-wrap:wrap; align-items:center; gap:3px 14px; line-height:19px; }
    .course-meta span:nth-child(3) { order:1; flex:0 0 100%; color:#596674; }
    .course-meta span:nth-child(1) { order:2; }
    .course-meta span:nth-child(2) { order:3; }
    .course-meta span:nth-child(4) { order:4; }
    .course-meta span:nth-child(5) { order:5; flex:0 0 100%; }
    .empty { padding: 20px 0 12px; color: #99969a; font-size: 14px; text-align: center; }
    .review-simulator { position: fixed; z-index: 40; left: calc(50% - 366px); top: calc(50% - 455px); min-width: 96px; height: 38px; padding: 0 14px; border: 1px solid #d9e5f2; border-radius: 8px; color: #356da9; background: rgba(255,255,255,.96); box-shadow: 0 6px 18px rgba(47,75,106,.12); font-size: 14px; font-weight: 600; }
    .review-simulator:hover { border-color: #9dbadb; background: #f7faff; }
    .review-simulator[data-active="true"] { border-color: #efc8c3; color: #a64d43; background: #fff4f2; }
    .dev-note { position: fixed; z-index: 35; left: calc(50% + 250px); top: calc(50% - 455px); width: 250px; padding: 14px 15px; border: 1px solid #d9e5f2; border-radius: 10px; color: #52677c; background: rgba(255,255,255,.96); box-shadow: 0 8px 22px rgba(47,75,106,.12); font-size: 12px; line-height: 19px; }
    .dev-note strong { display: block; margin-bottom: 5px; color: #294966; font-size: 13px; }
    .dev-note p { margin: 0; }
    @media (max-width: 900px) { .dev-note { display: none; } }
    @media (max-width: 760px) { .review-simulator { left: 12px; top: 12px; min-width: 82px; height: 34px; padding: 0 10px; font-size: 13px; } }
    @media (max-width: 520px) { body { padding: 0; background: #f5f4f6; } .phone-shell { border-color: transparent; box-shadow: none; } .review-simulator { display: none; } }
  </style>
</head>
<body>

  <aside class="dev-note" aria-label="开发说明"><strong>开发说明 · 授课中心</strong><p id="devNoteText">当前页展示教员信息、教师工作入口、教学数据、排课日历和已排课程。点击入口进入对应预留页面。</p></aside>

          <div class="titlebar"><button class="back-button" type="button" aria-label="返回个人中心"></button><h1>教师端 · 授课中心</h1><div class="capsule" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="mini-ring"></span></div></div>

  <script>
    const page = document.querySelector('.page');
    const reviewStates = { approved: '审核通过', pending: '待审核', rejected: '已驳回' };
    const reviewStatus = document.querySelector('#reviewStatus');
    const profileEntry = document.querySelector('.profile-entry');
    const reviewSimulator = document.querySelector('#reviewSimulator');
    function applyReviewState(state) {
      const reviewState = reviewStates[state] ? state : 'approved';
      reviewStatus.dataset.state = reviewState;
      reviewStatus.textContent = reviewStates[reviewState];
      profileEntry.href = reviewState === 'rejected' ? '教员资料编辑_页面还原.html?review=rejected' : '教员资料编辑_页面还原.html';
      reviewSimulator.dataset.active = String(reviewState === 'rejected');
      reviewSimulator.textContent = reviewState === 'rejected' ? '恢复通过' : '模拟驳回';
    }
    const requestedReviewState = new URLSearchParams(location.search).get('review');
    applyReviewState(requestedReviewState);
    reviewSimulator.addEventListener('click', () => {
      const nextState = reviewStatus.dataset.state === 'rejected' ? 'approved' : 'rejected';
      const nextUrl = new URL(location.href);
      if (nextState === 'rejected') nextUrl.searchParams.set('review', 'rejected');
      else nextUrl.searchParams.delete('review');
      history.replaceState(null, '', nextUrl);
      applyReviewState(nextState);
    });
    const calendarDays = document.querySelector('.days');
    const calendarToggle = document.querySelector('.calendar-toggle');
    let calendarExpanded = false;
    function updateCalendarView() {
      const days = [...calendarDays.querySelectorAll('.day')];
      const selectedIndex = Math.max(0, days.findIndex(day => day.classList.contains('selected')));
      const selectedRow = Math.floor(selectedIndex / 7);
      days.forEach((day, index) => { day.hidden = !calendarExpanded && Math.floor(index / 7) !== selectedRow; });
      calendarToggle.setAttribute('aria-expanded', String(calendarExpanded));
      calendarToggle.textContent = calendarExpanded ? '收起本周' : '查看当月';
      calendarToggle.setAttribute('aria-label', calendarExpanded ? '收起本周' : '查看当月');
    }
    calendarToggle.addEventListener('click', () => { calendarExpanded = !calendarExpanded; updateCalendarView(); });
    document.querySelector('.back-button').addEventListener('click', () => { window.location.href = '个人中心_页面还原.html'; });
    document.querySelectorAll('.day:not(.muted)').forEach(day => day.addEventListener('click', () => {
      document.querySelector('.day.selected')?.classList.remove('selected');
      day.classList.add('selected');
      updateCalendarView();
      document.querySelector('.course-date').textContent = day.dataset.date || `8月${day.textContent}日`;
      const courseDate = day.dataset.date || `8月${day.textContent}日`;
      document.querySelector('.course-list').innerHTML = day.classList.contains('has-course') ? `<article class="course" role="link" tabindex="0" data-mode="${day.textContent === '10' ? 'offline' : 'online'}" data-detail="${day.textContent === '10' ? 'function-0810' : 'tutorial'}"><div class="course-top"><strong>高中数学·专题辅导</strong><span class="status">待上课</span></div><div class="course-meta"><span>王子涵</span><span>${courseDate} ${day.textContent === '10' ? '10:00' : '19:00'}</span><span>陕西省·人教A版</span><span>60分钟</span><span>${day.textContent === '10' ? '西安小寨校区' : '西安小寨交付中心'}</span></div></article>` : '<div class="empty">当日暂无排课</div>';
    }));
    document.querySelector('.course-list').addEventListener('click', event => { const course = event.target.closest('.course[data-detail]'); if (course) location.href = `课程详情_页面还原.html?role=teacher&course=${course.dataset.detail}`; });
    document.querySelector('.course-list').addEventListener('keydown', event => { const course = event.target.closest('.course[data-detail]'); if (course && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); course.click(); } });
    document.querySelectorAll('.month-switch').forEach(button => button.addEventListener('click', () => {
      const nextMonth = button.dataset.step === '1';
      document.querySelector('.month-label').textContent = nextMonth ? '2026年9月' : '2026年7月';
      document.querySelector('.month-total').textContent = nextMonth ? '9月已排 8课时' : '7月已排 10课时';
    }));
    updateCalendarView();
    function fitFrame() { const scale = Math.min((innerWidth - 32) / 464,(innerHeight - 32) / 980,1); document.documentElement.style.setProperty('--device-scale',Math.max(scale,.2)); }
    fitFrame(); addEventListener('resize',fitFrame,{ passive:true });
  </script>
