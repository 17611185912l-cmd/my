<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8ecff">
<title>个人中心 v3.0</title>
<style>
:root { --page:#f6f7f9; --ink:#333; --muted:#999; --blue:#1e59ff; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body { height:100svh; padding:16px; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:#e7eaee; font:14px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; }
button,a { -webkit-tap-highlight-color:transparent; }
button { margin:0; padding:0; border:0; font:inherit; color:inherit; background:none; cursor:pointer; }
a { color:inherit; text-decoration:none; }
img { display:block; }
button:focus-visible,a:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
.phone-shell { position:relative; width:399px; height:878px; padding:11px; border:1px solid #777d84; border-radius:54px; background:linear-gradient(135deg,#bfc3c7,#f4f5f6 20%,#8d9298 49%,#d9dcdf 72%,#73787e); box-shadow:0 24px 60px #20262d35,inset 0 0 0 3px #212428aa; transform:scale(var(--device-scale,1)); }
.app { position:relative; width:375px; height:854px; overflow:hidden; border-radius:43px; background:var(--page); }
.page { height:100%; padding-bottom:90px; overflow:auto; scrollbar-width:none; overscroll-behavior:contain; }
.page::-webkit-scrollbar { display:none; }
.header { position:relative; height:192px; background:url('assets/personal-center-20261103/header.svg') center top/100% 192px no-repeat; }
.statusbar { height:44px; }
.statusbar img { width:100%; height:44px; }
.titlebar { position:relative; height:44px; display:flex; align-items:center; justify-content:center; }
.titlebar h1 { margin:0; color:#172b3a; font-size:18px; line-height:25px; font-weight:600; }
.capsule { position:absolute; width:85px; height:30px; right:12px; top:7px; display:flex; background:url('assets/personal-center-20261103/capsule.svg') center/contain no-repeat; }
.capsule button { flex:1; }
.profile { position:relative; height:104px; }
.avatar-wrap { position:absolute; left:13px; top:8px; width:80px; height:80px; border:1px solid #e9e9eb; border-radius:50%; overflow:hidden; background:#f1f3f3; }
.profile-avatar { width:100%; height:100%; object-fit:cover; }
.profile-copy { position:absolute; left:109px; top:23px; }
.name-row { display:flex; align-items:center; gap:4px; height:20px; }
.name-row strong { max-width:145px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:18px; line-height:24px; font-weight:600; }
.role-tag { flex-shrink:0; padding:1px 4px; border-radius:2px; background:#30c593; color:#fff; font-size:10px; line-height:16px; }
.invite-trigger { display:flex; align-items:center; gap:10px; width:123px; height:27px; margin-top:6px; padding:0 11px; border:1px solid #e9e9eb; border-radius:14px; background:#f5f7ff; font-size:12px; white-space:nowrap; }
.invite-trigger .qr { width:13px; height:13px; margin-left:auto; }
.invite-trigger .chevron { width:6px; height:11px; }
.settings-trigger { position:absolute; right:18px; top:33px; width:24px; height:30px; }
.settings-trigger img { width:24px; height:24px; }
.card { background:#fff; border-radius:8px; }
.earnings { height:149px; margin:12px 11px 0 13px; padding:12px 11px; }
.earnings-top { display:flex; justify-content:space-between; height:58px; border-bottom:1px solid #e5e7eb; }
.earnings-label { margin:0 0 2px; color:#666; font-size:13px; line-height:18px; font-weight:400; }
.earnings-value { color:#fa6504; font-family:Arial,sans-serif; font-size:20px; line-height:26px; font-weight:700; }
.channel-entry { display:flex; align-items:center; align-self:flex-start; gap:8px; padding-top:8px; color:#999; font-size:14px; line-height:20px; }
.channel-entry img { width:7px; height:14px; }
.member-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding-top:11px; }
.member-stat { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; height:56px; border-radius:4px; background:#f4f4f5; font-size:13px; line-height:18px; }
.member-stat strong { font-size:16px; line-height:22px; font-weight:500; }
.center-shortcuts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:12px 11px 0 12px; }
.center-card { position:relative; display:flex; align-items:center; gap:18px; height:65px; padding:8px; border-radius:8px; background:#fff; }
.center-icon { flex-shrink:0; width:50px; height:42px; }
.center-copy { min-width:0; display:flex; flex-direction:column; gap:4px; }
.center-title { display:flex; align-items:center; white-space:nowrap; font-size:15px; line-height:21px; font-weight:600; }
.center-desc { color:#999; font-size:13px; line-height:18px; white-space:nowrap; }
.notif-badge { position:absolute; top:7px; right:7px; width:6px; height:6px; border-radius:50%; background:#e5484d; }
.notif-badge[hidden] { display:none; }
.service-list { margin:12px 12px 0; overflow:hidden; border-radius:8px; }
.service-row { position:relative; display:flex; align-items:center; gap:16px; width:100%; height:54px; padding:0 12px; background:#fff; text-align:left; font-size:15px; }
.service-row + .service-row::before { content:""; position:absolute; left:45px; right:0; top:0; height:1px; background:#e9e9eb; }
.service-row > img { flex-shrink:0; width:22px; height:24px; }
.service-row .row-arrow { margin-left:auto; width:7px; height:14px; }
.tabbar { position:absolute; z-index:20; bottom:0; left:0; width:100%; height:78px; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); padding:0 20px 34px; background:#fff; }
.tab { display:flex; flex-direction:column; align-items:center; gap:2px; height:44px; color:#999; font-size:10px; line-height:14px; padding-top:3px; }
.tab img { width:25px; height:24px; }
.tab .active-art { display:none; }
.tab.active { color:#1e59ff; }
.tab.active .active-art { display:block; }
.tab.active .muted-art { display:none; }
.home-indicator { position:absolute; z-index:21; bottom:15px; left:50%; transform:translateX(-50%); width:145px; height:5px; border-radius:3px; background:#000; pointer-events:none; }
.toast { position:absolute; z-index:60; left:50%; bottom:98px; transform:translateX(-50%); padding:9px 15px; max-width:290px; border-radius:6px; color:#fff; background:#14161bdf; font-size:13px; opacity:0; pointer-events:none; transition:opacity .15s; }
.toast.show { opacity:1; }
.modal { position:absolute; z-index:50; inset:0; display:grid; place-items:center; padding:24px; background:#181d2480; }
.modal[hidden] { display:none; }
.modal-panel { position:relative; width:100%; padding:24px 20px 20px; border-radius:12px; background:#fff; text-align:center; box-shadow:0 18px 42px #181d2433; }
.modal-panel h2 { margin:0 0 12px; font-size:18px; line-height:26px; }
.modal-close { position:absolute; top:10px; right:12px; width:28px; height:28px; font-size:24px; line-height:28px; color:#777; }
.invite-qr { width:220px; height:220px; max-width:100%; margin:12px auto; object-fit:contain; }
.invite-note { margin:0; color:#737985; font-size:12px; }
.invite-save { display:block; height:44px; margin-top:18px; border-radius:6px; color:#fff; background:#1e59ff; line-height:44px; font-size:15px; }
.settings-panel .service-row { height:48px; padding:0; font-size:14px; }
.logout-action { width:100%; height:44px; margin-top:14px; border-radius:6px; color:#df4b4b; background:#fff4f4; font-size:14px; }
.clickable:active { opacity:.65; }
@media(max-width:520px) {
 body { display:block; padding:0; background:var(--page); }
 .phone-shell { width:100%; height:100svh; padding:0; border:0; border-radius:0; background:none; box-shadow:none; transform:none; }
 .app { width:100%; height:100svh; border-radius:0; }
 .header { background-size:100% 192px; }
 .titlebar h1 { font-size:18px; }
}
@media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
</style>
</head>
<body>

<main class="app" aria-label="个人中心">
<div class="page">
<header class="header">
<div class="statusbar" aria-label="手机状态"><img src="assets/personal-center-20261103/status.svg" alt="23:58"></div>

</div>

<script>

try { const saved=JSON.parse(window.name||'{}'); if(saved.scope==='youzuobiao-profile') { if(saved.name)document.querySelector('.name-row strong').textContent=saved.name; if(saved.avatar)document.querySelector('.profile-avatar').src=saved.avatar; } } catch {}
const toast=document.querySelector('.toast'), inviteModal=document.querySelector('.invite-modal'), settingsModal=document.querySelector('.settings-modal');
let toastTimer,previousFocus;
function showToast(message){ toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1500); }
function openModal(modal){previousFocus=document.activeElement;modal.hidden=false;modal.querySelector('button').focus();}
function closeModal(modal){modal.hidden=true;previousFocus?.focus();}
document.addEventListener('click',event=>{
 if(event.target.closest('a[href="个人资料_页面还原.html"]'))window.name=JSON.stringify({scope:'youzuobiao-profile',name:document.querySelector('.name-row strong').textContent,avatar:document.querySelector('.profile-avatar').src});
 const action=event.target.closest('[data-action]');
 if(action?.dataset.action==='我的邀请码'){openModal(inviteModal);return;}
 if(event.target.closest('.settings-trigger')){openModal(settingsModal);return;}
 if(event.target.closest('.invite-close')){closeModal(inviteModal);return;}
 if(event.target.closest('.settings-close')){closeModal(settingsModal);return;}
 if(event.target.matches('.modal')){closeModal(event.target);return;}
 if(action)showToast(action.dataset.action);
 const tab=event.target.closest('[data-tab]');if(!tab)return;
 const tabs=[...document.querySelectorAll('.tab')];tabs.forEach(item=>{item.classList.toggle('active',item===tab);item.setAttribute('aria-current',item===tab?'page':'false');});
 tab.closest('.tabbar').dataset.activeTab=tabs.indexOf(tab);if(tab.dataset.tab!=='我的')showToast(`已切换到${tab.dataset.tab}`);
});
document.addEventListener('keydown',event=>{
 const modal=document.querySelector('.modal:not([hidden])');if(!modal)return;
 if(event.key==='Escape')closeModal(modal);
 if(event.key==='Tab'){const controls=[...modal.querySelectorAll('a,button')];const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
});
function fitReferenceCanvas(){const scale=Math.min((innerWidth-32)/399,(innerHeight-32)/878,1);document.documentElement.style.setProperty('--device-scale',Math.max(scale,.2));}
fitReferenceCanvas();addEventListener('resize',fitReferenceCanvas,{passive:true});
    /* 授课中心入口红点：抢单大厅有待接单需求，或该教师有待确认约课时亮起 */
    function updateTeachingEntryDot() {
      const dot = document.querySelector('#teachingDot');
      if (!dot) return;
      if (!window.YZB) { dot.hidden = true; return; }
      const market = YZB.list().filter(item => item.isPlan && item.orderMode === 'demand' && !item.teacherAccepted && item.status === 'pending' && YZB.demandPushable('zhang', item)).length;
      const pending = YZB.forTeacher('zhang', ['pending']).length;
      const total = market + pending;
      dot.setAttribute('aria-label', total + ' 条待处理约课');
      dot.hidden = !total;
      dot.title = market ? (market + ' 条待接单需求') : (pending ? (pending + ' 条约课待确认') : '');
    }
    updateTeachingEntryDot();
    addEventListener('storage', event => { if (!event.key || event.key.indexOf('yzb-booking') === 0) updateTeachingEntryDot(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) updateTeachingEntryDot(); });

window.parent.postMessage({channel:'personal-center-restored',page:'profile'},'*');
</script>
