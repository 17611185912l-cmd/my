<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5cf98">
  <title>个人中心 v2.0</title>
  <style>
    :root {
      --blue: #c87312;
      --green: #09c978;
      --orange: #ff6b0a;
      --ink: #111318;
      --muted: #6c7079;
      --icon: #506076;
      --page: #f5f5f7;
      --bubble: #f0f4f8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #e7eaee;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button { margin: 0; padding: 0; border: 0; color: inherit; font: inherit; background: none; cursor: pointer; }
    svg { display: block; }
    .icon { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }

    .phone-shell {
      position: relative;
      isolation: isolate;
      width: min(464px, calc(100vw - 32px), calc(47.347svh - 15.15px));
      aspect-ratio: 464 / 980;
      padding: 12px;
      border: 1px solid #777d84;
      border-radius: 66px;
      background: linear-gradient(135deg, #bfc3c7 0%, #f4f5f6 20%, #8d9298 49%, #d9dcdf 72%, #73787e 100%);
      box-shadow: 0 34px 70px rgba(32,38,45,.28), 0 10px 22px rgba(32,38,45,.18), inset 0 0 0 1px rgba(255,255,255,.75), inset 0 0 0 3px rgba(33,36,40,.68);
    }
    .phone-shell::before {
      content: "";
      position: absolute;
      z-index: 2;
      left: -4px;
      top: 173px;
      width: 4px;
      height: 61px;
      border-radius: 3px 0 0 3px;
      background: #737980;
      box-shadow: 0 78px 0 #737980;
    }
    .phone-shell::after {
      content: "";
      position: absolute;
      z-index: 2;
      right: -4px;
      top: 222px;
      width: 4px;
      height: 94px;
      border-radius: 0 3px 3px 0;
      background: #737980;
    }
    .dynamic-island {
      position: absolute;
      z-index: 30;
      top: 22px;
      left: 50%;
      width: 126px;
      height: 34px;
      transform: translateX(-50%);
      border-radius: 20px;
      background: #050505;
      box-shadow: 0 1px 2px rgba(255,255,255,.12), inset 0 0 0 1px #000;
      pointer-events: none;
    }
    .dynamic-island::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 11px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #111a25;
      box-shadow: inset 0 0 0 2px #080b10, 0 0 2px #1a4d79;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      border-radius: 54px;
      background: var(--page);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.52);
    }
    .page {
      width: 100%;
      height: 100%;
      padding: 0 12px 104px;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }
    .page::-webkit-scrollbar { display: none; }

    .statusbar {
      height: 32px;
      padding: 11px 22px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      color: #050505;
      font-size: 15px;
      line-height: 1;
      font-weight: 700;
    }
    .device-status { display: flex; align-items: center; gap: 8px; }
    .signal { width: 18px; height: 12px; display: flex; align-items: flex-end; gap: 2px; }
    .signal i { width: 3px; border-radius: 2px 2px 0 0; background: #050505; }
    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 7px; }
    .signal i:nth-child(3) { height: 10px; }
    .signal i:nth-child(4) { height: 12px; }
    .wifi { position: relative; width: 18px; height: 13px; overflow: hidden; }
    .wifi::before, .wifi::after {
      content: "";
      position: absolute;
      left: 50%;
      border: 2px solid #050505;
      border-color: #050505 transparent transparent;
      border-radius: 50%;
      transform: translateX(-50%);
    }
    .wifi::before { top: 0; width: 19px; height: 17px; }
    .wifi::after { top: 5px; width: 10px; height: 9px; }
    .wifi i { position: absolute; left: 8px; bottom: 0; width: 3px; height: 3px; border-radius: 50%; background: #050505; }
    .battery { position: relative; width: 23px; height: 11px; padding: 2px; border: 1.5px solid #919191; border-radius: 3px; }
    .battery::before { content: ""; display: block; width: 100%; height: 100%; border-radius: 1px; background: #050505; }
    .battery::after { content: ""; position: absolute; top: 3px; right: -3px; width: 2px; height: 5px; border-radius: 0 2px 2px 0; background: #b4b4b4; }

    .titlebar { position: relative; height: 56px; display: flex; align-items: center; }
    .titlebar h1 { width: 100%; margin: 0 0 1px; color: #303135; font-size: 20px; line-height: 1; font-weight: 600; letter-spacing: 0; text-align: center; }
    .capsule {
      position: absolute;
      right: 5px;
      top: 9px;
      width: 80px;
      height: 28px;
      border: 1px solid #ebe8e6;
      border-radius: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      background: rgba(255,255,255,.9);
    }
    .dots { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; gap: 3px; }
    .dots i { width: 4px; height: 4px; border-radius: 50%; background: #15171b; }
    .mini-ring { width: 15px; height: 15px; margin: auto; border: 1.8px solid #111318; border-radius: 50%; position: relative; }
    .mini-ring::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #111318; }

    .card { background: #fff; border-radius: 11px; }
    .profile {
      position: relative;
      height: 88px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      align-items: center;
      padding: 9px 12px 8px 15px;
      background: #fff;
    }
    .profile-avatar { width: 62px; height: 62px; object-fit: cover; border-radius: 50%; }
    .profile-copy { min-width: 0; padding-left: 7px; }
    .name-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .name-row strong { overflow: hidden; text-overflow: ellipsis; font-size: 17px; line-height: 22px; }
    .role-tag { padding: 2px 6px; border-radius: 4px; color: #535965; background: #f1f3f6; font-size: 14px; }
    .membership { margin-top: 8px; display: flex; align-items: center; gap: 6px; color: #626572; font-size: 14px; white-space: nowrap; }
    .membership b { color: #545b66; font-weight: 500; }
    .membership-divider { width: 1px; height: 14px; background: #b77a3d; }
    .section { margin-top: 12px; padding: 17px 15px 14px; }
    .section-head { height: 23px; display: flex; align-items: center; justify-content: space-between; }
    .section h2 { margin: 0; font-size: 18px; line-height: 23px; font-weight: 700; letter-spacing: 0; }
    .more { display: flex; align-items: center; gap: 7px; color: #777a81; font-size: 14px; text-decoration: none; }
    .more::after { content: ""; width: 7px; height: 7px; border: solid #9299a5; border-width: 1px 1px 0 0; transform: rotate(45deg); }

    .maker { height: 154px; }
    .maker-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); }
    .stat { display: flex; flex-direction: column; align-items: center; }
    .stat .bubble { width: 47px; height: 47px; }
    .stat .icon { width: 30px; height: 30px; stroke-width: 0; }
    .stat-value { margin-top: 3px; font-size: 16px; line-height: 20px; }
    .stat:nth-child(1) .stat-value { color: #1675f6; }
    .stat:nth-child(2) .stat-value { color: #13c878; }
    .stat:nth-child(3) .stat-value { color: #f06c16; }
    .stat-value small { font-size: 14px; }
    .stat-label { margin-top: 1px; font-size: 14px; line-height: 18px; }
    .bubble { border-radius: 50%; display: grid; place-items: center; color: var(--icon); background: var(--bubble); }
    .stat:nth-child(1) .bubble { color: #2f83f5; background: #eef5ff; }
    .stat:nth-child(2) .bubble { color: #04c86f; background: #ebf9f2; }
    .stat:nth-child(3) .bubble { color: var(--orange); background: #fff3ec; }

    .menu-section { height: 128px; margin-top: 13px; padding-top: 17px; }
    .maker + .menu-section { height: 127px; }
    .menu-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(4, 1fr); }
    .menu-item { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; color: inherit; font-size: 14px; text-decoration: none; white-space: nowrap; }
    .menu-item .bubble { width: 39px; height: 39px; }
    .menu-item .icon { width: 21px; height: 21px; stroke-width: 2; }
    .promotion-entry {
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 7px;
      align-items: center;
      gap: 10px;
      color: #28445f;
      text-align: left;
      text-decoration: none;
    }
    .promotion-entry .bubble {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      color: #3973ad;
      background: #eaf4ff;
    }
    .promotion-entry .icon { width: 22px; height: 22px; stroke-width: 2; }
    .promotion-copy { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .promotion-copy strong { font-size: 16px; line-height: 22px; font-weight: 650; }
    .promotion-copy small { overflow: hidden; color: #718091; font-size: 14px; line-height: 20px; text-overflow: ellipsis; white-space: nowrap; }
    .promotion-arrow { width: 7px; height: 7px; border: solid #8c99a8; border-width: 1px 1px 0 0; transform: rotate(45deg); }
    .service-section { height: 128px; }
    .service-section .menu-grid { grid-template-columns: repeat(3, 1fr); }
    .service-section .menu-item .bubble { width: 39px; height: 39px; }

    .quick-links { height: 82px; margin-top: 12px; padding: 11px 0 8px; display: grid; grid-template-columns: repeat(3, 1fr); }
    .quick-link { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; }
    .quick-link + .quick-link::before { content: ""; position: absolute; left: 0; top: 8px; width: 1px; height: 34px; background: #e5e5e5; }
    .quick-link .icon { width: 23px; height: 23px; color: var(--blue); stroke-width: 2; }

    .info-card { height: 115px; margin-top: 12px; padding: 15px; }
    .info-row { width: 100%; height: 41px; display: flex; align-items: center; gap: 11px; text-align: left; font-size: 14px; }
    .info-row + .info-row { border-top: 1px solid #e5e5e5; }
    .info-row .icon { width: 18px; height: 18px; color: var(--icon); stroke-width: 2; }
    .info-row::after { content: ""; width: 7px; height: 7px; margin-left: auto; border: solid #9098a5; border-width: 2px 2px 0 0; transform: rotate(45deg); }
    .logout-action {
      width: 100%;
      height: 48px;
      margin-top: 6px;
      border-radius: 11px;
      color: #df4b4b;
      background: #fff;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }
    .logout-action:active { background: #fff5f5; }

    .invite-modal {
      position: absolute;
      z-index: 50;
      inset: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: rgba(24, 29, 36, .5);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .2s ease, visibility .2s ease;
    }
    .invite-modal.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .invite-panel {
      position: relative;
      width: min(330px, 100%);
      padding: 22px 22px 20px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 18px 42px rgba(24, 29, 36, .2);
      text-align: center;
      transform: translateY(10px);
      transition: transform .2s ease;
    }
    .invite-modal.open .invite-panel { transform: translateY(0); }
    .invite-panel h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 650; }
    .invite-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      color: #7b828c;
      background: #f3f5f7;
      font-size: 22px;
      line-height: 28px;
    }
    .invite-qr {
      display: block;
      width: 220px;
      height: 220px;
      margin: 18px auto 8px;
      object-fit: contain;
    }
    .invite-note { margin: 0; color: #737985; font-size: 14px; line-height: 21px; }
    .invite-save {
      height: 46px;
      margin-top: 18px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      color: #fff;
      background: #4b7fb8;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }

    .tabbar {
      position: absolute;
      z-index: 20;
      left: 0;
      bottom: 0;
      width: 100%;
      height: calc(88px + env(safe-area-inset-bottom));
      padding: 4px 0 env(safe-area-inset-bottom);
      transform: none;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(255,255,255,.98);
      box-shadow: 0 -6px 14px rgba(45,52,67,.08);
    }
    .tab { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #999b9d; font-size: 14px; white-space: nowrap; }
    .tab .icon { width: 22px; height: 22px; stroke-width: 2; }
    .tab.active { color: #c87312; font-weight: 700; }
    .tab.crown .icon { fill: currentColor; stroke: none; }
    .tab.message .icon { fill: currentColor; stroke: none; }
    .tab.mine .icon { fill: currentColor; stroke: none; }

    .toast {
      position: absolute;
      z-index: 40;
      left: 50%;
      bottom: 92px;
      max-width: 280px;
      padding: 8px 14px;
      transform: translate(-50%, 10px);
      border-radius: 5px;
      color: #fff;
      background: rgba(20,22,27,.86);
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .home-indicator {
      position: absolute;
      z-index: 25;
      left: 50%;
      bottom: 6px;
      width: 126px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 4px;
      background: #111;
      pointer-events: none;
    }
    .clickable { transition: transform .12s ease, opacity .12s ease; }
    .clickable:active { transform: scale(.96); opacity: .72; }

    @media (max-width: 370px) {
      .page { padding-inline: 9px; }
      .profile { grid-template-columns: 61px minmax(0, 1fr); padding-inline: 11px 8px; }
      .profile-copy { padding-left: 5px; }
      .name-row strong { font-size: 16px; }
      .menu-item { font-size: 14px; }
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .phone-shell { width: min(464px, calc(100vw - 24px), calc(47.347svh - 11.36px)); }
    }

    /* Reference canvas: 464 x 1090, with a 440px mini-program viewport. */
    body {
      min-height: 100svh;
      padding: 0;
      display: block;
      position: relative;
      overflow-x: hidden;
      background: #050505;
    }
    .phone-shell {
      position: absolute;
      left: 50%;
      top: 0;
      width: 464px;
      height: 1090px;
      aspect-ratio: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #050505;
      box-shadow: none;
      transform: translateX(-50%) scale(var(--page-scale, 1));
      transform-origin: top center;
    }
    .phone-shell::before,
    .phone-shell::after,
    .dynamic-island,
    .home-indicator { display: none; }
    .app {
      position: absolute;
      left: 12px;
      top: 0;
      width: 440px;
      height: 1082px;
      border-radius: 0;
      background: #f5f4f6;
      box-shadow: none;
    }
    .page {
      height: 1002px;
      padding: 0 12px;
      overflow: hidden;
    }
    .statusbar {
      height: 36px;
      padding: 17px 24px 0;
      font-size: 15px;
      font-weight: 700;
    }
    .device-status { gap: 8px; }
    .titlebar {
      height: 44px;
      align-items: flex-start;
    }
    .titlebar h1 {
      margin: 12px 0 0;
      padding: 0;
      font-size: 18px;
      line-height: 26px;
      font-weight: 600;
      text-align: center;
    }
    .capsule {
      right: 5px;
      top: 13px;
      width: 84px;
      height: 30px;
      border-radius: 16px;
    }
    .card { border-radius: 14px; }
    .profile {
      z-index: 2;
      height: 80px;
      width: calc(100% + 8px);
      margin: -30px 0 0 -8px;
      grid-template-columns: 90px minmax(0, 1fr);
      padding: 0 16px 0 10px;
      overflow: visible;
      border-radius: 0;
      background: transparent;
    }
    .profile::after {
      display: none;
    }
    .avatar-wrap {
      position: relative;
      z-index: 1;
      width: 90px;
      height: 90px;
      transform: translateX(-2px);
      overflow: hidden;
      border-radius: 50%;
      background: transparent;
    }
    .profile-avatar {
      position: absolute;
      inset: 0;
      width: 90px;
      height: 90px;
      object-fit: contain;
      object-position: center;
      border-radius: 50%;
    }
    .profile-copy { position: relative; z-index: 1; padding-left: 2px; }
    .name-row { gap: 8px; }
    .avatar-wrap,
    .profile-name-link { color: inherit; text-decoration: none; }
    .profile-name-link { display: inline-flex; }
    .name-row strong { color: #592d0b; font-size: 18px; line-height: 24px; }
    .role-tag { padding: 2px 6px; color: var(--ink); background: #fff; font-size: 14px; }
    .membership { margin-top: 7px; gap: 7px; color: #755d4b; font-size: 14px; }
    .membership b { color: #a45b08; }
    .membership-date { color: var(--ink); }
    .renew-action { margin-left: 2px; padding: 2px 7px; border: 1px solid rgba(164,91,8,.28); border-radius: 4px; color: #a45b08; background: rgba(255,255,255,.78); font-size: 14px; line-height: 20px; white-space: nowrap; }
    .section { padding: 17px 15px 14px; }
    .section h2 { font-size: 14px; }
    .maker {
      position: relative;
      height: 132px;
      margin: 4px 2px 0;
      padding: 10px 14px 8px;
      border-radius: 14px;
      box-shadow: 0 5px 16px rgba(130,74,16,.11);
    }
    .maker .section-head {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      width: auto;
      height: 24px;
      padding-top: 4px;
      justify-content: center;
      border-top: 0;
    }
    .maker .section-head::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -4px;
      height: 1px;
      background: #f0ebe4;
    }
    .maker .more {
      width: auto;
      height: auto;
      gap: 7px;
      overflow: visible;
      border-radius: 0;
      color: var(--ink);
      background: none;
      font-size: 14px;
    }
    .maker .more::after {
      width: 5px;
      height: 5px;
      margin-left: 0;
      border-color: #9299a5;
    }
    .maker-grid {
      height: 78px;
      margin-top: 0;
      align-items: center;
    }
    .maker .stat {
      position: relative;
      min-height: 44px;
      justify-content: center;
    }
    .maker .stat + .stat::before {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      width: 1px;
      height: 30px;
      background: #eee6dc;
    }
    .maker .stat .bubble { display: none; }
    .maker .stat-value {
      margin-top: 0;
      font-size: 22px;
      line-height: 26px;
      font-weight: 650;
    }
    .maker .stat-value small { font-size: 14px; }
    .maker .stat-label {
      margin-top: 2px;
      color: var(--ink);
      font-size: 14px;
      line-height: 16px;
    }
    .center-shortcuts {
      margin: 10px 2px 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .center-card {
      position: relative;
      height: 96px;
      min-width: 0;
      padding: 12px 11px;
      border: 1px solid transparent;
      border-radius: 8px;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 7px;
      align-items: center;
      gap: 9px;
      overflow: hidden;
      color: #28445f;
      text-decoration: none;
      box-shadow: 0 3px 10px rgba(54,88,118,.07);
    }
    .center-card.teaching { border-color: #dbeafa; background: #eef6ff; }
    .center-card.learning { border-color: #dcefe6; background: #eef9f4; }
    .center-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.9);
    }
    .center-card.teaching .center-icon { color: #3f72ad; }
    .center-card.learning .center-icon { color: #34765d; }
    .center-icon .icon { width: 21px; height: 21px; stroke-width: 2; }
    .center-copy { min-width: 0; display: flex; flex-direction: column; }
    .center-title { min-width: 0; display: flex; align-items: center; gap: 5px; white-space: nowrap; }

  <script>
    try {
      const savedProfile = JSON.parse(window.name || '{}');
      if (savedProfile.scope === 'youzuobiao-profile') {
        if (savedProfile.name) document.querySelector('.name-row strong').textContent = savedProfile.name;
        if (savedProfile.avatar) document.querySelector('.profile-avatar').src = savedProfile.avatar;
      }
    } catch {}
    const toast = document.querySelector('.toast');
    const inviteModal = document.querySelector('.invite-modal');
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1300);
    }

    document.addEventListener('click', event => {
      const route = event.target.closest('[data-route]');
      if (route) {
        window.location.href = route.dataset.route;
        return;
      }
      const action = event.target.closest('[data-action]');
      if (action?.dataset.action === '我的邀请码') {
        inviteModal.classList.add('open');
        inviteModal.setAttribute('aria-hidden', 'false');
        return;
      }
      if (action) showToast(action.dataset.action);

      const tab = event.target.closest('[data-tab]');
      if (!tab) return;
      const tabs = [...document.querySelectorAll('.tab')];
      tabs.forEach(item => item.classList.toggle('active', item === tab));
      tab.closest('.tabbar').dataset.activeTab = tabs.indexOf(tab);
      showToast(`已切换到${tab.dataset.tab}`);
    });

    function closeInviteModal() {
      inviteModal.classList.remove('open');
      inviteModal.setAttribute('aria-hidden', 'true');
    }

    document.querySelector('.invite-close').addEventListener('click', closeInviteModal);
    inviteModal.addEventListener('click', event => {
      if (event.target === inviteModal) closeInviteModal();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && inviteModal.classList.contains('open')) closeInviteModal();
    });

    function fitReferenceCanvas() {
      const horizontalScale = (window.innerWidth - 32) / 464;
      const verticalScale = (window.innerHeight - 32) / 980;
      const scale = Math.min(horizontalScale, verticalScale, 1);
      document.documentElement.style.setProperty('--device-scale', Math.max(scale, .2));
      document.body.style.minHeight = '100svh';
    }

    fitReferenceCanvas();
    window.addEventListener('resize', fitReferenceCanvas, { passive: true });
