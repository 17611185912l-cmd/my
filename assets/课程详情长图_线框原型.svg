<svg xmlns="http://www.w3.org/2000/svg" width="750" height="2480" viewBox="0 0 750 2480">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e5e7eb" stroke-width="1"/></pattern>
    <style>.h{font:700 34px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937}.sh{font:700 24px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1f2937}.p{font:400 20px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280}.sm{font:400 17px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#6b7280}.num{font:700 42px -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#e1251b}.line{stroke:#d1d5db;stroke-width:2;fill:none}.dash{stroke:#9ca3af;stroke-width:2;stroke-dasharray:8 8;fill:#f9fafb}</style>
  </defs>
  <rect width="750" height="2480" fill="#fff"/>
