  <g transform="translate(272 640)"><rect width="206" height="230" rx="6" class="dash"/><circle cx="103" cy="70" r="36" class="line"/><path d="M81 82l18-20 14 12 15-21" class="line"/><text x="103" y="140" text-anchor="middle" class="sh">方法零散</text><text x="103" y="178" text-anchor="middle" class="sm">总结通用模型</text><text x="103" y="204" text-anchor="middle" class="sm">形成解题步骤</text></g>
  <g transform="translate(500 640)"><rect width="206" height="230" rx="6" class="dash"/><circle cx="103" cy="70" r="36" class="line"/><path d="M80 72h46M111 56l16 16-16 16" class="line"/><text x="103" y="140" text-anchor="middle" class="sh">不会迁移</text><text x="103" y="178" text-anchor="middle" class="sm">强化综合应用</text><text x="103" y="204" text-anchor="middle" class="sm">提升举一反三</text></g>

