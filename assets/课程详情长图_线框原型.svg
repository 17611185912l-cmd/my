  <g transform="translate(55 1730)"><rect width="640" height="300" rx="6" class="dash"/><line x1="110" y1="84" x2="530" y2="84" class="line"/><circle cx="110" cy="84" r="24" fill="#fff" stroke="#e1251b" stroke-width="2"/><circle cx="320" cy="84" r="24" fill="#fff" stroke="#e1251b" stroke-width="2"/><circle cx="530" cy="84" r="24" fill="#fff" stroke="#e1251b" stroke-width="2"/><text x="110" y="92" text-anchor="middle" class="sm">1</text><text x="320" y="92" text-anchor="middle" class="sm">2</text><text x="530" y="92" text-anchor="middle" class="sm">3</text><text x="110" y="150" text-anchor="middle" class="sh">课前诊断</text><text x="320" y="150" text-anchor="middle" class="sh">直播授课</text><text x="530" y="150" text-anchor="middle" class="sh">课后巩固</text><text x="110" y="190" text-anchor="middle" class="sm">了解学情</text><text x="320" y="190" text-anchor="middle" class="sm">讲练结合</text><text x="530" y="190" text-anchor="middle" class="sm">练习反馈</text><text x="320" y="250" text-anchor="middle" class="p">每课时 50 分钟 · 支持回放与资料查看</text></g>

  <rect x="0" y="2090" width="750" height="390" fill="#f7f8fa"/>
  <text x="375" y="2170" text-anchor="middle" class="h">购买须知</text>
