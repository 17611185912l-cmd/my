  <g transform="translate(62 1450)"><circle cx="55" cy="55" r="55" fill="#fff" stroke="#e1251b" stroke-width="2"/><text x="55" y="70" text-anchor="middle" class="num">03</text><text x="145" y="46" class="sh">专项训练</text><text x="145" y="82" class="p">针对薄弱环节训练，及时纠正错因</text></g>

