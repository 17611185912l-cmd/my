  <g transform="translate(62 1280)"><circle cx="55" cy="55" r="55" fill="#fff" stroke="#e1251b" stroke-width="2"/><text x="55" y="70" text-anchor="middle" class="num">02</text><text x="145" y="46" class="sh">方法掌握</text><text x="145" y="82" class="p">归纳解题模型，掌握标准操作步骤</text></g>
