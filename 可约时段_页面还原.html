          <label class="view-note" for="specialDate" style="margin-bottom:6px">选择日期</label>
          <select class="special-select" id="specialDate" aria-label="特殊日期"></select>
          <div class="slot-chips" id="specialTimes" aria-label="当天可上课时段"></div>
          <div class="slot-quick">
            <button class="mini-btn" type="button" id="specialAll">全天开放</button>
            <button class="mini-btn" type="button" id="specialNone">当天不开放</button>
          </div>
          <div class="day-actions">
            <button class="mini-btn primary" type="button" id="specialSave">保存当天时段</button>
          </div>
        </div>
        <p class="editor-note" id="specialOffNote" hidden>特殊日期已关闭：家长端只按四类时间展示；重新开启后，已保存的特殊日期继续生效。</p>
      </section>

    </div>
    <div class="toast" id="toast"></div>
  </div></div></main>

  <script src="约课数据.js?v=20260917-6"></script>
  <script>
    const TEACHER_ORDER = ['zhang', 'liming', 'wangjing'];
    let teacherId = 'zhang';
    let draftTimes = [];
    const rangeList = document.querySelector('#rangeList');
    const specialList = document.querySelector('#specialList');
    const specialDateSelect = document.querySelector('#specialDate');
    const specialTimes = document.querySelector('#specialTimes');
    const specialSwitch = document.querySelector('#specialSwitch');
    const specialEditor = document.querySelector('#specialEditor');
    const specialOffNote = document.querySelector('#specialOffNote');
    const toast = document.querySelector('#toast');

    document.querySelector('.back').onclick = () => location.href = '授课中心_页面还原.html';

    function showToast(text) { toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1800); }

    function renderRanges() {
      rangeList.innerHTML = YZB.availability(teacherId).map(item => `
        <div class="range-row ${item.open ? 'is-open' : ''}">
          <span class="range-mark">${item.label.slice(0, 1)}</span>
          <span class="range-copy"><strong>${item.label}</strong><span>${item.note}</span></span>
          <span class="range-status">${item.open ? '可约' : '不开放'}</span>
          <button class="switch" type="button" role="switch" data-range="${item.id}" aria-checked="${item.open}" aria-label="${item.label}${item.open ? ' 关闭' : ' 开放'}"></button>
        </div>`).join('');
    }

    function renderDateSelect(keepDate) {
      const marked = {};
      YZB.specialDates(teacherId).forEach(item => { marked[item.date] = true; });
      const options = YZB.days();
      specialDateSelect.innerHTML = options.map(day =>
        `<option value="${day.date}">${day.label}（${day.week}）${marked[day.date] ? ' · 已调整' : ''}</option>`).join('');
      specialDateSelect.value = options.some(day => day.date === keepDate) ? keepDate : (options[0] ? options[0].date : '');
    }

    function renderSpecialSwitch() {
      const on = YZB.specialEnabled(teacherId);
      specialSwitch.setAttribute('aria-checked', on ? 'true' : 'false');
      specialSwitch.setAttribute('aria-label', '特殊日期' + (on ? ' 关闭' : ' 开启'));
      specialEditor.hidden = !on;
      specialOffNote.hidden = on;
    }

    function timesSummary(times) {
      if (!times.length) return '当天不开放';
      if (times.length === YZB.times().length) return '全天开放（08:00 - 23:30）';
      return times.length <= 6 ? times.join('、') : `已选 ${times.length} 个时段`;
    }

    function renderSpecialList() {
      const enabled = YZB.specialEnabled(teacherId);
      const items = YZB.specialDates(teacherId);
      specialList.innerHTML = items.map(item => `
        <div class="special-row ${item.date === specialDateSelect.value ? 'active' : ''}${enabled ? '' : ' muted'}"${enabled ? ` data-date="${item.date}"` : ''}>
          <span class="special-copy"><strong>${item.label} · ${item.week}</strong><span>${timesSummary(item.times)}</span></span>
          <span class="special-tag${item.times.length ? '' : ' closed'}">${enabled ? '已调整' : '未生效'}</span>
          <button class="special-del" type="button" data-del="${item.date}" aria-label="删除 ${item.label} 特殊日期">删除</button>
        </div>`).join('') || '<div class="special-empty">还没有特殊日期，四类时间之外的临时安排可以加在这里。</div>';
    }

    function renderChips() {
      specialTimes.innerHTML = YZB.times().map(time =>
        `<button class="slot-chip ${draftTimes.indexOf(time) > -1 ? 'active' : ''}" type="button" data-time="${time}">${time}</button>`).join('');
    }

    function loadDraft() {
      const date = specialDateSelect.value;
      const current = YZB.specialDates(teacherId).filter(item => item.date === date)[0];
      draftTimes = current ? current.times.slice() : YZB.dayTimes(teacherId, date);
      renderChips();
    }

    function render(keepDate) {
      renderSpecialSwitch();
      renderRanges();
      renderDateSelect(keepDate === undefined ? specialDateSelect.value : keepDate);
      renderSpecialList();
      loadDraft();
    }

    rangeList.addEventListener('click', event => {
      const toggle = event.target.closest('.switch');
      if (!toggle) return;
      const rangeId = toggle.dataset.range;
      const next = toggle.getAttribute('aria-checked') !== 'true';
      YZB.setAvailability(teacherId, rangeId, next);
      render();
      showToast((next ? '已开放 ' : '已关闭 ') + YZB.timeRange(rangeId).label);
    });

    specialList.addEventListener('click', event => {
      const remove = event.target.closest('[data-del]');
      if (remove) {
        const date = remove.dataset.del;
        const day = YZB.dayInfo(date);
        YZB.clearSpecialDate(teacherId, date);
        render(date);
        showToast(`${day.label} 已恢复跟随四类时间`);
        return;
      }
      const row = event.target.closest('[data-date]');
      if (!row) return;
      render(row.dataset.date);
    });

    specialDateSelect.onchange = () => { renderSpecialList(); loadDraft(); };

    specialTimes.addEventListener('click', event => {
      const chip = event.target.closest('[data-time]');
      if (!chip) return;
      const time = chip.dataset.time;
      const index = draftTimes.indexOf(time);
      if (index > -1) draftTimes.splice(index, 1); else draftTimes.push(time);
      renderChips();
    });

    document.querySelector('#specialAll').onclick = () => { draftTimes = YZB.times().slice(); renderChips(); };

    document.querySelector('#specialNone').onclick = () => { draftTimes = []; renderChips(); };

    document.querySelector('#specialSave').onclick = () => {
      const date = specialDateSelect.value;
      YZB.setSpecialDate(teacherId, date, draftTimes);
      const day = YZB.dayInfo(date);
      render(date);
      showToast(draftTimes.length ? `已保存 ${day.label} 的 ${draftTimes.length} 个时段` : `${day.label} 已设为当天不开放`);
    };

    specialSwitch.onclick = () => {
      const next = !YZB.specialEnabled(teacherId);
      YZB.setSpecialEnabled(teacherId, next);
      render();
      showToast(next ? '特殊日期已开启' : '特殊日期已关闭，所有特殊日期不再生效');
    };

    document.querySelector('#teacherSwitch').onclick = () => {
      const next = (TEACHER_ORDER.indexOf(teacherId) + 1) % TEACHER_ORDER.length;
      teacherId = TEACHER_ORDER[next];
      document.querySelector('#teacherSwitch').textContent = '演示老师：' + YZB.teacher(teacherId).name.replace('老师', '');
      render();
      showToast('已切换到 ' + YZB.teacher(teacherId).name + ' 的可约时段');
    };

    render();
    function fitFrame() { const scale = Math.min((innerWidth - 32) / 464, (innerHeight - 32) / 980, 1); document.documentElement.style.setProperty('--device-scale', Math.max(scale, .2)); }
    fitFrame(); addEventListener('resize', fitFrame, { passive: true });
  </script>
<script src="原型开发说明.js?v=20260917-3"></script>
</body>
