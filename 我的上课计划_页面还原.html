    .plan-editor-grid select{width:100%;height:36px;padding:0 8px;border:1px solid #d8e1eb;border-radius:6px;background:#fff;color:#24262b;font-size:13.5px}
    .plan-tip{margin:6px 0 0;color:#8a94a1;font-size:12.5px;line-height:18px}
    .pick-block{margin-bottom:12px;padding:0 12px}
    .pick-title{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:14px;line-height:18px;font-weight:600;color:#24262b}
    .pick-step{width:18px;height:18px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;color:#fff;background:#4b7fb8;font-size:11px;font-weight:600}
    .pick-note{margin-left:auto;color:#8a94a1;font-size:12px;font-weight:400}
    .pick-course{width:100%;height:40px;padding:0 10px;border:1px solid #d8e1eb;border-radius:6px;background:#fff;color:#24262b;font-size:14px}
    .pick-block.time-block{margin-bottom:0;padding:11px;border:1px solid #e5ebf2;border-radius:8px;background:#f8fbfe}/* 1px 边框计入内缩，步骤 ①/② 序号与下方控件左边缘对齐 */
    /* 添加时段：悬浮在机型右下角，列表再长也不会被挤掉 */
    .plan-add{position:absolute;z-index:20;right:16px;bottom:26px;height:42px;padding:0 18px;border-radius:999px;color:#fff;background:#4b7fb8;font-size:14px;line-height:42px;box-shadow:0 8px 20px rgba(43,84,130,.32)}
    .plan-add:active{background:#3f6fa5}
    .sheet-mask{position:absolute;z-index:40;inset:0;background:rgba(23,32,44,.38)}
    .plan-sheet{position:absolute;z-index:41;left:0;right:0;bottom:0;padding:18px 14px 22px;border-radius:18px 18px 0 0;background:#fff;box-shadow:0 -12px 30px rgba(31,47,66,.18);animation:sheet-up .22s ease-out}
    .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
    .sheet-head strong{display:block;font-size:16px;line-height:22px}
    .sheet-head span{display:block;margin-top:3px;color:#8a94a1;font-size:12.5px;line-height:18px}
    .sheet-close{width:30px;height:30px;flex:0 0 auto;border-radius:50%;color:#6b7480;background:#f1f3f6;font-size:18px;line-height:28px}
    .plan-sheet .day-actions{margin-top:12px}
    .plan-sheet[hidden],.sheet-mask[hidden]{display:none}
    @keyframes sheet-up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  </style>
</head>
<body>
  <main class="phone-shell" aria-label="我的上课时间页面"><div class="dynamic-island" aria-hidden="true"></div><div class="app"><div class="page"><header>
      <div class="statusbar"><span>23:58</span><div class="device-status"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"><i></i></span><span class="battery"></span></div></div>
      <div class="titlebar"><button class="back" type="button" aria-label="返回"></button><h1>家长端 · 我的上课时间</h1><div class="capsule" aria-hidden="true"><span class="dots"><i></i><i></i><i></i></span><span class="ring"></span></div></div>
    </header><div class="content">
      <section class="card panel">
        <div class="plan-list" id="planList" aria-live="polite"></div>
      </section>
    </div>
    <button class="plan-add" type="button" id="addSlot">＋ 添加时段</button>
    <div class="sheet-mask" id="planSheetMask" hidden></div>
    <section class="plan-sheet" id="planSheet" role="dialog" aria-modal="true" aria-labelledby="planSheetTitle" hidden>
      <div class="sheet-head">
        <div><strong id="planSheetTitle">添加时段</strong><span id="planSheetNote">先选课程，再选上课时间；星期可多选</span></div>
        <button class="sheet-close" type="button" id="closeSheet" aria-label="关闭">×</button>
      </div>
      <div class="plan-editor">
        <div class="pick-block">
          <div class="pick-title"><span class="pick-step">1</span>选择课程</div>
          <select class="pick-course" id="courseSelect" aria-label="选择课程"></select>
        </div>
        <div class="pick-block time-block">
          <div class="pick-title"><span class="pick-step">2</span>选择上课时间<span class="pick-note">星期可多选</span></div>
          <div class="day-chips" id="dayChips" role="group" aria-label="星期"></div>
          <div class="plan-editor-grid">
            <div><label for="startTime">开始时间</label><select id="startTime"></select></div>
            <div><label for="endTime">结束时间</label><select id="endTime"></select></div>
          </div>
          <p class="plan-tip" id="durationTip"></p>
        </div>
      </div>
      <div class="day-actions">
        <button class="mini-btn" type="button" id="cancelEdit">取消</button>
        <button class="mini-btn primary" type="button" id="applySlot">添加到计划</button>
      </div>
    </section>
    <div class="toast" id="toast"></div>
  </div></div></main>

  <script src="约课数据.js?v=20260918-14"></script>
  <script>
    const WEEKDAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const END_STEP_MINUTES = 30;
    const DAY_END_MINUTES = 23 * 60 + 30;
    const pageParams = new URLSearchParams(location.search);
    const fromBooking = pageParams.get('from') === 'booking';
    const backParams = new URLSearchParams();
    ['teacher', 'mode', 'start', 'end'].forEach(key => { const value = pageParams.get(key); if (value) backParams.set(key, value); });
    const courseList = YZB.courses();
    const requestedCourse = pageParams.get('course') || '';
    const bookingCourseId = courseList.some(course => course.id === requestedCourse) ? requestedCourse : courseList[0].id;
    let slots = loadSlots();
    let selectedDays = new Set();
    let editingIndex = -1;

    const addSlot = document.querySelector('#addSlot');
    const planSheet = document.querySelector('#planSheet');
    const planSheetMask = document.querySelector('#planSheetMask');
    const planSheetTitle = document.querySelector('#planSheetTitle');
    const planSheetNote = document.querySelector('#planSheetNote');
    const closeSheet = document.querySelector('#closeSheet');
    const courseSelect = document.querySelector('#courseSelect');
    const planList = document.querySelector('#planList');
    const dayChips = document.querySelector('#dayChips');
    const startTime = document.querySelector('#startTime');
    const endTime = document.querySelector('#endTime');
    const durationTip = document.querySelector('#durationTip');
    const applySlot = document.querySelector('#applySlot');
    const cancelEdit = document.querySelector('#cancelEdit');
    const toast = document.querySelector('#toast');

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
    function sortSlots(a, b) { return a.weekday - b.weekday || a.time.localeCompare(b.time) || courseList.findIndex(course => course.id === a.courseId) - courseList.findIndex(course => course.id === b.courseId); }
    function loadSlots() {
      const plans = YZB.plans();
      return courseList.reduce((list, course) => list.concat((plans[course.id] || []).map(slot => ({ courseId: course.id, weekday: Number(slot.weekday), time: slot.time, end: slot.end }))), []).sort(sortSlots);
    }
    function persistPlans() {
      courseList.forEach(course => {
        YZB.savePlan(course.id, slots.filter(slot => slot.courseId === course.id).map(slot => ({ weekday: slot.weekday, time: slot.time, end: slot.end })));
      });
    }
    function subjectOf(id) { const course = courseList.find(item => item.id === id); return course ? course.subject : ''; }
    function minutesToText(minutes) { return String(Math.floor(minutes / 60)).padStart(2, '0') + ':' + String(minutes % 60).padStart(2, '0'); }
    function lessonsText(value) { return Number.isInteger(value) ? value : (Math.round(value * 10) / 10); }
    function lengthText(minutes) {
      if (minutes % 60 === 0) return (minutes / 60) + ' 小时';
      if (minutes % 30 === 0) return (minutes / 60).toFixed(1) + ' 小时';
      const hours = Math.floor(minutes / 60), rest = minutes % 60;
      return hours ? hours + ' 小时 ' + rest + ' 分钟' : minutes + ' 分钟';
    }
    function endOptionsFor(start) {
      const base = YZB.timeToMinutes(start), options = [];
      for (let minute = base + END_STEP_MINUTES; minute <= DAY_END_MINUTES; minute += END_STEP_MINUTES) options.push(minutesToText(minute));
      return options;
    }
    function renderTimeSelects() {
      const keepStart = startTime.value;
      startTime.innerHTML = YZB.times().map(time => `<option value="${time}">${time}</option>`).join('');
      startTime.value = keepStart && YZB.times().indexOf(keepStart) >= 0 ? keepStart : '19:00';
      const keepEnd = endTime.value;
      const values = endOptionsFor(startTime.value);
      endTime.innerHTML = values.map(time => `<option value="${time}">${time}</option>`).join('');
      endTime.value = values.indexOf(keepEnd) >= 0 ? keepEnd : (values.indexOf('20:30') >= 0 ? '20:30' : (values[0] || ''));
      endTime.disabled = !values.length;
    }
    function renderDays() {
      dayChips.innerHTML = WEEKDAYS.map((label, index) => `<button class="day-chip ${selectedDays.has(index) ? 'active' : ''}" type="button" data-day="${index}" aria-pressed="${selectedDays.has(index)}">${label}</button>`).join('');
    }
    function renderTip() {
      const start = startTime.value, end = endTime.value;
      if (!start || !end) { durationTip.textContent = '该开始时间没有可用的结束时间，请换一个开始时间'; return; }
      const slot = { time: start, end: end };
      durationTip.textContent = '每节 ' + lengthText(YZB.slotMinutes(slot)) + ' · ' + lessonsText(YZB.slotLessons(slot)) + ' 课时（45 分钟 = 1 课时，按整课时计）';
    }
    function renderCourses() {
      const keep = courseSelect.value;
      courseSelect.innerHTML = courseList.map(course => `<option value="${course.id}">${course.subject}</option>`).join('');
      const preferred = courseList.some(course => course.id === keep) ? keep : bookingCourseId;
      courseSelect.value = courseList.some(course => course.id === preferred) ? preferred : courseList[0].id;
    }
    function renderList() {
      planList.innerHTML = slots.length ? slots.map((slot, index) => `
        <div class="plan-row">
          <span><strong>每${WEEKDAYS[slot.weekday]} ${YZB.timeRangeText(slot.time, slot.end)} · ${subjectOf(slot.courseId)}</strong><em>每节 ${lengthText(YZB.slotMinutes(slot))} · ${lessonsText(YZB.slotLessons(slot))} 课时</em></span>
          <span class="row-actions"><button type="button" data-edit="${index}">编辑</button><button class="danger" type="button" data-remove="${index}">删除</button></span>
        </div>`).join('') : '<div class="plan-empty">还没有上课时间，请添加</div>';
    }
    function renderEditor() {
      applySlot.textContent = editingIndex >= 0 ? '保存修改' : '添加到计划';
      renderDays();
      renderTimeSelects();
      renderTip();
    }
    function sheetNoteText() {
      if (editingIndex < 0) return '先选课程，再选上课时间；星期可多选';
      const slot = slots[editingIndex];
      return '正在编辑：每' + WEEKDAYS[slot.weekday] + ' ' + YZB.timeRangeText(slot.time, slot.end) + ' · ' + subjectOf(slot.courseId);
    }
    function openSheet(index) {
      if (index >= 0) {
        const slot = slots[index];
        editingIndex = index;
        selectedDays = new Set([slot.weekday]);
        courseSelect.value = slot.courseId;
        startTime.value = slot.time;
        endTime.value = slot.end;
        planSheetTitle.textContent = '编辑时段';
      } else {
        editingIndex = -1;
        selectedDays = new Set();
        courseSelect.value = bookingCourseId;
        startTime.value = '19:00';
        endTime.value = '20:30';
        planSheetTitle.textContent = '添加时段';
      }
      planSheetNote.textContent = sheetNoteText();
      planSheet.hidden = false;
      planSheetMask.hidden = false;
      renderEditor();
    }
    function closeSheetEditor() {
      planSheet.hidden = true;
      planSheetMask.hidden = true;
      editingIndex = -1;
      selectedDays = new Set();
      renderEditor();
    }
    function renderAll() { renderCourses(); renderList(); renderEditor(); }
    function returnUrl() {
      const query = new URLSearchParams(backParams);
      query.set('course', bookingCourseId);
      return '约课_页面还原.html?' + query.toString();
    }

    planList.addEventListener('click', event => {
      const edit = event.target.closest('[data-edit]');
      if (edit) {
        openSheet(Number(edit.dataset.edit));
        return;
      }
      const remove = event.target.closest('[data-remove]');
      if (!remove) return;
      slots.splice(Number(remove.dataset.remove), 1);
      selectedDays = new Set();
      editingIndex = -1;
      persistPlans();
      renderAll();
      showToast('已删除');
    });
    dayChips.addEventListener('click', event => {
      const chip = event.target.closest('[data-day]');
      if (!chip) return;
      const index = Number(chip.dataset.day);
      if (editingIndex >= 0) selectedDays = new Set([index]);
      else if (selectedDays.has(index)) selectedDays.delete(index); else selectedDays.add(index);
      renderDays();
    });
    startTime.addEventListener('change', () => { renderTimeSelects(); renderTip(); });
    endTime.addEventListener('change', renderTip);
    applySlot.addEventListener('click', () => {
      const days = Array.from(selectedDays).sort((a, b) => a - b);
      if (!days.length) { showToast('请先选择星期'); return; }
      const time = startTime.value, end = endTime.value, courseId = courseSelect.value;
      if (!time || !end || end <= time) { showToast('请选择正确的起止时间'); return; }
      const wasEditing = editingIndex >= 0;
      if (wasEditing) {
        if (slots.some((slot, index) => index !== editingIndex && slot.weekday === days[0] && slot.time === time && slot.end === end)) { showToast('这个时间已经有其他课程'); return; }
        slots[editingIndex] = { courseId, weekday: days[0], time, end };
      } else {
        const added = [];
        days.forEach(day => {
          if (slots.some(slot => slot.weekday === day && slot.time === time && slot.end === end)) return;
          slots.push({ courseId, weekday: day, time, end });
          added.push(day);
        });
        if (!added.length) { showToast('这些时间已经在计划里了'); return; }
      }
      slots.sort(sortSlots);
      persistPlans();
      renderAll();
      closeSheetEditor();
      showToast(wasEditing ? '修改已保存' : (fromBooking ? '已保存，返回约课继续' : '已添加到课程计划'));
    });
    addSlot.addEventListener('click', () => openSheet(-1));
    cancelEdit.addEventListener('click', closeSheetEditor);
    closeSheet.addEventListener('click', closeSheetEditor);
    planSheetMask.addEventListener('click', closeSheetEditor);
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && !planSheet.hidden) closeSheetEditor(); });
    document.querySelector('.back').onclick = () => {
      location.href = fromBooking ? returnUrl() : '学习中心_页面还原.html';
    };

    renderAll();
    function fit() { const scale = Math.min((innerWidth - 32) / 464, (innerHeight - 32) / 980, 1); document.documentElement.style.setProperty('--device-scale', Math.max(scale, .2)); }
    fit(); addEventListener('resize', fit, { passive: true });

  </script>
